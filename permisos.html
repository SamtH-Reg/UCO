function calClick(s){
  var f=_form,t=_tab;
  var dt=new Date(s+'T12:00:00'), w=dt.getDay();
  if(t===2){
    // Se permite sábado (los días sindicales cuentan sábados); domingo/feriado no.
    if(FERIADOS[s] || w===0){ toast('No puedes iniciar en domingo o feriado','warn'); return; }
    f.start=s; render(); return;
  }
  // Día de permiso y media jornada: no se otorgan en domingo ni feriados.
  if(FERIADOS[s] || w===0){ toast('No se otorgan permisos en domingo ni feriados','warn'); return; }
  if(t===1){ f.dates=f.dates[0]===s?[]:[s]; render(); return; }
  var i=f.dates.indexOf(s);
  if(i>=0) f.dates.splice(i,1);
  else {
    var cup=cupos(s);
    if(f.tipo==='PERSONAL'&&cup.personal>=CUPO_PERSONAL_MAX&&cup.total<CUPO_MAX){
      if(!confirm('El '+fmt(s)+' ya registra '+cup.personal+' permisos personales (tope diario). ¿Deseas continuar?')) return;
    } else if(cup.total>=CUPO_MAX){
      if(!confirm('El '+fmt(s)+' ya tiene '+cup.total+'/'+CUPO_MAX+' cupos. Si continúas, quedará sobre el cupo máximo y requerirá autorización de jefatura.')) return;
    }
    f.dates.push(s); f.dates.sort();
  }
  render();
}

// Horas de permiso del formulario (media jornada):
//  - CON regreso:  hora ingreso  − hora salida
//  - SIN regreso:  fin del turno − hora salida
//  - INGRESO a planta: hora ingreso − inicio del turno
function _horasPermisoForm(f){
  var ho=_TURNOS_H[String(f.turno||'DIA').toUpperCase()]||_TURNOS_H.DIA;
  var mins;
  if(f.reg==='SIN'){
    if(!f.hs) return null;
    mins=ho[1]-_min(f.hs); if(mins<0) mins+=1440;
  } else if(f.reg==='ING'){
    if(!f.hi) return null;
    mins=_min(f.hi)-ho[0]; if(mins<0) mins+=1440;
  } else {
    if(!f.hs||!f.hi) return null;
    mins=_min(f.hi)-_min(f.hs); if(mins<0) mins+=1440;
  }
  return mins/60;
}
// HORAS TRABAJADAS = SI((9 − sin_trabajo) > 5; 8,5 − sin_trabajo; 9 − sin_trabajo)
function _horasTrabajadasDe(sinTrabajo){
  if(sinTrabajo==null) return null;
  var t=9-sinTrabajo; if(t>5) t=8.5-sinTrabajo;
  return Math.round(t*100)/100;
}
function _horasTrabajadasForm(f){ return _horasTrabajadasDe(_horasPermisoForm(f)); }
function _fmtHN(n){ return (n==null||isNaN(n))?'—':(Math.round(n*100)/100).toFixed(2).replace('.',','); }
function calcularHoras(){
  var h=_horasPermisoForm(_form);
  if(h==null) return '—';
  return _fmtHN(h)+' h';
}
// Actualiza en vivo las horas del formulario (sin recargar)
function actualizarHoras(){
  var h=_horasPermisoForm(_form);
  var hp=document.getElementById('ok_hp'), ht=document.getElementById('ok_ht');
  if(hp) hp.textContent=(h==null?'—':_fmtHN(h)+' h');
  if(ht){ var t=_horasTrabajadasDe(h); ht.textContent=(t==null?'—':_fmtHN(t)+' h'); }
}
// HORAS DE PERMISO (equivale a la columna "SIN TRABAJO" del sheet):
//   CON REGRESO      -> MOD(hora_ingreso − hora_salida, 1)*24
//   SIN REGRESO      -> MOD(fin_turno   − hora_salida, 1)*24
//   INGRESO A PLANTA -> MOD(hora_ingreso − inicio_turno, 1)*24
// Turnos: DIA 08:00–17:00 · TARDE 15:00–01:00 · NOCHE 20:30–05:30
var _TURNOS_H={DIA:[8*60,17*60], TARDE:[15*60,1*60], NOCHE:[20*60+30,5*60+30]};
function _min(s){ var p=String(s).split(':'); return (+p[0]||0)*60+(+p[1]||0); }
function _hm(mins){ var h=Math.floor(mins/60), m=mins%60; return h+':'+String(m).padStart(2,'0'); }
function _r2(n){ return Math.round(n*100)/100; }
function calcularHorasPermiso(s){
  if(s.horas_permiso!=null&&s.horas_permiso!=='') return s.horas_permiso;
  var reg=String(s.tipo_regreso||'').toUpperCase();
  var turno=String(s.turno||'DIA').toUpperCase(); var ho=_TURNOS_H[turno]||_TURNOS_H.DIA;
  if(reg==='CON'){ if(s.hora_salida&&s.hora_ingreso){ var d=_min(s.hora_ingreso)-_min(s.hora_salida); if(d<0)d+=1440; return _r2(d/60); } return 0; }
  if(reg==='SIN'){ if(s.hora_salida){ var d2=ho[1]-_min(s.hora_salida); if(d2<0)d2+=1440; return _r2(d2/60); } return 0; }
  if(reg==='INGRESO'){ if(s.hora_ingreso){ var d3=_min(s.hora_ingreso)-ho[0]; if(d3<0)d3+=1440; return _r2(d3/60); } return 0; }
  return 0;
}
// Horas trabajadas de un registro = 9 − horas de permiso (con tope de 8,5 al superar 5 h)
function calcularHorasTrabajadas(s){ return _horasTrabajadasDe(parseFloat(calcularHorasPermiso(s))||0); }
// Estado de vacaciones según fórmula del sheet:
//   SI(DIAS_HABILES="";"POR TOMAR"; SI(INICIO>HOY();"POR TOMAR";
//     SI(TERMINO<HOY();"FINALIZADAS";"EN CURSO")))
function estadoDe(s){
  var dias=parseInt(s.dias_habiles)||0;
  var inicio=String(s.inicio||'').slice(0,10);
  var termino=String(s.termino||'').slice(0,10);
  var h=hoy();
  if(!dias) return 'POR TOMAR';
  if(inicio && inicio>h) return 'POR TOMAR';
  if(termino && termino<h) return 'FINALIZADAS';
  return 'EN CURSO';
}
function formStatus(){
  var f=_form,t=_tab;
  if(!f.emp) return 'Selecciona un empleado para continuar';
  if(t===2) return (f.start&&f.dias)?'Listo para enviar':'Falta inicio o días de vacaciones';
  if(t===1) return f.dates.length?'Listo para enviar':'Selecciona el día del permiso';
  return f.dates.length?'Listo para enviar':'Selecciona al menos un día';
}

// ── ENVÍO ───────────────────────────────────────────────────
// Guarda (crea o actualiza) la solicitud del formulario SIN resetear ni navegar.
// Devuelve { ok, id, tipo:'insert'|'update' } o { ok:false }.
async function _guardarSolicitud(){
  var f=_form,t=_tab, miss=[];
  if(t!==2){ if(!f.turno)miss.push('turno'); if(!f.tipo)miss.push('tipo de permiso'); if(!f.aut)miss.push('autorizador'); }
  if(!f.emp)miss.push('empleado');
  if(!f.cc)miss.push('centro de costo');
  if(t===2){
    if(!f.start)miss.push('inicio de vacaciones');
    if(!f.dias)miss.push('días hábiles');
    // Sin fecha de ingreso no hay forma de validar el saldo (solo en solicitudes nuevas:
    // al editar un registro antiguo de alguien que ya no está en la nómina se permite)
    if(!_editSolId && !(f.emp&&f.emp.ing)) miss.push('fecha de ingreso del empleado');
  }
  else if(!f.dates.length)miss.push(t===1?'día del permiso':'días de permiso');
  if(miss.length){ toast('Faltan datos obligatorios: '+miss.join(', '),'error'); return {ok:false}; }

  // Aviso anti-duplicado: si el trabajador ya tiene un permiso activo en la misma fecha
  // (dé o no jornada completa) se pide confirmación antes de guardar. Evita cargar dos
  // veces el mismo permiso, que es lo que infla el resumen del día. No aplica al editar
  // un registro existente.
  if(t!==2 && !_editSolId){
    var _dup=[], _codeEmp=String((f.emp&&f.emp.c)||'').trim().toUpperCase();
    (f.dates||[]).forEach(function(fx){
      for(var i=0;i<_SOLIC.length;i++){
        var s=_SOLIC[i];
        if(s.estado!=='PENDIENTE'&&s.estado!=='APROBADO') continue;
        if(String(s.codigo||'').trim().toUpperCase()!==_codeEmp) continue;
        if(String(s.inicio||'').slice(0,10)!==fx) continue;
        _dup.push(_fmtCorto(fx)+(s.tipo==='MEDIA_JORNADA'?' (media jornada)':(s.tipo==='COMPLETO'?' (día completo)':'')));
        break;
      }
    });
    if(_dup.length){
      var _nombreDup=(f.emp&&(f.emp.n||f.emp.c))||'el trabajador';
      var _okDup=true;
      if(typeof confirm==='function'){
        _okDup=confirm('Ya hay un permiso registrado para '+_nombreDup+' el '+_dup.join(', ')+'.\n\n¿Registrar este '+(t===1?'permiso de media jornada':'permiso de día completo')+' de todas formas?');
      }
      if(!_okDup){ toast('Sin cambios: '+_nombreDup+' ya tenía permiso ese día',''); return {ok:false,cancelado:true}; }
    }
  }

  var _buckets=[];
  if(t===2){
    if((f.tomarBase||0)>0)_buckets.push('BASE');
    if((f.tomarProg||0)>0)_buckets.push('PROGRESIVO');
    if((f.tomarSind||0)>0)_buckets.push('SINDICAL');
  }
  var _tipoDias=t===2?(_buckets.length>1?'MIXTO':(_buckets[0]||'BASE')):null;
  var d=await dbReady();

  // ── Modo EDICIÓN ──
  if(_editSolId){
    try{
      var updE={
        codigo:f.emp.c, nombre:f.emp.n, centro_costo:f.cc?f.cc.n:null,
        inicio:t===2?f.start:(f.dates[0]||null),
        termino:t===2?_finVacaciones(f):(f.dates.length>1?f.dates[f.dates.length-1]:null),
        dias_habiles:t===2?f.dias:null, tipo_dias:_tipoDias,
        dias_base:t===2?(f.tomarBase||0):null, dias_progresivo:t===2?(f.tomarProg||0):null, dias_sindical:t===2?(f.tomarSind||0):null,
        tipo_regreso:t===1?f.reg:null, hora_salida:t===1?f.hs:null,
        hora_ingreso:t===1?((f.reg==='SIN')?null:f.hi):null,
        horas_permiso:t===1?parseFloat(calcularHoras().replace(',','.'))||null:null, comentario:f.com||null
      };
      var rE=await d.from('solicitudes_permiso').update(updE).eq('id',_editSolId);
      if(rE.error){ toast('Error al guardar: '+(rE.error.message||rE.error),'error'); return {ok:false}; }
      var idU=_editSolId; _editSolId=null;
      return {ok:true, id:idU, tipo:'update'};
    }catch(e){ toast('Error al guardar: '+e.message,'error'); return {ok:false}; }
  }

  // ── Nueva solicitud ──
  var newId=_uuid();
  var payload={
    id: newId,
    tipo: t===0?'COMPLETO':t===1?'MEDIA_JORNADA':'VACACIONES',
    estado:'PENDIENTE',
    codigo:f.emp.c, nombre:f.emp.n, centro_costo:f.cc.n,
    turno:f.turno||null, tipo_permiso:f.tipo||null,
    autorizador:f.aut?f.aut.n:null, autorizador_sub:f.aut?f.aut.sub:null,
    inicio:t===2?f.start:(f.dates[0]||null),
    termino:t===2?_finVacaciones(f):(f.dates.length>1?f.dates[f.dates.length-1]:null),
    dias_habiles:t===2?f.dias:null,
    tipo_dias:_tipoDias,
    dias_base:t===2?(f.tomarBase||0):null,
    dias_progresivo:t===2?(f.tomarProg||0):null,
    dias_sindical:t===2?(f.tomarSind||0):null,
    tipo_regreso:t===1?f.reg:null,
    hora_salida:t===1?f.hs:null,
    hora_ingreso:t===1?((f.reg==='SIN')?null:f.hi):null,
    horas_permiso:t===1?parseFloat(calcularHoras().replace(',','.'))||null:null,
    archivo:f.file||null, comentario:f.com||null,
    creado_por:_sesion?_sesion.id:null, creado_por_email:_sesion?_sesion.email:null
  };
  var res=await d.from('solicitudes_permiso').insert(payload);
  if(res.error){ toast('Error al guardar: '+(res.error.message||res.error),'error'); return {ok:false}; }
  if(f.fileObj){
    var meta={codigo:f.emp.c,nombre:f.emp.n,centro_costo:f.cc.n,fecha:payload.inicio,tipo:payload.tipo,tipo_permiso:payload.tipo_permiso};
    try{
      var _dt=dirDeTab(t);
      var g=await guardarDocumentoLocal(newId, f.fileObj, f.emp.c, f.emp.n, meta, _dt?_dt.handle:null);
      if(!g.okNav) toast('Solicitud guardada, pero no se pudo guardar la copia local del documento','warn',7000);
    }catch(e){ console.error('[DOC]',e); }
  }
  return {ok:true, id:newId, tipo:'insert'};
}

async function submitForm(){
  // El botón avisa mientras se envía y SIEMPRE vuelve a su texto: si la red o la base
  // fallan, el formulario no queda a medias ni el botón en blanco.
  var btn=document.getElementById('btnEnviar') || document.querySelector('button[onclick*="submitForm"]');
  var rotulo=btn? btn.innerHTML : '';
  if(btn){ btn.disabled=true; btn.classList.add('enviando'); btn.innerHTML='Enviando…'; }
  try{
    var r=await _guardarSolicitud();
    if(!r || !r.ok) return;                       // _guardarSolicitud ya avisó el motivo
    if(r.tipo==='update'){
      toast('✅ Cambios guardados','success');
      try{ await cargarSolicitudes(); }catch(e){ console.warn('[SOLIC]',e); }
      go('rec'); return;
    }
    toast('✅ Solicitud enviada correctamente','success');
    resetForm();
    try{ await cargarSolicitudes(); }catch(e){ console.warn('[SOLIC]',e); }
    go('home');
  }catch(e){
    toast('Error al enviar: '+((e&&e.message)||e),'error',7000);
  }finally{
    if(btn && btn.isConnected){ btn.disabled=false; btn.classList.remove('enviando'); btn.innerHTML=rotulo; }
  }
}

// Número de semana ISO (YYYY-Www) de una fecha YYYY-MM-DD
function semNum(dk){
  var d=new Date(dk+'T12:00:00');
  var day=(d.getDay()+6)%7;               // lunes=0
  d.setDate(d.getDate()-day+3);           // jueves de esa semana
  var firstThu=new Date(d.getFullYear(),0,4);
  var fday=(firstThu.getDay()+6)%7;
  firstThu.setDate(firstThu.getDate()-fday+3);
  var week=1+Math.round((d-firstThu)/(7*86400000));
  return d.getFullYear()+'-W'+String(week).padStart(2,'0');
}

var _CHART_COLORS=['#14508C','#1F6FB2','#2E8BC0','#37A6D0','#57BEE0','#7CCBEA','#A2DBF2','#C4E7F7','#3C6E9F','#5A8FB8','#86AECB','#B7D3E6'];
// Agrupa registros por responsable (autorizador) sumando valueFn (1 por defecto)
function _respAgg(items, valueFn){
  var map={};

    var k=String(s.autorizador||'').trim()||'Sin responsable';
    map[k]=(map[k]||0)+(valueFn?valueFn(s):1);
  });
  return Object.keys(map).map(function(k){ return {label:k, value:map[k]}; })
    .sort(function(a,b){ return b.value-a.value; });
}
function _arcSlice(cx,cy,R,r,a0,a1){
  var large=(a1-a0)>Math.PI?1:0;
  var x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0);
  var x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
  var x2=cx+r*Math.cos(a1), y2=cy+r*Math.sin(a1);
  var x3=cx+r*Math.cos(a0), y3=cy+r*Math.sin(a0);
  return 'M'+x0.toFixed(2)+' '+y0.toFixed(2)+' A'+R+' '+R+' 0 '+large+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+
         ' L'+x2.toFixed(2)+' '+y2.toFixed(2)+' A'+r+' '+r+' 0 '+large+' 0 '+x3.toFixed(2)+' '+y3.toFixed(2)+' Z';
}
function _chartVal(v){ var n=Math.round(v*100)/100; return n.toLocaleString('es-CL',{maximumFractionDigits:2}); }
// Donut SVG + leyenda con % por responsable
function _donutSVG(pairs, size){
  size=size||216;
  var cx=size/2, cy=size/2, R=size/2-6, r=R*0.58;
  var total=(pairs||[]).reduce(function(a,p){ return a+p.value; },0);
  if(!total) return '<div class="dn-empty">Sin datos para graficar</div>';
  var a0=-Math.PI/2, paths='';
  if(pairs.length===1){
    paths='<circle style="--i:0" cx="'+cx+'" cy="'+cy+'" r="'+((R+r)/2).toFixed(2)+'" fill="none" stroke="'+_CHART_COLORS[0]+'" stroke-width="'+(R-r).toFixed(2)+'"><title>'+esc(pairs[0].label)+': '+_chartVal(pairs[0].value)+'</title></circle>';
  } else {
    pairs.forEach(function(p,i){
      var a1=a0+(p.value/total)*Math.PI*2;
      paths+='<path style="--i:'+i+'" d="'+_arcSlice(cx,cy,R,r,a0,a1)+'" fill="'+_CHART_COLORS[i%_CHART_COLORS.length]+'" stroke="var(--surface)" stroke-width="1.5"><title>'+esc(p.label)+': '+_chartVal(p.value)+' ('+(p.value/total*100).toFixed(1).replace('.',',')+'%)</title></path>';
      a0=a1;
    });
  }
  // Total al centro de la dona (aprovecha el hueco; refuerza la lectura del dato)
  var centro='<text class="dn-total-lb" x="'+cx+'" y="'+(cy-13)+'" text-anchor="middle">TOTAL</text>'+
    '<text class="dn-total" x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle">'+_chartVal(total)+'</text>';
  var legend=pairs.map(function(p,i){
    var pct=(p.value/total*100).toFixed(1).replace('.',',')+'%';
    return '<div class="dn-it" style="--i:'+i+'"><span class="sw" style="background:'+_CHART_COLORS[i%_CHART_COLORS.length]+'"></span>'+
      '<span class="nm" title="'+esc(p.label)+'">'+esc(p.label)+'</span>'+
      '<span class="pc">'+pct+'</span><span class="vl">'+_chartVal(p.value)+'</span></div>';
  }).join('');
  return '<div class="dn-wrap"><svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" class="dn-svg" role="img">'+paths+centro+'</svg>'+
    '<div class="dn-legend">'+legend+'</div></div>';
}

function renderPorDia(tipo, titulo, accColor, recIdx){

  if(esMJ) cols0.push('');
  var q=(recQ||'').toLowerCase();
  function hit(s){ return (((s.nombre||'')+' '+(s.codigo||'')+' '+(s.centro_costo||'')+' '+(s.autorizador||'')).toLowerCase().indexOf(q)>=0); }
  function fechaOk(s){
    var st=String(s.inicio||'').slice(0,10); if(!st) return false;
    var a=st.slice(0,4), m=parseInt(st.slice(5,7),10);
    if(_recAnio && a!==_recAnio) return false;
    if(_recMeses.length && _recMeses.indexOf(m)<0) return false;
    if(_recDesde && st<_recDesde) return false;
    if(_recHasta && st>_recHasta) return false;
    if(_recTipo && (s.tipo_permiso||'')!==_recTipo) return false;
    if(_recTurno && String(s.turno||'').toUpperCase()!==_recTurno) return false;
    return true;
  }
  function fmtHora(h){ if(!h) return '—'; var s=String(h); return s.length>=5 ? s.substring(0,5) : s; }
  function fmtHoras(h){ if(h==null||h===''||h==='—') return '—'; var n=parseFloat(h); if(isNaN(n)) return '—'; return (Math.round(n*100)/100).toFixed(2).replace('.',','); }
  function tLbl(t){ return {PERSONAL:'Personal',MEDICO:'Médico',JUDICIAL:'Judicial'}[t]||'—'; }

  var totDia=0, totTarde=0, totNoche=0, body='';

  dias.forEach(function(g){

    var fechaLbl=g.k==='__sin__' ? '—' : ((fechas[2]+'-'+fechas[1]+'-'+fechas[0])+(_diaSemana(g.k)?' · '+_diaSemana(g.k):''));
    var sumaDia=0, sumaTrab=0;
    g.items.forEach(function(s){ var hN=parseFloat(calcularHorasPermiso(s))||0; var hT=esMJ?(parseFloat(calcularHorasTrabajadas(s))||0):0; sumaDia+=hN; sumaTrab+=hT; totT+=hT; acumTurno(s,hN,hT); });
    var diaExp=_diaExpand[g.k]===true;

    var refTag=g.k===hoyS?' <span style="color:var(--accent);font-size:9px">HOY</span>':(isRef?' <span style="color:var(--accent);font-size:9px">PRÓXIMA</span>':'');
    // Encabezado del día (botón colapsar) — ancla para scroll al día de referencia
    var diaFlecha=diaExp?'▼':'▶';
    body+='<tr class="mes-total" id="fechaRef" style="cursor:pointer;'+gStyle+'" onclick="toggleDia(\''+esc(g.k)+'\')">'+

      '<td style="padding-left:6px"><span style="display:inline-block;width:12px">'+diaFlecha+'</span> <b>Total '+fechaLbl+'</b>'+refTag+'</td>'+
      (esMJ?'<td></td>':'')+
      '<td colspan="5" style="font-size:10px;color:var(--hint)"></td>'+
      '<td style="text-align:right;font-weight:700">'+fmtHoras(sumaDia)+'</td>'+(esMJ?'<td style="text-align:right;font-weight:700">'+fmtHoras(sumaTrab)+'</td>':'')+(esMJ?'<td></td>':'')+'</tr>';
    // Filas del día
    if(diaExp) g.items.forEach(function(s){
      var hN=parseFloat(calcularHorasPermiso(s))||0;
      var codNom='<b style="color:var(--text)">'+esc(s.codigo||'')+'</b> <span>'+esc(s.nombre||'')+'</span>'+
        (s.centro_costo?' <span style="color:var(--hint);margin-left:8px">'+esc(s.centro_costo)+'</span>':'');
      body+='<tr>'+
        '<td style="font-size:11px;color:var(--muted)">'+esc(s.turno||'—')+'</td>'+
        '<td style="color:var(--muted);white-space:nowrap;font-size:11.5px">'+fechaLbl+'</td>'+
        (esMJ?'<td style="font-size:12px;white-space:nowrap;color:var(--muted)">'+esc(s.autorizador||'—')+'</td>':'')+
        '<td style="font-size:12px">'+codNom+'</td>'+
        '<td style="font-size:12px;white-space:nowrap">'+tLbl(s.tipo_permiso)+'</td>'+
        '<td style="font-size:12px;white-space:nowrap">'+regTxt(s.tipo_regreso)+'</td>'+
        '<td style="white-space:nowrap;font-size:12px">'+fmtHora(s.hora_salida)+'</td>'+
        '<td style="white-space:nowrap;font-size:12px">'+fmtHora(s.hora_ingreso)+'</td>'+
        '<td style="text-align:right;font-weight:600;font-variant-numeric:tabular-nums">'+fmtHoras(hN)+'</td>'+
        (esMJ?'<td style="text-align:right;color:var(--muted);font-variant-numeric:tabular-nums">'+fmtHoras(calcularHorasTrabajadas(s))+'</td>':'')+
        (esMJ?_accRow(s):'')+
        '</tr>';
    });
  });

  // Totales por turno + suma total
  var _midRow=function(lbl,vPerm,vTrab,strong){
    return '<tr class="mes-total" style="cursor:default"><td></td><td><b>'+lbl+'</b></td>'+
      '<td colspan="'+(esMJ?6:5)+'"></td>'+
      '<td style="text-align:right;font-weight:'+strong+'">'+fmtHoras(vPerm)+'</td>'+
      (esMJ?'<td style="text-align:right;color:var(--hint);font-weight:'+strong+'">'+fmtHoras(vTrab)+'</td>':'')+
      (esMJ?'<td></td>':'')+'</tr>';
  };
  // Subtotales por turno (solo si hay más de un turno) + subtotal general siempre
  if((hayDia?1:0)+(hayTarde?1:0)+(hayNoche?1:0) > 1){
    if(hayTarde) body+=_midRow('Total TARDE', totTarde, tTardeT, 700);
    if(hayNoche) body+=_midRow('Total NOCHE', totNoche, tNocheT, 700);
    if(hayDia) body+=_midRow('Total DIA', totDia, tDiaT, 700);
  }
  body+=_midRow(esMJ?'Subtotal HORAS DE PERMISO':'Suma total', totDia+totTarde+totNoche, totT, 800);

  var header=cols0.map(function(c){return '<th>'+c+'</th>';}).join('');
  var acc=accColor;
  var footTot= esMJ ? ('Total horas: '+fmtHoras(items.reduce(function(a,s){return a+(parseFloat(calcularHorasPermiso(s))||0);},0))+' h')
                    : ('Total: '+items.length+' permiso'+(items.length!==1?'s':''));
  return '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
    '<h1 style="font-size:clamp(22px,2.2vw,28px);font-weight:700;letter-spacing:-.025em;line-height:1.1">'+titulo+'</h1>'+
    '<span style="font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;background:var(--accent-soft);color:'+acc+'">'+items.length+'</span>'+
    '<span style="font-size:12.5px;color:var(--hint)">'+periodoLabel()+'</span>'+
    '</div>'+recFilterBar(recIdx)+
    '<div class="table-card"><div class="tbl-scroll"><table class="tbl tbl-compact" style="min-width:1180px"><thead><tr>'+header+'</tr></thead>'+
      '<tbody>'+(body||'<tr><td colspan="'+(esMJ?11:8)+'" style="text-align:center;color:var(--hint);padding:40px">Sin registros aún</td></tr>')+'</tbody></table></div>'+
    '<div class="tbl-foot"><span>Mostrando '+items.length+' registros</span><span>'+footTot+'</span></div></div>';
}

// ── Vista VACACIONES: agrupada por mes con totales por mes y suma total ──
function renderVacaciones(hit, fechaOk){
  var cols0=[{t:'AÑO',c:'center'},{t:'MES',c:'center'},{t:'CENTRO DE COSTO'},{t:'NOMBRE'},{t:'INICIO DE VACACIONES'},{t:'TÉRMINO DE VACACIONES'},{t:'DÍAS HÁBILES',c:'center'},{t:'ESTADO VACACIONES',c:'center'},{t:''}];
  var q=(recQ||'').toLowerCase();
  function hitS(s){ var n=(s.nombre||'')+' '+(s.codigo||'')+' '+(s.centro_costo||'')+' '+(s.autorizador||''); return n.toLowerCase().indexOf(q)>=0; }
  function fechaOkS(s){
    var st=String(s.inicio||'').slice(0,10); if(!st) return false;
    var a=st.slice(0,4), m=parseInt(st.slice(5,7),10);
    if(_recAnio && a!==_recAnio) return false;
    if(_recMeses.length && _recMeses.indexOf(m)<0) return false;
    if(_recCC.length && _recCC.indexOf(s.centro_costo||'—')<0) return false;
    if(_recDesde && st<_recDesde) return false;
    if(_recHasta && st>_recHasta) return false;
    return true;
  }
  function fmtD(v){ return v?String(v).slice(0,10):'—'; }
  function dLbl(v){ var p=String(v||'').slice(0,10).split('-'); return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:'—'; }
  // ESTADO según fórmula del sheet:
  //   =SI(DIAS_HABILES="";"POR TOMAR";SI(INICIO>HOY();"POR TOMAR";"EN CURSO"))
  // Filtrar y agrupar por MES (ascendente): clave YYYY-MM
  var items=_SOLIC.filter(function(s){
    if(s.tipo!=='VACACIONES') return false;
    if(!hitS(s)||!fechaOkS(s)) return false;
    if(_recEstados.length && _recEstados.indexOf(estadoDe(s))<0) return false;
    return true;
  });
  var meses=[]; var mk={};
  items.forEach(function(s){
    var k=String(s.inicio||'').slice(0,7)||'__sin__';
    if(!mk[k]){ mk[k]={k:k, items:[]}; meses.push(mk[k]); }
    mk[k].items.push(s);
  });
  meses.sort(function(a,b){ if(a.k==='__sin__')return 1; if(b.k==='__sin__')return -1; return a.k.localeCompare(b.k); });

  var body='';
  meses.forEach(function(m){
    var p=m.k.split('-');
    var anioLbl=p[0]||'—', mesLbl=p[1]?MONTHS[+p[1]-1].slice(0,3):'—';
    var mesFull=p[1]?(MONTHS[+p[1]-1]+' '+anioLbl):'Sin fecha';
    m.items.sort(function(a,b){ return String(a.inicio||'').localeCompare(String(b.inicio||'')) || String(a.nombre||'').localeCompare(String(b.nombre||''),'es'); });
    // Agrupar por CENTRO DE COSTO (la etiqueta se muestra UNA sola vez)
    var cks=[], cm={};
    m.items.forEach(function(s){ var cc=s.centro_costo||'—'; if(!cm[cc]){ cm[cc]={cc:cc,items:[]}; cks.push(cm[cc]); } cm[cc].items.push(s); });
    cks.sort(function(a,b){ return a.cc.localeCompare(b.cc); });
    var firstMonth=true;
    cks.forEach(function(c){
      var cnt=c.items.length;
      c.items.forEach(function(s, idx){
        var dias=parseInt(s.dias_habiles)||0;
        var codNom='<b style="color:var(--text)">'+esc(s.codigo||'')+'</b> <span>'+esc(s.nombre||'')+'</span>';
        var celA=(idx===0 && firstMonth)?'<td style="text-align:center;font-size:11px;color:var(--hint);font-weight:700">'+esc(anioLbl)+'</td>':'<td></td>';
        var celM=(idx===0 && firstMonth)?'<td style="text-align:center;font-size:11px;color:var(--hint);font-weight:700">'+esc(mesLbl)+'</td>':'<td></td>';
        var celC=(idx===0)?'<td style="font-weight:700;color:var(--text)">'+esc(c.cc)+'</td>':'<td></td>';
        body+='<tr>'+
          celA+celM+celC+
          '<td>'+codNom+'</td>'+
          '<td style="font-size:11px;color:var(--hint)">'+dLbl(s.inicio)+'</td>'+
          '<td style="font-size:11px;color:var(--hint)">'+dLbl(s.termino)+'</td>'+
          '<td style="text-align:center;font-variant-numeric:tabular-nums">'+dias+'</td>'+
          '<td style="white-space:nowrap;font-size:11.5px;text-align:center">'+estadoDe(s)+'</td>'+
          '<td style="white-space:nowrap"><div style="display:flex;gap:6px;justify-content:flex-end">'+
          '<button class="btn-icon" title="Editar" onclick="editarRegistroPermiso(\''+esc(s.id||'')+'\')">'+_icoEdit()+'</button>'+
          '<button class="btn-icon danger" title="Eliminar" onclick="eliminarRegistroPermiso(\''+esc(s.id||'')+'\')">'+_icoDel()+'</button></div></td>'+
          '</tr>';
      });
      // Subtotal del centro de costo
      body+='<tr class="mes-total"><td colspan="2"></td><td colspan="5" style="font-weight:700">Total '+esc(c.cc)+'</td><td style="text-align:center;font-weight:700">'+cnt+'</td><td></td></tr>';
      firstMonth=false;
    });
    // Subtotal del mes (cantidad de personas)
    var nP=m.items.length;
    body+='<tr class="mes-total"><td colspan="2"></td><td colspan="5"><b>Total '+mesLbl+'</b></td><td style="text-align:center;font-weight:800">'+nP+'</td><td></td></tr>';
  });

  body+='<tr class="mes-total"><td colspan="2"></td><td colspan="5"><b>Suma total</b></td><td style="text-align:center;font-weight:800">'+items.length+'</td><td></td></tr>';

  var header=cols0.map(function(c){ return '<th'+(c.c?' style="text-align:'+c.c+'"':'')+'>'+c.t+'</th>'; }).join('');
  var acc='#B0711C';
  return '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
    '<h1 style="font-size:clamp(22px,2.2vw,28px);font-weight:700;letter-spacing:-.025em;line-height:1.1">Registros vacaciones</h1>'+
    '<span style="font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;background:var(--accent-soft);color:'+acc+'">'+items.length+'</span>'+
    '<span style="font-size:12.5px;color:var(--hint)">'+periodoLabel()+'</span>'+
    '</div>'+recFilterBar(2)+
    '<div class="table-card"><div class="tbl-scroll"><table class="tbl tbl-compact" style="min-width:1040px"><thead><tr>'+header+'</tr></thead>'+
    '<tbody>'+(body||'<tr><td colspan="9" style="text-align:center;color:var(--hint);padding:40px">Sin registros aún</td></tr>')+'</tbody></table></div>'+
    '<div class="tbl-foot"><span>Mostrando '+items.length+' registros</span><span>'+recTotal(2)+'</span></div></div>'+
    // El resumen usa TODAS las vacaciones (no las filtradas por la tabla) y aplica su propio filtro de años
    resumenVacaciones(_SOLIC.filter(function(s){ return s.tipo==='VACACIONES'; }));
}

// ── RESUMEN de vacaciones: Año-mes → Centro de costo → Estado, con totales ──
var _resAnioExpand={};   // colapso por AÑO
var _resVacExpand={};
var _resAnios=[];   // filtro de años EXCLUSIVO del resumen
var _resCC=[];      // filtro de centros de costo EXCLUSIVO del resumen
var _resInit=false; // inicializa el año por defecto una sola vez
function resToggleAnio(a){ a=String(a); var i=_resAnios.indexOf(a); if(i>=0) _resAnios.splice(i,1); else _resAnios.push(a); _resAnios.sort(); render(); }
function resAniosDisponibles(){ var y={}, h=new Date().getFullYear(); _SOLIC.forEach(function(s){ if(s.tipo==='VACACIONES'&&s.inicio){ var a=String(s.inicio).slice(0,4); if(a) y[a]=1; } }); y[h]=1; y[h+1]=1; return Object.keys(y).sort().reverse(); }
function resSetTodosAnios(){ var all=resAniosDisponibles(); if(_resAnios.length===all.length){ _resAnios=[]; } else { _resAnios=all.slice(); } render(); }
function resAniosLbl(){ if(!_resAnios.length) return 'Todos los años'; return _resAnios.join(', '); }
function resToggleCC(cc){ cc=String(cc); var i=_resCC.indexOf(cc); if(i>=0) _resCC.splice(i,1); else _resCC.push(cc); render(); }
function resCentrosDisponibles(){ var s={}; _SOLIC.forEach(function(x){ if(x.tipo==='VACACIONES'&&x.centro_costo) s[x.centro_costo]=1; }); return Object.keys(s).sort(); }
function resSetTodosCC(){ var all=resCentrosDisponibles(); if(_resCC.length===all.length){ _resCC=[]; } else { _resCC=all.slice(); } render(); }
function resCCLbl(){ if(!_resCC.length) return 'Centro de costo'; return _resCC.length===1 ? _resCC[0] : (_resCC.length+' centros'); }
function resumenVacaciones(items){
  if(!items||!items.length) return '';
  var MONTHS3=['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
  // Por defecto, el año actual (solo la primera vez)
  if(!_resInit){ _resInit=true; _resAnios=resAniosDisponibles().slice(); }   // todos los años (incluye el próximo)
  // Filtro de años + centros de costo EXCLUSIVOS del resumen
  var itemsFilt=items.filter(function(s){
    if(_resAnios.length && _resAnios.indexOf(String(s.inicio||'').slice(0,4))<0) return false;
    if(_resCC.length && _resCC.indexOf(s.centro_costo||'—')<0) return false;
    return true;
  });
  // Agrupar por año+mes: key "2026|8"
  var res={}; var sumaTotal=0, sumaDias=0;
  itemsFilt.forEach(function(s){
    var ini=String(s.inicio||'').slice(0,10).split('-');
    var anio=ini[0]||'—', mes=+ini[1]||0, mesLbl=mes?MONTHS3[mes-1]:'—';
    var cc=s.centro_costo||'—';
    var est=estadoDe(s);
    var dias=parseFloat(s.dias_habiles||0)||0;
    var key=anio+'|'+mes;
    if(!res[key]) res[key]={anio:anio,mes:mes,Lbl:anio+'-'+mesLbl,centros:{}};
    var m=res[key];
    if(!m.centros[cc]) m.centros[cc]={cc:cc,estado:{}};
    var c=m.centros[cc];
    if(!c.estado[est]) c.estado[est]={n:0,d:0};
    c.estado[est].n++; c.estado[est].d+=dias; sumaTotal++; sumaDias+=dias;
  });
  function celNum(n,extra){ return '<td style="text-align:right;font-variant-numeric:tabular-nums;'+(extra||'')+'">'+n+'</td>'; }
  function celVac(){ return '<td></td>'; }
  // Años a mostrar: los filtrados, o todos los disponibles (ordenados)
  var aniosMostrar=(_resAnios.length?_resAnios.slice():resAniosDisponibles()).filter(Boolean).sort();
  var body='';
  aniosMostrar.forEach(function(anio){
    // Total del AÑO
    var yN=0, yD=0, mesesConDatos=0;
    for(var mm=1; mm<=12; mm++){
      var mA=res[anio+'|'+mm];
      if(!mA) continue;
      var hubo=false;
      Object.keys(mA.centros).forEach(function(ck){ var c=mA.centros[ck]; Object.keys(c.estado).forEach(function(k){ yN+=c.estado[k].n; yD+=c.estado[k].d; if(c.estado[k].n) hubo=true; }); });
      if(hubo) mesesConDatos++;
    }
    var eAnio=_resAnioExpand[anio]===true;
    // Fila del AÑO (colapsable) — nivel resumen
    body+='<tr class="res-anio" style="cursor:pointer" onclick="toggleResAnio(\''+esc(anio)+'\')">'+
      '<td><span style="display:inline-block;width:16px">'+(eAnio?'▼':'▶')+'</span> <b>Año '+esc(anio)+'</b></td>'+
      '<td style="font-size:11px;color:var(--hint)">'+mesesConDatos+' mes'+(mesesConDatos!==1?'es':'')+'</td>'+celVac()+
      celNum(yN,'font-weight:800;')+celNum(yD,'font-weight:800;')+'</tr>';
    if(!eAnio) return;   // colapsado: solo el total del año
    for(var mes=1; mes<=12; mes++){
      var key=anio+'|'+mes;
      var m=res[key]||{anio:anio,mes:mes,Lbl:anio+'-'+MONTHS3[mes-1],centros:{}};
      var centroKeys=Object.keys(m.centros).sort();
      var exp=_resVacExpand[key]===true;
      var flecha=exp?'▼':'▶';
      var totN=0, totD=0;
      centroKeys.forEach(function(ck){ var c=m.centros[ck]; Object.keys(c.estado).forEach(function(k){ totN+=c.estado[k].n; totD+=c.estado[k].d; }); });
      if(!totN) continue;   // no mostrar meses sin registros
      // Fila del mes (colapsable) con el subtotal del mes
      body+='<tr class="fecha-head" style="cursor:pointer" onclick="toggleResVac(\''+key+'\')">'+
        '<td><span style="display:inline-block;width:14px">'+flecha+'</span> <b>'+esc(m.Lbl)+'</b></td><td></td>'+celVac()+
        celNum(totN,'font-weight:700;')+celNum(totD,'font-weight:700;')+'</tr>';
      if(exp){
        centroKeys.forEach(function(ck){
          var c=m.centros[ck];
          Object.keys(c.estado).sort().forEach(function(e,i){
            var centroCell=(i===0)?'<td style="padding-left:26px;font-size:11.5px">'+esc(ck)+'</td>':'<td></td>';
            body+='<tr><td></td>'+centroCell+'<td style="font-size:11px;color:var(--muted)">'+esc(e)+'</td>'+
              celNum(c.estado[e].n)+celNum(c.estado[e].d)+'</tr>';
          });
        });
        body+='<tr class="mes-total"><td><b>Total '+esc(m.Lbl)+'</b></td><td></td>'+celVac()+
          celNum(totN,'font-weight:700;')+celNum(totD,'font-weight:700;')+'</tr>';
      }
    }
  });
  body+='<tr class="mes-total"><td><b>Suma total</b></td><td></td>'+celVac()+
    celNum(sumaTotal,'font-weight:800;')+celNum(sumaDias,'font-weight:800;')+'</tr>';
  var head='<th>Año</th><th>CENTRO DE COSTO</th><th>ESTADO VACACIONES</th><th style="text-align:right">registros</th><th style="text-align:right">días</th>';
  // Dropdown de años EXCLUSIVO del resumen
  var aniosAll=resAniosDisponibles();
  var todosLbl=(_resAnios.length===aniosAll.length&&aniosAll.length)?'✓ Seleccionados todos':'☐ Seleccionar todos';
  var anioChk='<div onclick="resSetTodosAnios()" style="padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px;font-weight:600;color:var(--accent)">'+todosLbl+'</div>'+
    aniosAll.map(function(a){ var checked=_resAnios.indexOf(a)>=0;
      return '<label style="display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:12.5px;"><input type="checkbox" '+(checked?'checked':'')+' onchange="resToggleAnio(\''+a+'\')" style="accent-color:var(--accent)">'+a+'</label>'; }).join('');
  var anioDrop='<div class="pick" style="position:relative">'+
    '<div class="pick-btn" style="padding:7px 12px;border:1px solid var(--border);border-radius:11px;background:var(--surface2);font-size:12px;cursor:pointer;min-width:150px;display:flex;align-items:center;gap:6px" onclick="var p=document.getElementById(\'resAnioPop\');p.classList.toggle(\'hidden\')">'+
    '<span style="flex:1;color:var(--text)">'+resAniosLbl()+'</span><span style="color:var(--hint)">▾</span></div>'+
    '<div id="resAnioPop" class="pick-pop hidden" style="width:160px">'+anioChk+'</div></div>';
  // Dropdown de CENTROS DE COSTO EXCLUSIVO del resumen (al lado del de años)
  var ccsRes=resCentrosDisponibles();
  var todosCCRes=(_resCC.length===ccsRes.length&&ccsRes.length)?'✓ Todos':'☐ Seleccionar todos';
  var ccResChk='<div onclick="resSetTodosCC()" style="padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px;font-weight:600;color:var(--accent)">'+todosCCRes+'</div>'+
    ccsRes.map(function(cc){ var checked=_resCC.indexOf(cc)>=0;
      return '<label style="display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:12.5px;white-space:nowrap"><input type="checkbox" '+(checked?'checked':'')+' onchange="resToggleCC(\''+esc(cc)+'\')" style="accent-color:var(--accent)">'+esc(cc)+'</label>'; }).join('');
  var ccResDrop='<div class="pick" style="position:relative">'+
    '<div class="pick-btn" style="padding:7px 12px;border:1px solid var(--border);border-radius:11px;background:var(--surface2);font-size:12px;cursor:pointer;min-width:150px;display:flex;align-items:center;gap:6px" onclick="var p=document.getElementById(\'resCCPop\');p.classList.toggle(\'hidden\')">'+
    '<span style="flex:1;color:var(--text)">'+resCCLbl()+'</span><span style="color:var(--hint)">▾</span></div>'+
    '<div id="resCCPop" class="pick-pop hidden" style="width:260px;max-height:320px;overflow:auto">'+ccResChk+'</div></div>';
  return '<div class="table-card" style="margin-top:18px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap">'+
      '<div class="card-h" style="margin:0">📊 RESUMEN DE VACACIONES</div>'+
      '<div style="display:flex;gap:8px;align-items:center">'+ccResDrop+anioDrop+'</div></div>'+
    '<div class="tbl-scroll"><table class="tbl tbl-compact" style="min-width:680px"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
}

// Calcula la fecha de referencia (hoy si hay datos; si no, la próxima; si no, la última)
function _calcularDkRef(){
  var hoyS=hoy();
  var uso={};
  _SOLIC.forEach(function(s){ if(s.inicio){ var st=String(s.inicio).slice(0,10); uso[st]=1; } });
  if(uso[hoyS]) return hoyS;
  var lista=Object.keys(uso).sort();
  var fut=lista.filter(function(d){ return d>=hoyS; });
  return fut.length ? fut[0] : (lista.length ? lista[lista.length-1] : hoyS);
}

// Construye el <tbody> de la vista Día completo a partir de _SOLIC filtrado por recQ/fechas/tipo
function _cuerpoCompletoHTML(){
  var hoyS=hoy();
  var dkRef=_calcularDkRef();
  function esTipo(s,tp){ return (s.tipo_permiso===tp||(tp==='MEDICO'&&s.tipo_permiso==='MÉDICO')) ? '1' : ''; }
  function celTipo(val, extra){
    return '<td style="text-align:center;'+(val?('color:var(--oj);font-weight:700;'):'color:var(--hint);')+(extra||'')+'">'+esc(val||'')+'</td>';
  }
  function totales(items){
    var tP=0,tM=0,tJ=0;
    items.forEach(function(r){
      var tp=(r.raw&&r.raw.tipo_permiso)||'';
      if(tp==='PERSONAL')tP++; else if(tp==='MEDICO'||tp==='MÉDICO')tM++; else if(tp==='JUDICIAL')tJ++;
    });
    return {p:tP,m:tM,j:tJ};
  }
  var q=(recQ||'').toLowerCase();
  function hit(s){ return (((s.nombre||'')+' '+(s.codigo||'')+' '+(s.centro_costo||'')+' '+(s.autorizador||'')).toLowerCase().indexOf(q)>=0); }
  function fechaOk(s){
    var st=String(s.inicio||'').slice(0,10); if(!st) return false;
    var a=st.slice(0,4), m=parseInt(st.slice(5,7),10);
    if(_recAnio && a!==_recAnio) return false;
    if(_recMeses.length && _recMeses.indexOf(m)<0) return false;
    if(_recDesde && st<_recDesde) return false;
    if(_recHasta && st>_recHasta) return false;
    if(_recTipo && (s.tipo_permiso||'')!==_recTipo) return false;
    if(_recTurno && String(s.turno||'').toUpperCase()!==_recTurno) return false;
    return true;
  }
  // Filtrar y agrupar POR FECHA (formato de la imagen: fecha una vez arriba, nombres debajo, total al final)
  var items=_SOLIC.filter(function(s){return s.tipo==='COMPLETO'&&hit(s)&&fechaOk(s);});
  var rows=items.map(function(s){ return {fechaRaw:String(s.inicio||'').slice(0,10), raw:s}; });
  if(!rows.length) return '<tr><td colspan="7" style="text-align:center;color:var(--hint);padding:40px">Sin registros aún</td></tr>';

  // Agrupar por fecha (clave YYYY-MM-DD), orden ascendente
  var dias=[]; var dk={};
  rows.forEach(function(r){
    var k=r.fechaRaw||'__sin__';
    if(!dk[k]){ dk[k]={k:k, items:[]}; dias.push(dk[k]); }
    dk[k].items.push(r);
  });
  dias.sort(function(a,b){ if(a.k==='__sin__')return 1; if(b.k==='__sin__')return -1; return a.k.localeCompare(b.k); });

  function fechaLblDe(k){
    if(k==='__sin__') return '—';
    var f=k.split('-'); var lbl=f[2]+'-'+f[1]+'-'+f[0];
    var dow=_diaSemana(k);
    return dow ? (lbl+' · '+dow) : lbl;
  }
  function ordenar(arr){
    return arr.slice().sort(function(a,b){
      var na=(a.raw&&a.raw.nombre)||'', nb=(b.raw&&b.raw.nombre)||'';
      return na.localeCompare(nb,'es');
    });
  }
  function filaHTML(s, fechaCell, conRef, gStyle){
    var codNom='<b style="color:var(--text)">'+esc(s.codigo||'')+'</b> <span style="color:var(--text)">'+esc(s.nombre||'')+'</span>'+
      (s.centro_costo?' <span style="color:var(--hint);margin-left:8px">'+esc(s.centro_costo)+'</span>':'');
    var docBtn=_docBtn(s);
    var acc='<td style="white-space:nowrap"><div style="display:flex;gap:6px;justify-content:flex-end">'+docBtn+
      '<button class="btn-icon" title="Editar" onclick="editarRegistroPermiso(\''+esc(s.id||'')+'\')">'+_icoEdit()+'</button>'+
      '<button class="btn-icon danger" title="Eliminar" onclick="eliminarRegistroPermiso(\''+esc(s.id||'')+'\')">'+_icoDel()+'</button>'+
      '</div></td>';
    return '<tr'+(conRef?' id="fechaRef"':'')+' style="'+(gStyle||'')+'">'+
      '<td style="color:var(--hint);font-size:11px;white-space:nowrap">'+(fechaCell||'')+'</td>'+
      '<td style="font-size:12px;white-space:nowrap;color:var(--muted)">'+esc(s.autorizador||'—')+'</td>'+
      '<td>'+codNom+'</td>'+
      celTipo(esTipo(s,'PERSONAL'))+
      celTipo(esTipo(s,'MEDICO'))+
      celTipo(esTipo(s,'JUDICIAL'))+
      acc+'</tr>';
  }

  var body='';
  // Agrupar días por MES (colapsable) → dentro, los días
  var meses=[]; var mkk={};
  dias.forEach(function(g){
    var mk=(g.k!=='__sin__')? g.k.slice(0,7) : '__sin__';
    if(!mkk[mk]){ mkk[mk]={k:mk, dias:[]}; meses.push(mkk[mk]); }
    mkk[mk].dias.push(g);
  });
  meses.sort(function(a,b){ if(a.k==='__sin__')return 1; if(b.k==='__sin__')return -1; return a.k.localeCompare(b.k); });
  var mesActual=hoyS.slice(0,7);
  var _y=parseInt(mesActual.slice(0,4),10), _m=parseInt(mesActual.slice(5,7),10);
  var mesSiguiente=String(_m===12? _y+1 : _y)+'-'+String(_m===12? 1 : _m+1).padStart(2,'0');
  // El mes en curso y el SIGUIENTE parten abiertos: los permisos que vienen se ven de entrada.
  meses.forEach(function(mg){
    var mP=0,mM=0,mJ=0;
    mg.dias.forEach(function(g){ var dt=totales(g.items); mP+=dt.p; mM+=dt.m; mJ+=dt.j; });
    if(_diaExpandMes[mg.k]===undefined) _diaExpandMes[mg.k]=(mg.k===mesActual || mg.k===mesSiguiente);
    var mExp=_diaExpandMes[mg.k]===true;
    var mesLbl=(mg.k==='__sin__')?'Sin fecha':(MONTHS[parseInt(mg.k.slice(5,7),10)-1]+' '+mg.k.slice(0,4));
    // Los DÍAS ANTERIORES a hoy del mes en curso se pueden plegar para dejar la vista
    // limpia: la vista parte en el día de hoy. El botón (pequeño) los muestra/oculta.
    // Los totales del mes NO cambian: siguen sumando lo plegado. En meses que no son el
    // actual no se toca nada (ahí todos los días son "anteriores").
    var diasPrev=0;
    mg.dias.forEach(function(g){ if(g.k!=='__sin__' && g.k<hoyS) diasPrev++; });
    var conBoton=(mg.k===mesActual && diasPrev>0 && mExp);
    var verPrev=_diasPrevMes[mg.k]===true;
    var txtPrev=(verPrev?'Ocultar ':'Ver ')+diasPrev+' día'+(diasPrev!==1?'s':'')+' anterior'+(diasPrev!==1?'es':'');
    var btnPrev=conBoton? ' <button type="button" class="btn-dias-prev" title="Días anteriores a hoy del mes en curso" onclick="event.stopPropagation();toggleDiasPrevMes(\''+esc(mg.k)+'\')">'+txtPrev+'</button>' : '';
    body+='<tr class="res-anio" style="cursor:pointer" onclick="toggleDiaMes(\''+esc(mg.k)+'\')">'+
      '<td><span style="display:inline-block;width:16px">'+(mExp?'▼':'▶')+'</span> <b>'+esc(mesLbl)+'</b></td>'+
      '<td></td>'+
      '<td style="font-size:10px;color:var(--hint)">'+mg.dias.length+' día'+(mg.dias.length!==1?'s':'')+btnPrev+'</td>'+
      celTipo(mP)+celTipo(mM)+celTipo(mJ)+'<td></td></tr>';
    if(!mExp) return;
  // ── Meses SIGUIENTES: se listan DESAGRUPADOS (una fila por permiso con su fecha),
  //    sin cabeceras ni subtotales por día, para ver de un vistazo quién tiene permiso
  //    más adelante. Los meses pasados conservan el agrupado plegable por día.
  if(mg.k!=='__sin__' && mg.k>mesActual){
    var planos=[];
    mg.dias.forEach(function(g){ planos=planos.concat(g.items); });
    planos.sort(function(a,b){
      var fa=String((a.raw&&a.raw.inicio)||'').slice(0,10), fb=String((b.raw&&b.raw.inicio)||'').slice(0,10);
      if(fa!==fb) return fa.localeCompare(fb);
      var na=(a.raw&&a.raw.nombre)||'', nb=(b.raw&&b.raw.nombre)||'';
      return na.localeCompare(nb,'es');
    });
    var yaRef=false;
    planos.forEach(function(r){
      var esRef=(r.fechaRaw===dkRef), refAqui=(esRef&&!yaRef);
      if(refAqui) yaRef=true;
      body+=filaHTML(r.raw, '<b>'+fechaLblDe(r.fechaRaw)+'</b>', refAqui, (esRef?'background:var(--ref-bg)':''), '');
    });
    return;
  }
  mg.dias.forEach(function(g){
    var fechaLbl=fechaLblDe(g.k);
    var dt=totales(g.items);
    var isRef=g.k===dkRef;
    var esPasada=(g.k!=='__sin__' && g.k<hoyS);
    var esHoy=(g.k===hoyS);
    var gStyle=(isRef||esHoy)?'background:var(--ref-bg)':'';

    if(esPasada){
      // Plegado general de los días anteriores del mes en curso (botón del mes)
      if(conBoton && !verPrev) return;
      // ── Fechas PASADAS: grupo colapsable por fecha (colapsado por defecto) ──
      if(_diaExpandC[g.k]!==true && _diaExpandC[g.k]!==false) _diaExpandC[g.k]=isRef;
      var diaExp=_diaExpandC[g.k]===true;
      body+='<tr class="fecha-head" style="cursor:pointer;'+(isRef?gStyle:'')+'" onclick="toggleDiaC(\''+g.k+'\')">'+
        '<td style="font-weight:700;color:var(--text)"><span style="display:inline-block;width:14px">'+(diaExp?'▼':'▶')+'</span> '+fechaLbl+'</td>'+
        '<td></td>'+
        '<td style="font-size:10px;color:var(--hint)">'+g.items.length+' registro'+(g.items.length!==1?'s':'')+'</td>'+
        celTipo(dt.p)+celTipo(dt.m)+celTipo(dt.j)+'<td></td></tr>';
      if(diaExp){
        var primera=true;
        ordenar(g.items).forEach(function(r){
          body+=filaHTML(r.raw,'',isRef&&primera,'');
          primera=false;
        });
        body+='<tr class="fecha-total">'+
          '<td style="padding-left:26px"><b>Total '+fechaLbl+'</b></td>'+
          '<td></td>'+
          '<td style="font-size:10px;color:var(--hint)">'+g.items.length+' registro'+(g.items.length!==1?'s':'')+'</td>'+
          celTipo(dt.p)+celTipo(dt.m)+celTipo(dt.j)+'<td></td></tr>';
      }
    } else {
      // ── HOY y fechas SIGUIENTES: sin agrupar (fila por registro, con su fecha) ──
      var refTag=(esHoy?' <span style="color:var(--accent)">· HOY</span>':(isRef?' <span style="color:var(--accent)">· PRÓXIMA</span>':''));
      var primera=true;
      ordenar(g.items).forEach(function(r){
        body+=filaHTML(r.raw, primera?('<b>'+fechaLbl+'</b>'+refTag):'', isRef&&primera, gStyle);
        primera=false;
      });
      // Subtotal del día (la fecha ya se mostró una vez arriba)
      body+='<tr class="fecha-total" style="'+gStyle+'">'+
        '<td style="padding-left:10px"><b>Total</b></td>'+
        '<td></td>'+
        '<td style="font-size:10px;color:var(--hint)">'+g.items.length+' registro'+(g.items.length!==1?'s':'')+'</td>'+
        celTipo(dt.p)+celTipo(dt.m)+celTipo(dt.j)+'<td></td></tr>';
    }
  });
  });

  return body||'<tr><td colspan="7" style="text-align:center;color:var(--hint);padding:40px">Sin registros aún</td></tr>';
}

// Hacer scroll al día de referencia (hoy/próxima) al abrir la vista.
// Usa window.scrollTo (scrollea SIEMPRE la página) en lugar de scrollIntoView,
// que puede fallar sobre una fila en un contenedor con overflow. Reintenta
// hasta que el elemento exista (los datos son asíncronos).
var _scrollRefIntentos=0;
function scrollAReferencia(){
  _scrollRefIntentos=0;
  function centrar(){
    var el=document.getElementById('fechaRef');
    if(!el) return false;
    var rect=el.getBoundingClientRect();
    var actual=window.pageYOffset||document.documentElement.scrollTop||document.body.scrollTop||0;
    var altura=window.innerHeight||document.documentElement.clientHeight||800;
    var destino=actual + rect.top - (altura/2) + (rect.height/2||20);
    if(destino<0) destino=0;
    // Usar 'auto' (instantáneo) — más fiable que 'smooth' dentro de tablas con muchos re-renders
    try{ window.scrollTo({top:destino, behavior:'auto'}); }
    catch(e){ window.scrollTo(0,destino); }
    return true;
  }
  function enViewport(el){
    var r=el.getBoundingClientRect();
    var h=window.innerHeight||800;
    // Visible si su centro está dentro de la ventana
    return r.top>=-40 && r.bottom<=h+40;
  }
  function intentar(){
    var el=document.getElementById('fechaRef');
    if(el && enViewport(el)) return;   // ya está centrado, listo
    if(centrar()) return;
    _scrollRefIntentos++;
    if(_scrollRefIntentos<12){ setTimeout(intentar,300); }
  }
  setTimeout(intentar,200);
}

// Autocompletar Desde/Hasta con el rango de los meses seleccionados (si el usuario no eligió manualmente)
var _recFechaAuto=false;
function aplicarRangoMeses(){
  if(!_recFechaAuto) return;
  if(!_recMeses.length){ _recDesde=''; _recHasta=''; return; }
  var anio=parseInt(_recAnio,10)||new Date().getFullYear();
  var primer=_recMeses[0], ultimo=_recMeses[_recMeses.length-1];
  _recDesde=anio+'-'+String(primer).padStart(2,'0')+'-01';
  // último día del mes ultimo
  var dim=new Date(anio,ultimo,0).getDate();
  _recHasta=anio+'-'+String(ultimo).padStart(2,'0')+'-'+String(dim).padStart(2,'0');
}
function recMesesLbl(){
  if(!_recMeses.length) return 'Mes';
  var l=_recMeses.map(function(m){return (MONTHS[m-1]||'').slice(0,3);}).join(', ');
  return l.length>18 ? l.slice(0,16)+'…' : l;
}
function _recFilterAnios(){ // años disponibles para el filtro (datos reales + actual y próximo)
  var anios={}, hoyA=new Date().getFullYear();
  _SOLIC.forEach(function(s){ if(s.inicio){ var y=String(s.inicio).slice(0,4); if(y) anios[y]=1; } });
  anios[hoyA]=1; anios[hoyA+1]=1;   // incluye el año próximo (p. ej. 2027) aunque aún no tenga registros
  return Object.keys(anios).sort().reverse();
}
function exportRec(t){
  // Exporta tuplas crudas con XLSX (si está cargado), aplicando los filtros activos
  if(typeof XLSX==='undefined'){ toast('Módulo de exportación no disponible','error'); return; }
  var q=(recQ||'').toLowerCase();
  var hit=function(s){ return (((s.nombre||'')+' '+(s.codigo||'')+' '+(s.centro_costo||'')+' '+(s.autorizador||'')).toLowerCase().indexOf(q)>=0); };
  var fechaOk=function(s){
    var st=String(s.inicio||'').slice(0,10); if(!st) return false;
    var a=st.slice(0,4), m=parseInt(st.slice(5,7),10);
    if(_recAnio && a!==_recAnio) return false;
    if(_recMeses.length && _recMeses.indexOf(m)<0) return false;
    if(_recDesde && st<_recDesde) return false;
    if(_recHasta && st>_recHasta) return false;
    if(_recTipo && (s.tipo_permiso||'')!==_recTipo) return false;
    if(_recTurno && String(s.turno||'').toUpperCase()!==_recTurno) return false;
    return true;
  };
  var fil=function(tipo){ return _SOLIC.filter(function(s){return s.tipo===tipo&&hit(s)&&fechaOk(s);}); };
  var rows=t===0?fil('COMPLETO').map(function(s){return {Estado:s.estado,Fecha:s.inicio,Nombre:s.nombre,Centro:s.centro_costo,Turno:s.turno,Tipo:s.tipo_permiso,Autorizador:s.autorizador};})
    :t===1?fil('MEDIA_JORNADA').map(function(s){return {Estado:s.estado,Dia:s.inicio,Nombre:s.nombre,Tipo:s.tipo_permiso,Regreso:regTxt(s.tipo_regreso),'Hora salida':s.hora_salida,'Hora ingreso':s.hora_ingreso,'Sin trabajo':calcularHorasPermiso(s),'Horas trabajadas':calcularHorasTrabajadas(s)};})
    :fil('VACACIONES').map(function(s){return {Estado:s.estado,Centro:s.centro_costo,Nombre:s.nombre,Inicio:s.inicio,Termino:s.termino,Dias:s.dias_habiles};});
  if(!rows.length){ toast('⚠️ Sin datos para exportar con los filtros actuales','error'); return; }
  var ws=XLSX.utils.json_to_sheet(rows), wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Permisos');
  XLSX.writeFile(wb,'permisos_'+['completo','media','vacaciones'][t]+'.xlsx');
  toast('✅ '+'Exportado '+rows.length+' registros','success');
}

// ═══════════════════════════════════════════════════════════════
//  CAPA DE MOVIMIENTO v2
//  Entrada escalonada de vistas, contadores de KPI, onda al pulsar,
//  barra superior reactiva y gráficos interactivos.
//  Todo es defensivo: si algo falla, la app se comporta como antes.
// ═══════════════════════════════════════════════════════════════
var _RM=false;
try{ _RM=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){}
window._animPending=false;

// Reinicia la animación del encabezado de la barra superior (la llama go())
function _tbSwap(){
  try{
    if(_RM) return;
    var t=document.getElementById('tbTitle'); if(!t) return;
    t.classList.remove('tb-swap'); void t.offsetWidth; t.classList.add('tb-swap');
  }catch(e){}
}
// Marca elementos para que entren escalonados (--i controla el retardo)
function _stagger(root, sel, cls, max){
  try{
    if(!root||_RM||!root.querySelectorAll) return;
    var list=root.querySelectorAll(sel);
    for(var i=0;i<list.length;i++){
      if(i>max) break;
      var el=list[i];
      if(!el.classList||el.classList.contains(cls)) continue;
      el.classList.add(cls);
      if(el.style&&el.style.setProperty) el.style.setProperty('--i', i);
    }
  }catch(e){}
}
// Contador animado: sube de 0 al valor real y restaura el texto exacto al final
function _countUp(el, delay){
  try{
    if(!el||_RM) return;
    var raw=String(el.textContent==null?'':el.textContent).trim();
    if(!/^[0-9][0-9.,]*$/.test(raw)) return;
    var num=parseFloat(raw.replace(/\./g,'').replace(',','.'));
    if(!isFinite(num)||num<=0||num>1000000) return;
    var dec=raw.indexOf(',')>=0?((raw.split(',')[1]||'').length):0;
    function fmt(v){ try{ return v.toLocaleString('es-CL',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }catch(err){ return String(Math.round(v)); } }
    function run(){
      var t0=null, dur=560;
      el.textContent=fmt(0);
      requestAnimationFrame(function frame(ts){
        if(t0===null) t0=ts;
        var p=Math.min(1,(ts-t0)/dur);
        var e=1-Math.pow(1-p,3);
        try{ el.textContent=(p<1?fmt(num*e):raw); }catch(err){ el.textContent=raw; }
        if(p<1) requestAnimationFrame(frame); else el.textContent=raw;
      });
    }
    if(delay) setTimeout(run,delay); else run();
  }catch(e){}
}
function _contarKPIs(scope){
  try{
    if(_RM||!scope||!scope.querySelectorAll) return;
    var els=scope.querySelectorAll('.kpi .v');
    for(var i=0;i<els.length;i++){ if(els[i]._cnt) continue; els[i]._cnt=true; _countUp(els[i], i*55); }
  }catch(e){}
}
// Leyenda ↔ dona: al pasar por la lista se resalta el sector correspondiente
function _wireCharts(scope){
  try{
    if(!scope||!scope.querySelectorAll) return;
    var cards=scope.querySelectorAll('.chart-card');
    for(var c=0;c<cards.length;c++){
      var card=cards[c]; if(card._wired) continue; card._wired=true;
      var svg=card.querySelector('.dn-svg'); if(!svg) continue;
      var slices=svg.querySelectorAll('path,circle');
      var items=card.querySelectorAll('.dn-it');
      for(var i=0;i<items.length;i++){
        // OJO: slices/items son "var" de la función, hay que pasarlos a cada IIFE
        // o todos los listeners terminarían apuntando a la última tarjeta.
        (function(it,idx,sl){
          it.addEventListener('mouseenter',function(){
            for(var j=0;j<sl.length;j++){ sl[j].classList.toggle('dim', j!==idx); sl[j].classList.toggle('hot', j===idx); }
          });
          it.addEventListener('mouseleave',function(){
            for(var j=0;j<sl.length;j++){ sl[j].classList.remove('dim'); sl[j].classList.remove('hot'); }
          });
        })(items[i],i,slices);
      }
    }
  }catch(e){}
}
// Entrada escalonada de una vista completa
function _animateView(){
  var box=document.getElementById('contentBox'); if(!box) return;
  try{
    var kids=box.children, n=0;
    for(var i=0;i<kids.length;i++){
      var k=kids[i];
      if(!k.classList||k.classList.contains('anim-in')) continue;
      k.classList.add('anim-in');
      if(k.style&&k.style.setProperty) k.style.setProperty('--i', Math.min(n,9));
      n++;
    }
  }catch(e){}
  _stagger(box,'.tbl tbody tr','anim-row',13);
  _stagger(box,'.dn-it','dn-in',24);
  _contarKPIs(box);
  _wireCharts(box);
}
// Observa los re-render de #contentBox: anima la vista completa solo cuando
// cambió de página (go()); en los re-render parciales anima solo lo nuevo.
function _watchContent(){
  try{
    var box=document.getElementById('contentBox'); if(!box||box._watching) return; box._watching=true;
    new MutationObserver(function(muts){
      var reemplazo=false;
      for(var i=0;i<muts.length;i++){
        var m=muts[i];
        if(m.type==='childList'&&m.target===box&&m.addedNodes&&m.addedNodes.length){ reemplazo=true; break; }
      }
      if(!reemplazo) return;
      if(window._animPending){ window._animPending=false; _animateView(); }
      else{
        _stagger(box,'.tbl tbody tr','anim-row',13);
        _stagger(box,'.dn-it','dn-in',24);
        _wireCharts(box);
      }
    }).observe(box,{childList:true});
  }catch(e){}
}
// Barra superior: sombra al desplazar + línea de progreso de lectura
function _initScrollUI(){
  try{
    var tb=document.querySelector('.topbar'); if(!tb||tb._init) return; tb._init=true;
    var bar=document.createElement('div'); bar.className='tb-progress'; tb.appendChild(bar);
    var pend=false;
    function upd(){
      pend=false;
      var st=window.scrollY||document.documentElement.scrollTop||0;
      tb.classList.toggle('scrolled', st>6);
      var h=document.documentElement.scrollHeight-window.innerHeight;
      var p=h>0?Math.min(1,Math.max(0,st/h)):0;
      bar.style.transform='scaleX('+p.toFixed(4)+')';
      bar.style.opacity=(p>.004&&p<.999)?'1':'0';
    }
    window.addEventListener('scroll',function(){ if(!pend){ pend=true; requestAnimationFrame(upd); } },{passive:true});
    window.addEventListener('resize',upd,{passive:true});
    upd();
  }catch(e){}
}
// Onda al pulsar (botones, menú lateral, segmentos y filas de selector)
try{
  document.addEventListener('pointerdown',function(e){
    if(_RM) return;
    try{
      var t=e.target; if(!t||!t.closest) return;
      var b=t.closest('.btn,.btn-icon,.sb-item,.seg button,.pick-it,.login-btn');
      if(!b||b.disabled) return;
      var r=b.getBoundingClientRect();
      var d=Math.max(r.width,r.height)*1.1;
      var s=document.createElement('span');
      s.className='ripple';
      s.style.width=s.style.height=d+'px';
      s.style.left=((e.clientX-r.left)-d/2)+'px';
      s.style.top=((e.clientY-r.top)-d/2)+'px';
      b.appendChild(s);
      setTimeout(function(){ try{ if(s.remove) s.remove(); }catch(err){} },600);
    }catch(err){}
  },true);
}catch(e){}
_initScrollUI();
_watchContent();
