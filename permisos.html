<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sistema de Permisos · Friosur</title>
<meta name="theme-color" content="#5B54D6">
<meta name="description" content="Sistema de Solicitudes de Permiso - Pesquera Friosur SpA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="./icon-192-gray.png">
<link rel="apple-touch-icon" href="./icon-512-gray.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="papeletas.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ══ VARIABLES ══ */
:root, [data-theme="claro"]{
  --bg:#F6F6F4; --surface:#ffffff; --surface2:#FAFAF8; --surface3:#F1F1ED;
  --border:rgba(23,23,26,.08); --border2:rgba(23,23,26,.13);
  --text:#17171A; --muted:#6B6B73; --hint:#9A9AA2; --faint:#C2C2C8;
  --accent:#5B54D6; --accent2:#4740C4; --accent-soft:rgba(91,84,214,.09);
  --green:#1C8A5B; --green-soft:rgba(28,138,91,.09);
  --oj:#B0711C; --oj-soft:rgba(176,113,28,.1);
  --red:#D8615E; --red-soft:rgba(216,97,94,.11);
  --shadow:0 1px 2px rgba(23,23,26,.04),0 4px 12px rgba(23,23,26,.05),0 12px 28px rgba(23,23,26,.07);
  --shadow-sm:0 1px 2px rgba(23,23,26,.04),0 3px 8px rgba(23,23,26,.05);
  --ease:cubic-bezier(0.2,0.8,0.2,1); --ease-out:cubic-bezier(0.2,0.8,0.2,1); --ease-in-out:cubic-bezier(0.65,0,0.35,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --acc:var(--accent); --acc-soft:var(--accent-soft); --acc-bd:#C9C6F4;
  --ref-bg:color-mix(in srgb,var(--accent) 13%,transparent);
}
/* Color activo según formulario (tab) */
[data-formtab="1"]{ --acc:#1C8A5B; --acc-soft:var(--green-soft); --acc-bd:#B4DEC9; }
[data-formtab="2"]{ --acc:#B0711C; --acc-soft:var(--oj-soft); --acc-bd:#EBD2AE; }
[data-theme="oscuro"]{
  --bg:#131316; --surface:#1e2228; --surface2:#252b33; --surface3:#2d3440;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14); --text:#e2e8f0; --muted:#8896a8; --hint:#7a8898; --faint:#55606e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35),0 16px 48px rgba(0,0,0,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.25),0 3px 10px rgba(0,0,0,.3);
  color-scheme:dark;
}
/* Fondo del formulario según la pestaña (tinte del color primario) */
body[data-page="form"][data-formtab="0"]{ --bg:#F0F0F1; --topbar:rgba(240,240,241,.86) }
body[data-page="form"][data-formtab="1"]{ --bg:#EEF6F2; --topbar:rgba(238,246,242,.86) }
body[data-page="form"][data-formtab="2"]{ --bg:#FBF3E9; --topbar:rgba(251,243,233,.86) }
body[data-theme="oscuro"][data-page="form"][data-formtab="0"]{ --bg:#17171A; --topbar:rgba(23,23,26,.86) }
body[data-theme="oscuro"][data-page="form"][data-formtab="1"]{ --bg:#121A17; --topbar:rgba(18,26,23,.86) }
body[data-theme="oscuro"][data-page="form"][data-formtab="2"]{ --bg:#1B1710; --topbar:rgba(27,23,16,.86) }
/* Mismo tinte para los Registros según su pestaña */
body[data-page="rec"][data-rec="0"]{ --bg:#F0F0F1; --topbar:rgba(240,240,241,.86); --acc:var(--accent); --acc-soft:var(--accent-soft); --acc-bd:#C9C6F4; --ref-bg:color-mix(in srgb,var(--accent) 13%,transparent) }
body[data-page="rec"][data-rec="1"]{ --bg:#EEF6F2; --topbar:rgba(238,246,242,.86); --acc:var(--green); --acc-soft:var(--green-soft); --acc-bd:#B4DEC9; --ref-bg:color-mix(in srgb,var(--green) 15%,transparent) }
body[data-page="rec"][data-rec="2"]{ --bg:#FBF3E9; --topbar:rgba(251,243,233,.86); --acc:var(--oj); --acc-soft:var(--oj-soft); --acc-bd:#EBD2AE; --ref-bg:color-mix(in srgb,var(--oj) 14%,transparent) }
body[data-theme="oscuro"][data-page="rec"][data-rec="0"]{ --bg:#17171A; --topbar:rgba(23,23,26,.86) }
body[data-theme="oscuro"][data-page="rec"][data-rec="1"]{ --bg:#121A17; --topbar:rgba(18,26,23,.86) }
body[data-theme="oscuro"][data-page="rec"][data-rec="2"]{ --bg:#1B1710; --topbar:rgba(27,23,16,.86) }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,system-ui,'Segoe UI Variable Text','Segoe UI',Roboto,'Inter','Barlow','Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  font-size:14px;line-height:1.5;
}
h1,h2,h3{font-weight:700;letter-spacing:-0.02em;line-height:1.15}
/* ── Pulido: superficies del navegador (selección, cursor, scrollbar, subrayado) ── */
::selection{background:color-mix(in srgb,var(--accent) 26%, transparent);color:var(--text)}
input,textarea,select,[contenteditable]{caret-color:var(--accent)}
a{text-underline-offset:3px;text-decoration-thickness:1.5px}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--text) 20%, transparent) transparent}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--text) 16%, transparent);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--text) 30%, transparent);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%, transparent),0 0 0 1.5px var(--accent)}
/* ── Material de modales: entran con escala + opacidad (ease-out exponencial) ── */
@keyframes _modalIn{from{opacity:0;transform:translateY(6px) scale(.975)}to{opacity:1;transform:none}}
@keyframes _backIn{from{opacity:0}to{opacity:1}}
#perModal>div,#gateCarpeta>div{animation:_modalIn .3s var(--ease) both}
.pick-pop{animation:_modalIn .16s var(--ease) both;transform-origin:top center}
.btn svg,.btn-icon svg{width:15px;height:15px;display:block;flex-shrink:0}
/* Profundidad premium en botones principales */
.btn-primary{box-shadow:0 1px 2px rgba(23,23,26,.10),0 7px 18px color-mix(in srgb,var(--accent) 26%, transparent)}
.btn-dark{box-shadow:0 1px 2px rgba(23,23,26,.16),0 8px 22px rgba(23,23,26,.20)}
[data-theme="oscuro"] .btn-primary{box-shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px color-mix(in srgb,var(--accent) 40%, transparent)}
.hidden{display:none!important}

/* ══ LOGIN ══ */
#loginScreen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:40px 36px 32px;width:100%;max-width:380px;box-shadow:var(--shadow)}
.login-logo{text-align:center;margin-bottom:26px}
.login-logo .licon{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin:0 auto 12px}
.login-logo h2{font-size:20px;font-weight:800;letter-spacing:-.5px}
.login-logo p{font-size:12.5px;color:var(--muted);margin-top:4px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-bottom:6px}
.login-field input{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);font-size:14px;color:var(--text);outline:none;transition:border .15s}
.login-field input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;margin-top:4px}
.login-btn:hover{opacity:.9}
.login-btn:disabled{opacity:.5;cursor:default}
.login-error{color:var(--red);font-size:12px;margin-top:10px;text-align:center;min-height:18px}

/* ══ LAYOUT ══ */
.app{display:flex;min-height:100vh}
.sidebar{width:252px;flex-shrink:0;background:#17171C;color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:1px;padding:14px 12px;border-right:1px solid rgba(255,255,255,.06);overflow-y:auto;overflow-x:hidden;transition:width .22s var(--ease-out),padding .22s var(--ease-out)}
.sidebar::-webkit-scrollbar{width:0}
.sb-brand{display:flex;align-items:center;gap:11px;padding:6px 8px 14px;position:relative}
.sb-brand .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#6E66F2,#5B54D6);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;letter-spacing:-.4px;flex-shrink:0;box-shadow:0 5px 16px rgba(91,84,214,.42)}
.sb-brand .tt{min-width:0}
.sb-brand .t{font-size:13.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.sb-brand .s{font-size:10.5px;color:#72727E;margin-top:1px;white-space:nowrap}
.sb-collapse{position:absolute;right:2px;top:6px;width:26px;height:26px;border-radius:50%;background:#26262E;border:1px solid rgba(255,255,255,.14);color:#B9B9C4;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;transition:background .15s,color .15s,transform .15s}
.sb-collapse:hover{background:#33333D;color:#fff}
.sb-collapse:active{transform:scale(.9)}
.sb-collapse svg{width:13px;height:13px;transition:transform .22s var(--ease-out)}
.sb-lab{font-size:10px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:#5A5A66;padding:16px 12px 6px;white-space:nowrap;overflow:hidden;transition:opacity .18s}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border:none;border-radius:11px;background:transparent;color:#AEAFBA;font-size:13px;font-weight:500;text-align:left;cursor:pointer;transition:background .16s,color .16s;width:100%;font-family:inherit}
.sb-item .ico{width:19px;height:19px;flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:.85;transition:opacity .16s,color .16s}
.sb-item .ico svg{width:18px;height:18px;display:block}
.sb-item .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-item:hover .ico{opacity:1}
.sb-item.active{background:#2A2A34;color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.sb-item.active .ico{color:#8B85F0;opacity:1}
.sb-foot{border-top:1px solid rgba(255,255,255,.08);padding-top:12px;margin-top:auto;display:flex;align-items:center;gap:10px}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3A3A46,#2A2A34);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:#C7C7D0;flex-shrink:0}
.sb-user{flex:1;min-width:0}
.sb-user .n{font-size:12px;font-weight:600;color:#E8E8EE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .r{font-size:10.5px;color:#6C6C78}
.sb-logout{border:none;background:none;color:#6C6C78;cursor:pointer;font-size:15px;padding:6px;border-radius:8px;transition:background .15s,color .15s}
.sb-logout:hover{background:rgba(255,255,255,.07);color:#fff}
/* Estado colapsado (rail de íconos) */
.sidebar.collapsed{width:78px;padding:14px 12px}
.sidebar.collapsed .sb-brand{flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px 0 12px}
.sidebar.collapsed .sb-brand .tt{display:none}
.sidebar.collapsed .sb-collapse{position:static}
.sidebar.collapsed .sb-collapse svg{transform:rotate(180deg)}
.sidebar.collapsed .sb-item{justify-content:center;padding:11px}
.sidebar.collapsed .sb-item .lb,.sidebar.collapsed .sb-user{display:none}
.sidebar.collapsed .sb-foot{justify-content:center}
.sidebar.collapsed .sb-lab{font-size:0;padding:12px 6px 4px;height:20px}
.sidebar.collapsed .sb-lab::after{content:'';display:block;height:1px;background:rgba(255,255,255,.09)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--topbar,rgba(246,246,244,.86));backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:22px 40px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;transition:background .3s}
[data-theme="oscuro"] .topbar{background:var(--topbar,rgba(19,19,22,.86))}
.topbar .kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.topbar h1{font-size:clamp(22px,2.1vw,28px);font-weight:700;letter-spacing:-.025em;line-height:1.08;margin-top:5px}
.topbar-actions{display:flex;gap:10px;align-items:center}
.folder-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid transparent;font-family:inherit;cursor:default}
.folder-badge.ok{background:var(--green-soft);color:var(--green);border-color:rgba(28,138,91,.22)}
.folder-badge.warn{background:var(--oj-soft);color:var(--oj);border-color:rgba(176,113,28,.28);cursor:pointer;transition:background .15s}
.folder-badge.warn:hover{background:color-mix(in srgb,var(--oj) 18%,transparent)}
.folder-badge .fb-nm{color:var(--hint);font-weight:500;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-badge svg{width:15px;height:15px;flex-shrink:0}

.content{flex:1;padding:26px 40px 56px}
.content-box{max-width:1600px;animation:fade .24s var(--ease-out)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ══ BOTONES ══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:12px 20px;border-radius:12px;border:none;background:var(--surface);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s var(--ease-out),opacity .15s var(--ease-out),transform .16s var(--ease-out)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--surface);border:1px solid var(--border2);color:var(--text)}
.btn-secondary:hover{background:var(--surface3)}
.btn-dark{background:#17171A;color:#fff}
.btn-dark:hover{background:#2C2C33}
.btn-dark.enviando,.btn-primary.enviando{opacity:.72;cursor:progress}
.btn-dark.enviando::after,.btn-primary.enviando::after{content:'';display:inline-block;width:11px;height:11px;margin-left:8px;border-radius:50%;border:2px solid color-mix(in srgb,currentColor 45%,transparent);border-top-color:currentColor;animation:girando .7s linear infinite;vertical-align:-1px}
@keyframes girando{to{transform:rotate(360deg)}}
.btn-ghost{background:var(--surface);border:1px solid var(--border2);color:var(--muted)}
.btn-ghost:hover{background:var(--surface3)}
.btn-ghost.btn-active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn-oj{background:var(--oj);color:#fff}
.btn-oj:hover{background:#966014}
.btn-sm{min-height:36px;padding:8px 14px;font-size:12px;border-radius:10px}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border-radius:10px;background:var(--surface);border:1px solid var(--border2);color:var(--muted);cursor:pointer;font-family:inherit;font-size:14px;line-height:1;transition:background .15s var(--ease-out),color .15s var(--ease-out),border-color .15s var(--ease-out),transform .16s var(--ease-out)}
.btn-icon:hover{background:var(--surface3);color:var(--text)}
.btn-icon:active{transform:scale(.94)}
.btn-icon.danger:hover{background:var(--red-soft);color:var(--red);border-color:var(--red)}

/* ══ CARD ══ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);transition:background .3s var(--ease-out),box-shadow .3s var(--ease-out)}
.card + .card{margin-top:16px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--hint)}
.tag{font-size:9.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:20px}
.tag-ok{background:var(--acc-soft);color:var(--acc)}
.tag-warn{background:var(--oj-soft);color:#9A6516}
.tag-red{background:var(--red-soft);color:#B84842}

/* ══ KPIs ══ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);transition:background .3s var(--ease-out),box-shadow .3s var(--ease-out)}
.kpi .l{font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--hint)}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-1px;margin-top:10px;font-variant-numeric:tabular-nums}
/* Color por KPI (tinte suave + valor/etiqueta a color) */
.kpi.k1{background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-color:color-mix(in srgb,var(--accent) 22%,var(--border))}
.kpi.k1 .l{color:color-mix(in srgb,var(--accent) 72%,var(--muted))}
.kpi.k1 .v{color:var(--accent)}
.kpi.k2{background:color-mix(in srgb,var(--green) 8%,var(--surface));border-color:color-mix(in srgb,var(--green) 24%,var(--border))}
.kpi.k2 .l{color:color-mix(in srgb,var(--green) 72%,var(--muted))}
.kpi.k2 .v{color:var(--green)}
.kpi.k3{background:color-mix(in srgb,var(--oj) 9%,var(--surface));border-color:color-mix(in srgb,var(--oj) 26%,var(--border))}
.kpi.k3 .l{color:color-mix(in srgb,var(--oj) 72%,var(--muted))}
.kpi.k3 .v{color:var(--oj)}
.kpi.k4{background:color-mix(in srgb,#2E7EA8 9%,var(--surface));border-color:color-mix(in srgb,#2E7EA8 24%,var(--border))}
.kpi.k4 .l{color:color-mix(in srgb,#2E7EA8 70%,var(--muted))}
.kpi.k4 .v{color:#2E7EA8}
[data-theme="oscuro"] .kpi.k1,[data-theme="oscuro"] .kpi.k2,[data-theme="oscuro"] .kpi.k3,[data-theme="oscuro"] .kpi.k4{background:var(--surface)}

/* ══ FORM / CABECERAS ══ */
.section-title{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--hint);margin:38px 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;max-width:1080px;margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field-lbl{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--hint);margin-bottom:7px}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;min-height:44px;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface2);
  font-size:13.5px;color:var(--text);outline:none;font-family:inherit;transition:border-color .15s var(--ease-out),background .15s var(--ease-out),box-shadow .15s var(--ease-out);
}
:focus{border-color:var(--accent);background:var(--surface)}
input:focus-visible,select:focus-visible,textarea:focus-visible{box-shadow:0 0 0 3px var(--acc-soft)}
select{cursor:pointer}
textarea{resize:vertical}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:44px;padding:11px 10px;border:1px solid var(--border2);border-radius:12px;background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;transition:background .15s var(--ease-out),color .15s var(--ease-out),border-color .15s var(--ease-out),transform .16s var(--ease-out);font-family:inherit}
.seg button:active{transform:scale(.97)}
.seg button.on{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.seg button.on.verde{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.seg button.on.oj{background:var(--oj-soft);color:var(--oj);border-color:var(--oj)}
.seg button.on.rojo{background:var(--red-soft);color:var(--red);border-color:var(--red)}

/* ══ PICKER (input con dropdown) ══ */
.pick{position:relative}
.pick-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface2);cursor:pointer;transition:border-color .15s var(--ease-out),transform .16s var(--ease-out);font-family:inherit}
.pick-btn:active{transform:scale(.995)}
.pick-btn:focus{border-color:var(--accent)}
.pick-btn .tick{width:20px;height:20px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.pick-btn .tick.on{background:var(--acc);border-color:var(--acc)}
.pick-btn .t{flex:1;min-width:0}
.pick-btn .t .a{display:block;font-size:13.5px;font-weight:600;white-space:normal;word-break:break-word}
.pick-btn .t .b{display:block;font-size:11.5px;color:var(--hint);margin-top:2px}
.pick-btn .chev{color:var(--hint);font-size:11px}
.pick-pop{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;transform-origin:top center;animation:pop .16s var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.pick-search{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.pick-search input{flex:1;border:none;outline:none;background:none;font-size:14px;color:var(--text);padding:0}
.pick-list{max-height:300px;overflow-y:auto}
.pick-it{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 16px;border:none;border-bottom:1px solid var(--border);background:var(--surface);cursor:pointer;transition:background .12s var(--ease-out),transform .16s var(--ease-out);font-family:inherit}
.pick-it:hover{background:var(--surface2)}
.pick-it:active{transform:scale(.99)}
.pick-it .code{width:34px;height:34px;flex-shrink:0;border-radius:10px;background:var(--surface3);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700}
.pick-it .t{flex:1;min-width:0}
.pick-it .t .a{display:block;font-size:13.5px;font-weight:500;white-space:normal;word-break:break-word}
.pick-it .t .b{display:block;font-size:11.5px;color:var(--hint);margin-top:2px}
.pick-foot{padding:11px 16px;background:var(--surface2);border-top:1px solid var(--border);font-size:11.5px;color:var(--hint)}
.okbak{background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;margin-top:14px;font-size:12.5px}
.okbak b{font-size:15px}
.notice{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:11px;background:var(--oj-soft);font-size:11.5px;color:#8A5A16;margin-top:10px}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box{display:flex;align-items:center;justify-content:center;gap:10px;padding:64px 20px;color:var(--hint);font-size:13px}

/* ══ CALENDARIO ══ */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head .t{font-size:14.5px;font-weight:600;letter-spacing:-.2px}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:30px;height:30px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--muted);cursor:pointer;font-size:13px}
.cal-nav button:hover{background:var(--surface3)}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-dow div{text-align:center;font-size:10.5px;font-weight:600;color:var(--hint);letter-spacing:.5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{aspect-ratio:1;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:12.5px;font-weight:500;cursor:pointer;font-variant-numeric:tabular-nums;position:relative;display:flex;align-items:center;justify-content:center;transition:background .13s var(--ease-out),border-color .13s var(--ease-out),transform .14s var(--ease-out);padding:0;font-family:inherit}
.cal .d:active:not(.empty){transform:scale(.94)}
.cal .d.empty{border-color:transparent;background:transparent;cursor:default}
.cal .d .dotnum{position:absolute;bottom:4px;font-size:7.5px;font-weight:700}
.cal .d.sun{background:var(--red-soft);color:#C4544F;border-color:#F5E3E2}
.cal .d.hol{background:var(--red-soft);color:#B84842;border-color:#EFCFCD;font-weight:600}
.cal .d.full{background:var(--oj-soft);color:#9A6516;border-color:var(--border)}
.cal .d.range{background:var(--accent-soft);color:var(--accent);border-color:var(--border)}
.cal .d.sel{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.cal .d.sel.verde{background:var(--green);border-color:var(--green)}
.cal .d.sel.oj{background:var(--oj);border-color:var(--oj)}
.cal .d.today{box-shadow:0 0 0 2px #17171A}
.cal .d.blocked{cursor:not-allowed}
.cal-legend{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:11.5px;color:var(--hint)}
.cal-legend span{display:flex;align-items:center;gap:6px}
.cal-legend .sw{width:9px;height:9px;border-radius:3px;border:1px solid transparent}

/* ══ TABLA REGISTROS ══
   Cómo se combinan los colores con el fondo:
   1) La superficie de la tabla se tiñe con el FONDO ACTIVO de la sección
      (--bg cambia por pestaña: neutro, verde o ámbar), así la tabla acompaña el
      color de la página en vez de verse como un bloque frío encima.
   2) Las bandas de agrupación (mes, totales, subtotales) NO llevan un gris fijo:
      son el COLOR DEL TEXTO con alfa bajo, compuesto sobre esa superficie. En tema
      claro oscurecen y en oscuro aclaran sobre el mismo tono de la tabla, con la
      jerarquía intacta (subtítulo 6% < total 8% < encabezado 9% < año 13%).
   3) Los bordes también salen del color del texto, nunca de un gris fijo. */
.table-card{background:color-mix(in srgb,var(--surface) 78%,var(--bg) 22%);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-top:20px;box-shadow:var(--shadow-sm)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{text-align:left;padding:13px 18px;background:color-mix(in srgb,var(--text) 4%,transparent);border-bottom:1px solid var(--border);font-size:10.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--hint);white-space:nowrap}
/* Contenedor con scroll y encabezado de tabla fijo */
.tbl-scroll{overflow:auto;max-height:calc(100vh - 250px)}
.tbl-scroll thead th{position:sticky;top:0;z-index:3;box-shadow:inset 0 -1px 0 var(--border)}
.tbl tbody td{padding:6px 16px;border-bottom:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl .btn-icon{width:24px;height:24px;border-radius:7px;font-size:11px;padding:0}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--text) 4%,transparent)}
.tbl tbody tr.fecha-head td{background:color-mix(in srgb,var(--text) 9%,transparent);font-weight:800;font-size:12.5px;color:var(--text);border-top:2px solid color-mix(in srgb,var(--text) 16%,transparent);border-bottom:1px solid color-mix(in srgb,var(--text) 12%,transparent);cursor:pointer;padding:6px 18px}
.tbl tbody tr.fecha-head:hover td{background:color-mix(in srgb,var(--text) 12%,transparent)}
.tbl tbody tr.res-anio td{background:color-mix(in srgb,var(--text) 13%,transparent);font-weight:800;font-size:12.5px;color:var(--text);border-top:2px solid color-mix(in srgb,var(--text) 20%,transparent);border-bottom:1px solid color-mix(in srgb,var(--text) 16%,transparent);cursor:pointer;padding:8px 18px}
.tbl tbody tr.res-anio:hover td{background:color-mix(in srgb,var(--text) 16%,transparent)}
.tbl tbody tr.mes-total td{background:color-mix(in srgb,var(--text) 8%,transparent);font-weight:800;font-size:11px;color:var(--text);border-top:2px solid color-mix(in srgb,var(--text) 16%,transparent);cursor:pointer;padding:5px 18px;line-height:1.25}
.tbl tbody tr.mes-total:hover td{background:color-mix(in srgb,var(--text) 11%,transparent)}
.tbl tbody tr.semana-total td{background:color-mix(in srgb,var(--text) 6%,transparent);font-weight:700;font-size:11px;color:var(--text);border-top:2px solid color-mix(in srgb,var(--text) 10%,transparent);padding:4px 18px;line-height:1.2}
.tbl tbody tr.semana-total:hover td{background:color-mix(in srgb,var(--text) 9%,transparent)}
.tbl tbody tr.fecha-total td{background:color-mix(in srgb,var(--text) 8%,transparent);font-weight:800;font-size:11px;border-top:2px solid color-mix(in srgb,var(--text) 16%,transparent);border-bottom:1px solid color-mix(in srgb,var(--text) 12%,transparent);padding:5px 18px;line-height:1.25;color:var(--text)}
.tbl tbody tr.fecha-total:hover td{background:color-mix(in srgb,var(--text) 11%,transparent)}
/* Botón pequeño para mostrar/ocultar los días anteriores del mes (vista más limpia) */
.btn-dias-prev{font-family:inherit;font-size:10px;font-weight:600;letter-spacing:.2px;padding:2px 9px;margin-left:8px;border-radius:20px;border:1px solid color-mix(in srgb,var(--text) 16%,transparent);background:color-mix(in srgb,var(--text) 6%,transparent);color:var(--muted);cursor:pointer;vertical-align:middle;white-space:nowrap;transition:background .18s var(--ease-out),color .18s var(--ease-out)}
.btn-dias-prev:hover{background:color-mix(in srgb,var(--text) 12%,transparent);color:var(--text)}
.btn-dias-prev:active{transform:translateY(1px)}
/* Vista Día completo compacta */
.tbl.tbl-compact thead th{padding:8px 10px;font-size:9.5px;letter-spacing:.5px}
.tbl.tbl-compact tbody td{padding:3px 10px;font-size:12px}
.tbl.tbl-compact tbody tr.fecha-head td{padding:3px 10px;font-size:11.5px;border-top-width:1px}
.tbl.tbl-compact tbody tr.fecha-total td{padding:2px 10px}
.tbl.tbl-compact tbody tr.fecha-total td:first-child{padding-left:18px}
.tbl .badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:600}
.tbl .badge.gray{background:var(--surface3);color:var(--muted)}
.tbl .badge.purp{background:var(--accent-soft);color:var(--accent)}
.tbl .badge.green{background:var(--green-soft);color:var(--green)}
.tbl .badge.oj{background:var(--oj-soft);color:var(--oj)}
.tbl-foot{padding:14px 18px;background:color-mix(in srgb,var(--text) 4%,transparent);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--hint)}
/* Gráfico de torta (donut) por responsable */
.chart-card{margin-top:20px}
.chart-head{margin-bottom:16px}
.chart-title{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.chart-sub{font-size:12px;color:var(--hint);margin-top:2px}
.dn-wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.dn-svg{flex-shrink:0;filter:drop-shadow(0 6px 18px rgba(23,23,26,.10))}
.dn-legend{flex:1;min-width:230px;display:flex;flex-direction:column;gap:2px;max-height:330px;overflow:auto}
.dn-it{display:grid;grid-template-columns:11px 1fr auto auto;align-items:center;gap:10px;font-size:12.5px;padding:5px 2px;border-bottom:1px solid var(--border)}
.dn-it .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.dn-it .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.dn-it .pc{font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.dn-it .vl{color:var(--hint);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.dn-empty{color:var(--hint);font-size:13px;padding:24px 0;text-align:center}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
[data-theme="oscuro"] .dn-svg{filter:none}
.searchbar{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--border);border-radius:11px;background:var(--surface);min-width:260px}
.searchbar input{flex:1;border:none;outline:none;background:none;font-size:13px;color:var(--text);padding:0;width:auto}
.searchbar .i{color:var(--faint);font-size:12px}
.f-date{padding:8px 10px;border:1px solid var(--border);border-radius:11px;background:var(--surface2);font-size:12px;color:var(--text);width:auto!important}

/* ══ TOAST ══ */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);z-index:9999;background:#17171A;color:#fff;padding:13px 22px;border-radius:13px;font-size:13.5px;font-weight:500;box-shadow:0 14px 40px rgba(23,23,26,.3);transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{background:var(--green)}
#toast.error{background:var(--red)}

@media(max-width:820px){
  .sidebar{width:78px;padding:14px 12px}
  .sb-brand{flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px 0 12px}
  .sb-brand .tt,.sb-item .lb,.sb-user{display:none}
  .sb-collapse{display:none}
  .sb-item{justify-content:center;padding:11px}
  .sb-foot{justify-content:center}
  .sb-lab{font-size:0;padding:12px 6px 4px;height:20px}
  .sb-lab::after{content:'';display:block;height:1px;background:rgba(255,255,255,.09)}
  .topbar,.content{padding-left:20px;padding-right:20px}
  .grid2{grid-template-columns:1fr}
  .chart-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr}
}
@media(max-width:500px){
  .kpi-grid{grid-template-columns:1fr}
}
/* Accesibilidad: menos movimiento si el usuario lo pide */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .content-box,.pick-pop{animation:none!important}
  .btn:active,.seg button:active,.pick-it:active,.pick-btn:active,.cal .d:active{transform:none!important}
  .anim-in,.anim-row,.dn-in,#toast .t-bar,.cal .d.today,.cal .d.sel,.seg button.on{animation:none!important}
}

/* ══════════════════════════════════════════════════════════════
   CAPA VISUAL v2 · movimiento, profundidad y micro-interacciones
   Todo aditivo: refina lo anterior sin quitar nada.
   ══════════════════════════════════════════════════════════════ */
:root{
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-emph:cubic-bezier(.16,.84,.28,1);
  --dur-1:120ms; --dur-2:240ms; --dur-3:440ms;
  --lift:0 2px 4px rgba(23,23,26,.05),0 12px 26px rgba(23,23,26,.09),0 26px 52px rgba(23,23,26,.07);
}
[data-theme="oscuro"]{ --lift:0 2px 6px rgba(0,0,0,.45),0 16px 34px rgba(0,0,0,.5) }

/* ── Keyframes de la capa v2 ── */
@keyframes animRise{from{opacity:0;transform:translate3d(0,12px,0) scale(.996)}to{opacity:1;transform:none}}
@keyframes animFadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalBackIn{from{opacity:0}to{opacity:1}}
@keyframes modalCardIn{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
@keyframes drawSlice{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes ripple{from{opacity:.17;transform:scale(0)}to{opacity:0;transform:scale(2.5)}}
@keyframes segPop{0%{transform:scale(.94)}62%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes todayPulse{0%,100%{box-shadow:0 0 0 2px #17171A}50%{box-shadow:0 0 0 2px #17171A,0 0 0 8px color-mix(in srgb,var(--accent) 20%,transparent)}}
@keyframes skelShine{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes logoIn{from{opacity:0;transform:scale(.82) rotate(-7deg)}to{opacity:1;transform:none}}
@keyframes tbSwap{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
@keyframes toastBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ── Entrada escalonada de vistas y filas ── */
.content-box>.anim-in{animation:animRise var(--dur-3) var(--ease-emph) backwards;animation-delay:calc(var(--i,0)*45ms)}
.tbl tbody tr.anim-row{animation:animFadeIn .34s var(--ease-emph) backwards;animation-delay:calc(var(--i,0)*18ms)}
.dn-it.dn-in{animation:animFadeIn .4s var(--ease-emph) backwards;animation-delay:calc(var(--i,0)*36ms)}

/* ── Barra superior reactiva + progreso de lectura ──
   OJO: sin cambios de tamaño/padding aquí. Mover el alto de la barra fija
   desplaza todo el contenido en cada cruce del umbral y eso produce parpadeo
   al hacer scroll (más aún en tablas de miles de filas). Solo pintura. */
.topbar{transition:background .3s,box-shadow .3s var(--ease-out),border-color .3s}
.topbar.scrolled{box-shadow:0 1px 0 var(--border),0 8px 24px rgba(23,23,26,.07)}
[data-theme="oscuro"] .topbar.scrolled{box-shadow:0 1px 0 var(--border),0 12px 30px rgba(0,0,0,.45)}
.tb-progress{position:absolute;left:0;bottom:-1px;height:2px;width:100%;border-radius:0 2px 2px 0;pointer-events:none;
  background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 30%,transparent));
  transform:scaleX(0);transform-origin:0 50%;transition:transform .12s linear,opacity .25s var(--ease-out)}
.tb-swap{animation:tbSwap .34s var(--ease-emph) backwards}

/* ── Sidebar: indicador activo, íconos con vida ── */
.sb-item{position:relative;overflow:hidden}
.sb-item::before{content:'';position:absolute;left:0;top:50%;width:3px;height:0;border-radius:0 3px 3px 0;
  background:linear-gradient(180deg,#9A94F5,#6E66F2);transform:translateY(-50%);transition:height .28s var(--ease-emph)}
.sb-item.active::before{height:20px}
.sidebar.collapsed .sb-item::before{display:none}
.sb-item .ico{transition:transform .28s var(--ease-spring),opacity .16s,color .16s}
.sb-item:hover .ico{transform:scale(1.09)}
.sb-item:active .ico{transform:scale(.95)}
.sb-item.active{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 8px 18px rgba(0,0,0,.3)}
.sb-brand .logo{animation:logoIn .55s var(--ease-spring) backwards}
.sb-collapse{transition:background .15s,color .15s,transform .15s,box-shadow .2s}
.sb-collapse:hover{box-shadow:0 0 0 4px rgba(255,255,255,.05)}
.sb-logout{transition:background .15s,color .15s,transform .2s var(--ease-spring)}
.sb-logout:hover{transform:scale(1.08)}
.sb-avatar{transition:transform .28s var(--ease-spring),box-shadow .28s}
.sb-foot:hover .sb-avatar{transform:scale(1.06);box-shadow:0 0 0 3px rgba(139,133,240,.18)}

/* ── Superficies con profundidad real ── */
.card{transition:background .3s var(--ease-out),box-shadow .3s var(--ease-out),transform .3s var(--ease-emph),border-color .3s var(--ease-emph)}
button.card:hover{transform:translateY(-3px);box-shadow:var(--lift);border-color:var(--border2)}
button.card:active{transform:translateY(-1px) scale(.997)}
.home-card{box-shadow:none;transition:transform .3s var(--ease-emph),box-shadow .3s var(--ease-out),border-color .3s var(--ease-emph)}
.home-card .hc-ico{transition:transform .3s var(--ease-spring)}
.home-card:hover .hc-ico{transform:scale(1.09) rotate(-3deg)}
.home-card .hc-arrow{transition:transform .3s var(--ease-emph),color .3s}
.home-card:hover .hc-arrow{transform:translateX(5px);color:var(--accent)}
.kpi-grid{margin-top:26px}

/* ── KPIs: elevación, halo y contador ── */
.kpi.k1{--kcol:var(--accent)} .kpi.k2{--kcol:var(--green)} .kpi.k3{--kcol:var(--oj)} .kpi.k4{--kcol:#2E7EA8}
.kpi{position:relative;overflow:hidden;transition:transform .3s var(--ease-emph),box-shadow .3s var(--ease-out),background .3s var(--ease-out),border-color .3s var(--ease-out)}
.kpi::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .38s var(--ease-out);
  background:radial-gradient(125% 100% at 100% 0%,color-mix(in srgb,var(--kcol,var(--accent)) 20%,transparent),transparent 62%)}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--lift)}
.kpi:hover::after{opacity:1}

function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmt(s){ var p=String(s).split('-'); return p[2]+' '+(MONTHS[+p[1]-1]).toLowerCase()+' '+p[0]; }
var MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function norm(s){ return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase(); }
function hoy(){ return iso(new Date()); }
function toast(msg,type,dur){
  try{
    var t=document.getElementById('toast'); if(!t) return;
    var ms=+dur||2800;
    var ico=type==='success'?'✓':type==='error'?'!':type==='warn'?'⚠':'i';
    if(type!=='success'&&type!=='error'&&type!=='warn'){ type=''; }
    if(t.style && t.style.setProperty) t.style.setProperty('--t-dur',ms+'ms');
    if(t.innerHTML!==undefined){
      t.innerHTML='<span class="t-ico">'+ico+'</span><span class="t-msg"></span><span class="t-bar"></span>';
      var tm=(t.querySelector?t.querySelector('.t-msg'):null);
      if(tm) tm.textContent=msg; else t.innerHTML=esc(msg);
    } else { t.textContent=msg; }
    t.className=(type==='success'?'success':type==='error'?'error':type==='warn'?'warn':'');
    void t.offsetWidth;   // reinicia la barra de vida en cada aviso
    t.classList.add('show');
    clearTimeout(t._x); t._x=setTimeout(function(){ try{ t.classList.remove('show'); }catch(e){} },ms);
  }catch(e){ /* el aviso nunca debe romper la app */ }
}

// Cálculo de término de vacaciones: cuenta días hábiles (L-V, sin feriados)
function vacEnd(startIso,dias,incluyeSabado){
  if(!startIso||dias<1) return null;
  var d=new Date(startIso+'T12:00:00'), count=0, last=null;
  while(count<dias){
    var w=d.getDay();
    var habil = incluyeSabado ? (w!==0) : (w!==0&&w!==6);   // sindicales: L-S; resto: L-V
    if(habil && FER.indexOf(iso(d))<0){ count++; last=iso(d); }
    if(count<dias) d.setDate(d.getDate()+1);
  }
  return last;
}

  })();

}
async function dbReady(){ db(); return _sbReady; }
function _authClient(){ return supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }

async function loginIndex(){
  var email=document.getElementById('li-email').value.trim();
  var pass=document.getElementById('li-pass').value;
  var btn=document.getElementById('li-btn'), errEl=document.getElementById('li-error');
  if(!email||!pass){ errEl.textContent='Ingresa email y contraseña'; return; }
  btn.disabled=true; btn.textContent='Verificando...'; errEl.textContent='';
  try{
    var ac=_authClient();
    var res=await ac.auth.signInWithPassword({email:email,password:pass});
    if(res.error) throw res.error;
    await ac.auth.setSession({access_token:res.data.session.access_token,refresh_token:res.data.session.refresh_token});
    var perfilRes=await ac.from('usuarios').select('nombre,rol,activo').eq('id',res.data.user.id).single();
    if(perfilRes.error||!perfilRes.data) throw new Error('Usuario no encontrado. Contacta al administrador.');
    if(!perfilRes.data.activo) throw new Error('Tu cuenta está desactivada.');
    _sesion={id:res.data.user.id,email:res.data.user.email,nombre:perfilRes.data.nombre,rol:perfilRes.data.rol};
    _sesion.access_token=res.data.session.access_token;
    _sesion.refresh_token=res.data.session.refresh_token;
    localStorage.setItem('friosur_sesion_idx',JSON.stringify(_sesion));
    mostrarApp();
  }catch(e){
    var msg=e.message||'Error al iniciar sesión';
    if(msg.includes('Invalid login')) msg='Email o contraseña incorrectos';
    errEl.textContent=msg; btn.disabled=false; btn.textContent='Ingresar';
  }
}

function logoutIndex(){
  if(!confirm('¿Cerrar sesión?')) return;

async function cargarDatosBase(){
  var d=await dbReady();
  // Consultas base EN PARALELO (select(*) para no romper si falta una columna opcional)
  var base=await Promise.all([
    d.from('empleados').select('*').eq('activo',true).order('nombre'),
    d.from('unidades_excluidas').select('*'),
    d.from('autorizadores').select('*').eq('activo',true).order('nombre')
  ]);
  var empRes=base[0], ueRes=base[1], autRes=base[2];
  if(empRes.error) console.error('[EMPLEADOS]', empRes.error.message||empRes.error);
  if(empRes.error) toast('Error al cargar empleados: '+(empRes.error.message||empRes.error),'error',8000);
  function _mapEmp(e){ return {c:e.codigo,n:e.nombre,cc:e.centro_costo,tipo:e.contrato||'INDEFINIDO',ing:e.fecha_ingreso||null,baseOverride:(e.dias_base!=null?e.dias_base:null),progOverride:(e.dias_progresivos!=null?e.dias_progresivos:null),sindOverride:(e.dias_sindicales!=null?e.dias_sindicales:null)}; }
  _EMP=(empRes.data||[]).map(_mapEmp);
  _EMP_EXCL=(!ueRes.error&&ueRes.data)?ueRes.data.map(_mapEmp):[];
  // Responsables (jefaturas directas) desde la tabla 'autorizadores'
  if(autRes.error && autRes.data===null){
    // Tabla aún no creada: caer a usuarios con rol != operario
    var usrRes=await d.from('usuarios').select('id,nombre,rol').eq('activo',true).neq('rol','operario');
    _AUT=(usrRes.data||[]).map(function(u){ return {c:_iniciales(u.nombre),n:u.nombre,sub:'Jefatura directa',id:u.id}; });
  } else {
    _AUT=(autRes.data||[]).map(function(r){ return {c:_iniciales(r.nombre),n:r.nombre,sub:r.cargo||'Jefatura directa',id:r.id}; });
  }
  if(!_AUT.length) _AUT=[{c:'A001',n:'Patricia Soto',sub:'Jefa RRHH',id:null}];
  // Preseleccionar al usuario conectado como autorizador
  if(!_form.aut && _sesion && _sesion.nombre){
    var yo=_AUT.find(function(a){ return a.n && String(a.n).toLowerCase()===String(_sesion.nombre).toLowerCase(); });
    if(yo) _form.aut={c:yo.c,n:yo.n,sub:yo.sub,id:yo.id};
  }
  // Centros de costo únicos
  var ccSet={}; _EMP.forEach(function(e){ if(e.cc) ccSet[e.cc]=1; });
  _CC=Object.keys(ccSet).map(function(k){ return {c:k.slice(0,4),n:k}; });
  if(!_CC.length) _CC=[{c:'1110',n:'1110 Producción (FS)'},{c:'1114',n:'1114 RRHH (FS)'}];
  // Documentos locales y solicitudes: EN PARALELO (independientes entre sí)
  _persistirStorage();
  if(!window._reconectarLst){ window._reconectarLst=true; document.addEventListener('click', _reconectarCarpetaAlClic, {once:true}); }
  await Promise.all([cargarCarpetaConfig(), cargarDocIds(), cargarSolicitudes()]);
  if(!_carpetaObligatoriaOk()) _mostrarGateCarpeta();
  render();
}

// ═══════════════════════════════════════════════════════════════
//  FERIADO PROGRESIVO (Art. 68 Código del Trabajo de Chile)
//  Base 15 días hábiles + 1 día adicional por cada 3 años de
//  servicio a contar del año 10, con tope de 5 días adicionales.
// ═══════════════════════════════════════════════════════════════
// Base: 15 días hábiles general. En Aysén, Magallanes y provincia de Palena
// la Ley 20.058 (inciso 2º Art. 67) fija 20 días hábiles.
var FERIADO_BASE=20, PROG_MAX=5, PROG_DESDE=10, PROG_CADA=3, DIAS_SINDICALES=5;
// Años de servicio completos desde la fecha de ingreso (YYYY-MM-DD)
function _anosServicio(fechaIngreso){
  if(!fechaIngreso) return null;
  var fi=new Date(String(fechaIngreso).slice(0,10)+'T12:00:00');
  if(isNaN(fi.getTime())) return null;
  var h=new Date();
  var a=h.getFullYear()-fi.getFullYear();
  var m=h.getMonth()-fi.getMonth();
  if(m<0 || (m===0 && h.getDate()<fi.getDate())) a--;
  return a<0?0:a;
}
// Días adicionales de feriado progresivo (Art. 68).
// La base son 10 años de trabajo; desde ahí se suma 1 día por cada 3 años NUEVOS
// trabajados, de modo que el primer día adicional se devenga al cumplir 13 años
// (10 + 3), el segundo a los 16, y así. Criterio de la Dirección del Trabajo
// (Dictamen N° 380/2025 y su tabla: hasta 12 años → 0, 13-15 → 1, 16-18 → 2,
// 19-21 → 3, 22-24 → 4, 25 o más → tope de 5).
function _diasProgresivos(anos){
  if(anos==null) return 0;
  return Math.min(PROG_MAX, Math.max(0, Math.floor((anos-PROG_DESDE)/PROG_CADA)));
}
// Total de días hábiles de feriado (base + progresivo + sindicales)
function _diasFeriadoTotal(anos){ return FERIADO_BASE + _diasProgresivos(anos) + DIAS_SINDICALES; }

// Asignación de días de un empleado.
//  - Feriado progresivo: es POR LEY (Art. 68) → se calcula con la antigüedad
//    (primer día adicional a los 13 años; ver _diasProgresivos). Se admite fijarlo
//    a mano solo para acreditar años trabajados en empleadores anteriores.
//  - Base y sindicales: pueden tener valor negociado (override) si existe.
function _asignacionDias(emp, anos){
  var base=(emp && emp.baseOverride!=null)?emp.baseOverride:FERIADO_BASE;
  // El progresivo se calcula por ley según la antigüedad; se respeta un valor
  // acreditado (> 0) para poder computar hasta 10 años de empleadores anteriores,
  // que la app no puede conocer (cartola de cotizaciones).
  var progAuto=_diasProgresivos(anos);
  var prog=(emp && emp.progOverride!=null && +emp.progOverride>0)?(+emp.progOverride):progAuto;
  var sind=(emp && emp.sindOverride!=null)?emp.sindOverride:DIAS_SINDICALES;
  return {base:base, prog:prog, sind:sind};
}
// Días usados de un empleado por bolsa, según las vacaciones registradas.
// Las vacaciones a caballo de año se REPARTEN: se imputan a cada año los días
// hábiles que caen dentro de él (prorrateando el desglose por bolsa).
function _usoDias(codigo, excluirId, anio){
  anio=String(anio||new Date().getFullYear());
  var u={base:0,prog:0,sind:0};
  var k=String(codigo||'').trim().toUpperCase();
  var y0=anio+'-01-01', y1=anio+'-12-31';
  (typeof _SOLIC!=='undefined'?_SOLIC:[]).forEach(function(s){
    if(!s || s.tipo!=='VACACIONES') return;
    if(s.id && excluirId && s.id===excluirId) return;
    if(String(s.codigo||'').trim().toUpperCase()!==k) return;
    var est=String(s.estado||'').toUpperCase();
    if(est==='RECHAZADO'||est==='ANULADO') return;
    var ini=String(s.inicio||'').slice(0,10);
    if(!ini) return;
    var fin=String(s.termino||'').slice(0,10);
    var b0=parseFloat(s.dias_base||0)||0, p0=parseFloat(s.dias_progresivo||0)||0, s0=parseFloat(s.dias_sindical||0)||0;
    function sumarBolsa(cant){                  // asigna 'cant' días a su bolsa (o desglose directo)
      if(b0||p0||s0){ u.base+=b0; u.prog+=p0; u.sind+=s0; return; }
      var td=String(s.tipo_dias||'BASE').toUpperCase();
      if(td==='PROGRESIVO'||td==='PROG') u.prog+=cant;
      else if(td==='SINDICAL'||td==='SIND') u.sind+=cant;
      else u.base+=cant;
    }
    if(!fin || fin===ini){                      // sin rango: se imputa al año del inicio
      if(ini.slice(0,4)!==anio) return;
      sumarBolsa(parseFloat(s.dias_habiles||0)||b0+p0+s0||1);
      return;
    }
    // Con rango: reparte los días hábiles que caen dentro de este año
    var a=(ini>y0?ini:y0), b=(fin<y1?fin:y1);
    if(a>b) return;                             // no cae en el año
    var enAnio=contarHabiles(a,b); if(!enAnio) return;
    var totalHab=contarHabiles(ini,fin);
    if(totalHab==null || totalHab<=0) totalHab=parseFloat(s.dias_habiles||0)||enAnio;
    if(b0||p0||s0){                             // reparte el desglose proporcionalmente
      var rx=enAnio/totalHab;
      u.base+=b0*rx; u.prog+=p0*rx; u.sind+=s0*rx;
    } else {
      // Sin desglose por bolsa se reparte el TOTAL GUARDADO (dias_habiles) según los
      // días hábiles de cada año, con el mismo criterio que cuando el desglose existe:
      // así descontar lo tomado no depende de si el registro trae desglose o no.
      var td=String(s.tipo_dias||'BASE').toUpperCase();
      var totG=parseFloat(s.dias_habiles||0)||0;
      var cant=totG>0?(totG*enAnio/totalHab):enAnio;
      if(td==='PROGRESIVO'||td==='PROG') u.prog+=cant;
      else if(td==='SINDICAL'||td==='SIND') u.sind+=cant;
      else u.base+=cant;
    }
  });
  u.base=Math.round(u.base*100)/100; u.prog=Math.round(u.prog*100)/100; u.sind=Math.round(u.sind*100)/100;
  return u;
}
// Días tomados de un empleado imputados a un período de aniversario, por bolsa.
// Usa la misma regla de imputación del ledger: lo solicitado se carga al período
// que estaba disponible al iniciarse (años de servicio al inicio − 1).
function _tomadosEnPeriodo(emp, i, excluirId){
  var u={base:0,prog:0,sind:0};
  if(!emp || !emp.ing) return u;
  var k=String(emp.c||'').trim().toUpperCase(), ing=String(emp.ing).slice(0,10);
  (typeof _SOLIC!=='undefined'?_SOLIC:[]).forEach(function(s){
    if(!s || s.tipo!=='VACACIONES') return;
    if(s.id && excluirId && s.id===excluirId) return;
    if(String(s.codigo||'').trim().toUpperCase()!==k) return;
    var est=String(s.estado||'').toUpperCase(); if(est==='RECHAZADO'||est==='ANULADO') return;
    var ini=String(s.inicio||'').slice(0,10); if(!ini) return;
    var a=_anosEntre(ing,ini); if(a==null) return;
    if(Math.max(0,a-1)!==i) return;
    var b=parseFloat(s.dias_base||0)||0, p=parseFloat(s.dias_progresivo||0)||0, si=parseFloat(s.dias_sindical||0)||0;
    if(b||p||si){ u.base+=b; u.prog+=p; u.sind+=si; return; }
    var d=parseFloat(s.dias_habiles||0)||0; if(!d) d=1;
    var td=String(s.tipo_dias||'BASE').toUpperCase();
    if(td==='PROGRESIVO'||td==='PROG') u.prog+=d;
    else if(td==='SINDICAL'||td==='SIND') u.sind+=d;
    else u.base+=d;
  });
  return u;
}
// ── SALDO DISPONIBLE POR BOLSA · ÚNICA FUENTE DE VERDAD ─────────────────────
// Recorre los períodos de aniversario del empleado:
//   · períodos ya cumplidos -> aportan lo que quedó sin tomar (derecho − tomado)
//   · período en curso      -> aporta lo devengado a la fecha (derecho × fracción)
// descontando lo ya imputado a cada período. El formulario de solicitud y el modal
// «Períodos de vacaciones» usan esta misma función, para que nunca muestren ni
// permitan cifras distintas (antes el formulario usaba el devengo del período en
// curso sin descontar lo tomado, y el modal el acumulado de períodos cerrados).
function _saldoPorBolsa(emp, excluirId){
  if(!emp || !emp.ing) return null;
  var N=_anosServicio(emp.ing); if(N==null) return null;
  var r=function(x){ return Math.round(x*100)/100; };
  var tot={base:0,prog:0,sind:0}, dev={base:0,prog:0,sind:0}, tomT={base:0,prog:0,sind:0}, periodos=[];
  for(var i=0;i<=N;i++){
    var asig=_asignacionDias(emp,i);
    var tom=_tomadosEnPeriodo(emp,i,excluirId);
    var frac=1, enCurso=(i===N);
    if(enCurso){
      var d1=new Date(_addAnios(emp.ing,i)+'T12:00:00'), d2=new Date(_addAnios(emp.ing,i+1)+'T12:00:00'), dh=new Date(hoy()+'T12:00:00');
      if(isNaN(d1.getTime())||isNaN(d2.getTime())) frac=0;
      else{
        var totD=Math.round((d2-d1)/86400000)||365;
        frac=Math.max(0,Math.min(1,Math.round((dh-d1)/86400000)/totD));
      }
    }
    var der={base:(asig.base||0)*frac, prog:(asig.prog||0)*frac, sind:(asig.sind||0)*frac};
    var ap={ base:Math.max(0,der.base-tom.base), prog:Math.max(0,der.prog-tom.prog), sind:Math.max(0,der.sind-tom.sind) };
    tot.base+=ap.base; tot.prog+=ap.prog; tot.sind+=ap.sind;
    dev.base+=der.base; dev.prog+=der.prog; dev.sind+=der.sind;
    tomT.base+=tom.base; tomT.prog+=tom.prog; tomT.sind+=tom.sind;
    periodos.push({ i:i, enCurso:enCurso, frac:r(frac),
      derecho:{base:r(der.base),prog:r(der.prog),sind:r(der.sind)},
      tomado:{base:r(tom.base),prog:r(tom.prog),sind:r(tom.sind)},
      aporte:{base:r(ap.base),prog:r(ap.prog),sind:r(ap.sind)} });
  }
  return { base:r(tot.base), prog:r(tot.prog), sind:r(tot.sind),
           devengado:{base:r(dev.base),prog:r(dev.prog),sind:r(dev.sind)},
           tomado:{base:r(tomT.base),prog:r(tomT.prog),sind:r(tomT.sind)},
           periodos:periodos, anos:N };
}
// Días de vacaciones PROGRAMADAS (futuras) por bolsa, de un empleado en un año
function _diasProgramadosPorBolsa(codigo, anio){
  anio=String(anio||new Date().getFullYear());
  var h=hoy(), u={base:0,prog:0,sind:0};
  var k=String(codigo||'').trim().toUpperCase();
  (typeof _SOLIC!=='undefined'?_SOLIC:[]).forEach(function(s){
    if(!s || s.tipo!=='VACACIONES') return;
    if(String(s.codigo||'').trim().toUpperCase()!==k) return;
    var est=String(s.estado||'').toUpperCase(); if(est==='RECHAZADO'||est==='ANULADO') return;
    var ini=String(s.inicio||'').slice(0,10); if(!ini || ini<=h) return;   // solo futuras
    if(ini.slice(0,4)!==anio) return;
    var b=parseFloat(s.dias_base||0)||0, p=parseFloat(s.dias_progresivo||0)||0, si=parseFloat(s.dias_sindical||0)||0;
    if(b||p||si){ u.base+=b; u.prog+=p; u.sind+=si; }
    else {
      var d=parseFloat(s.dias_habiles||0)||0, td=String(s.tipo_dias||'BASE').toUpperCase();
      if(td==='PROGRESIVO'||td==='PROG') u.prog+=d;
      else if(td==='SINDICAL'||td==='SIND') u.sind+=d;
      else u.base+=d;
    }
  });
  u.base=Math.round(u.base*100)/100; u.prog=Math.round(u.prog*100)/100; u.sind=Math.round(u.sind*100)/100;
  return u;
}
// Días devengados PROPORCIONALMENTE en el período en curso (aniversario -> hoy).
// Ley chilena: Art. 67 (feriado legal; 20 días hábiles en Aysén por Ley 20.058)
//   + Art. 68 (progresivo). Se devengan de forma proporcional al tiempo trabajado.
function _diasProporcionales(emp){
  if(!emp || !emp.ing) return null;
  var ing=String(emp.ing).slice(0,10);
  var N=_anosServicio(ing); if(N==null) return null;
  var iniPer=_addAnios(ing,N), finPer=_addAnios(ing,N+1);
  var asig=_asignacionDias(emp,N);
  var progAuto=_diasProgresivos(N);
  var progEf=((progAuto>0)||(emp.progOverride!=null))?(asig.prog||0):0;
  var total=(asig.base||0)+progEf;
  var d1=new Date(iniPer+'T12:00:00'), d2=new Date(finPer+'T12:00:00'), dh=new Date(hoy()+'T12:00:00');
  if(isNaN(d1.getTime())||isNaN(d2.getTime())) return null;
  var totDias=Math.round((d2-d1)/86400000)||365;
  var trans=Math.max(0,Math.min(totDias,Math.round((dh-d1)/86400000)));
  var r=function(x){ return Math.round(x*100)/100; };
  var baseProp=(asig.base||0)*trans/totDias;
  var progProp=progEf*trans/totDias;
  var prop=baseProp+progProp;
  return { dias:r(prop), base:r(baseProp), prog:r(progProp), ini:iniPer, fin:finPer, total:total, transcurridos:trans, delPeriodo:totDias };
}
// Fecha de la última vacación YA tomada (<= hoy) de un trabajador (YYYY-MM-DD o null)

async function setDiasEmpleado(cod, campo, val){

// Reparte/valida los días a tomar según el disponible por bolsa.
// Sale de _saldoPorBolsa, la MISMA función que alimenta el modal de períodos: lo que
// el formulario muestra y lo que permite pedir es siempre el mismo número.
function _dispPorBolsa(){
  if(!_form.emp) return null;
  var s=_saldoPorBolsa(_form.emp,_editSolId); if(!s) return null;
  return { base:s.base, prog:s.prog, sind:s.sind, devengado:s.devengado, tomado:s.tomado };
}
function _recalcTomar(){
  var disp=_dispPorBolsa(); if(!disp) return;
  _form.tomarProg=Math.min(_form.tomarProg||0, disp.prog);   // progresivo: siempre al saldo legal
  if(!_editSolId){   // al editar se conservan base/sindicales
    _form.tomarBase=Math.min(_form.tomarBase||0, disp.base);
    _form.tomarSind=Math.min(_form.tomarSind||0, disp.sind);
  }
  _form.dias=(_form.tomarBase||0)+(_form.tomarProg||0)+(_form.tomarSind||0);
  _form.maxDias=disp.base+disp.prog;   // el saldo no incluye sindicales

function _setTomar(bucket, val){
  var disp=_dispPorBolsa(); if(!disp) return;
  var max=(bucket==='base')?disp.base:(bucket==='prog'?disp.prog:disp.sind);
  if(_editSolId && bucket!=='prog'){   // al editar, base/sind nunca quedan por debajo de lo guardado
    var cur=(bucket==='base')?(_form.tomarBase||0):(_form.tomarSind||0);
    max=Math.max(max,cur);
  }
  var n=Math.max(0,Math.min(max,parseInt(val,10)||0));
  if(bucket==='base') _form.tomarBase=n; else if(bucket==='prog') _form.tomarProg=n; else _form.tomarSind=n;
  _form.dias=(_form.tomarBase||0)+(_form.tomarProg||0)+(_form.tomarSind||0);
  render();
}

  var d=_dispPorBolsa(); if(!d) return;

  _form.dias=d.base+d.prog+d.sind;

// Primer día hábil posterior a una fecha (YYYY-MM-DD). incluyeSabado: los sindicales cuentan sábados.
function _siguienteHabil(isoStr,incluyeSabado){
  var d=new Date(isoStr+'T12:00:00');
  do{ d.setDate(d.getDate()+1); }while((incluyeSabado?(d.getDay()===0):(d.getDay()===0||d.getDay()===6))||FER.indexOf(iso(d))>=0);
  return iso(d);
}
// Último día de las vacaciones considerando días sindicales (con sábados)
function _finVacaciones(f){
  if(!f||!f.start) return null;
  var start=String(f.start).slice(0,10);
  var legalProg=(f.tomarBase||0)+(f.tomarProg||0);
  var sind=f.tomarSind||0;
  var fin = legalProg>0 ? vacEnd(start, legalProg, false) : null;
  if(sind>0){
    var s = fin ? _siguienteHabil(fin, true) : start;   // sindicales pueden comenzar sábado
    fin = vacEnd(s, sind, true);
  }

// ── Períodos de vacaciones por aniversario de ingreso ──────────
// Años completos entre dos fechas
function _anosEntre(a,b){
  var d1=new Date(String(a).slice(0,10)+'T12:00:00'), d2=new Date(String(b).slice(0,10)+'T12:00:00');
  if(isNaN(d1.getTime())||isNaN(d2.getTime())) return null;
  var y=d2.getFullYear()-d1.getFullYear(), m=d2.getMonth()-d1.getMonth();
  if(m<0 || (m===0 && d2.getDate()<d1.getDate())) y--;
  return y;
}
function _addAnios(isoStr,n){
  var p=String(isoStr||'').slice(0,10).split('-');
  var y=(+p[0])+n, m=+p[1], d=+p[2];
  if(!y||!m||!d||m>12) return String(isoStr||'').slice(0,10);
  // Si el día no existe en el año destino (29 de febrero) se usa el último del mes
  var ult=new Date(y,m,0).getDate();
  if(d>ult) d=ult;
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
// Ledger de períodos de un empleado (devengado / tomado / saldo) y próximo aniversario.
// Los saldos salen de _saldoPorBolsa, así «Saldo disponible» es exactamente lo que el
// formulario de solicitud permite pedir. El período en curso aparece con su derecho
// devengado a la fecha (fracción del período transcurrida).
function _periodosVacaciones(emp){
  if(!emp || !emp.ing) return null;
  var ing=String(emp.ing).slice(0,10);
  var sal=_saldoPorBolsa(emp, null);
  if(!sal) return null;
  var r=function(x){ return Math.round(x*100)/100; };
  var periodos=[], saldoDisp=0, totalTom=0, totalDer=0;
  sal.periodos.forEach(function(sp){
    var i=sp.i;
    var derecho=r(sp.derecho.base+sp.derecho.prog+sp.derecho.sind);
    var tomados=r(sp.tomado.base+sp.tomado.prog+sp.tomado.sind);
    var saldo=r(sp.aporte.base+sp.aporte.prog+sp.aporte.sind);
    var disponibleEn=_addAnios(ing,i+1);
    periodos.push({i:i, desde:_addAnios(ing,i), hasta:disponibleEn, derecho:derecho, tomados:tomados, saldo:saldo,
                   disponibleEn:disponibleEn, usable:(sp.enCurso||disponibleEn<=hoy()), actual:sp.enCurso,
                   enCurso:sp.enCurso, fraccion:sp.frac});
    totalDer+=derecho; totalTom+=tomados; saldoDisp+=saldo;
  });
  // El total se toma directo de _saldoPorBolsa (no de la suma fila a fila) para que
  // el KPI del modal sea EXACTAMENTE el mismo número que permite solicitar el formulario.
  return { periodos:periodos, saldoDisponible:+((sal.base+sal.prog+sal.sind).toFixed(2)), proximo:_addAnios(ing,sal.anos+1), anosHoy:sal.anos,
           totalDerecho:r(totalDer), totalTomado:r(totalTom) };
}

// Genera la papeleta Word (.docx) rellenada con los datos de la solicitud
// Rellena una plantilla y devuelve el .docx como Blob
async function _generarDocx(clave, map){
  var b64=(window.PAPELETAS||{})[clave];
  if(!b64) throw new Error('Plantilla no disponible');
  var bin=atob(b64), buf=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  var zip=await JSZip.loadAsync(buf.buffer);
  var docFile=zip.file('word/document.xml');
  if(!docFile) throw new Error('Plantilla inválida');
  var xml=await docFile.async('string');
  xml=xml.replace(/\{\{([A-Za-z0-9_]+)\}\}/g,function(m,name){ return _attr(map[name]!=null?map[name]:''); });
  zip.file('word/document.xml', xml);
  return await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
function _descargarDocx(blob, nombre){
  var url=URL.createObjectURL(blob), a=document.createElement('a');

}

// Genera los .docx (NORMALES y/o SINDICALES) a partir de datos tipo formulario
async function _generarPapeletasDe(f){

// Cuenta días hábiles (L-V, sin feriados chilenos) entre dos fechas YYYY-MM-DD
// (tolera timestamps: usa solo los primeros 10 caracteres)
function contarHabiles(inicio, fin){
  if(!inicio||!fin) return null;
  var a=String(inicio).slice(0,10), b=String(fin).slice(0,10);
  var d=new Date(a+'T12:00:00'), f=new Date(b+'T12:00:00');
  if(isNaN(d.getTime())||isNaN(f.getTime())) return null;
  if(d>f) return 0;
  var n=0;
  while(d<=f){
    var w=d.getDay(), s=iso(d);
    if(w!==0&&w!==6&&FER.indexOf(s)<0) n++;
    d.setDate(d.getDate()+1);
  }
  return n;
}

// Mapea el texto "Permiso Médico" a MEDICO, "Permiso Personal" a PERSONAL, etc.
function _mapTipoPermisoTexto(t){
  var s=String(t||'').toLowerCase();
  if(s.indexOf('medico')>=0||s.indexOf('m\u00e9dico')>=0) return 'MEDICO';
  if(s.indexOf('judicial')>=0) return 'JUDICIAL';
  if(s.indexOf('personal')>=0) return 'PERSONAL';
  return 'PERSONAL';
}

// Trae TODAS las filas de una tabla paginando EN PARALELO (más rápido que secuencial)
async function _fetchAll(d, table, cols, pageSize){
  pageSize=pageSize||1000;
  var first=await d.from(table).select(cols||'*',{count:'exact'}).range(0,pageSize-1);
  if(first.error) return {data:[],error:first.error};
  var all=first.data||[];
  var total=(typeof first.count==='number')?first.count:all.length;
  var paginas=Math.ceil(total/pageSize);
  if(paginas>1){
    var reqs=[];
    for(var p=1;p<paginas;p++){ reqs.push(d.from(table).select(cols||'*').range(p*pageSize, p*pageSize+pageSize-1)); }
    var res=await Promise.all(reqs);
    res.forEach(function(r){ if(!r.error && r.data) all=all.concat(r.data); });
  }
  return {data:all,error:null};
}

async function cargarSolicitudes(){
  var d=await dbReady();
  var todo=[];
  // 1) solicitudes de la app, 2) permisos, 3) empleados: EN PARALELO
  // NOTA: ya NO se lee la tabla `vacaciones` (origen formulario Google Sheets).
  //       Sus datos se migraron a `solicitudes_permiso` (ver vacaciones_migracion.sql).
  var out=await Promise.all([
    d.from('solicitudes_permiso').select('*').order('created_at',{ascending:false}).limit(1000),
    _fetchAll(d,'permisos','*'),
    _fetchAll(d,'empleados','codigo,nombre,centro_costo,turno,fecha_ingreso')
  ]);
  var res=out[0], permAll=(out[1]&&out[1].data)||[], empAll=(out[2]&&out[2].data)||[];

  if(res.error){ console.error('[SOLIC]',res.error.message||res.error); }
  else { (res.data||[]).forEach(function(s){ todo.push(s); }); }

  // 2) Permisos existentes (tabla simple) — se mapean a COMPLETO.
  //    Se deduplican por codigo+inicio respecto a solicitudes_permiso.
  var vistos={}, duplicados=0;
  todo.forEach(function(s){ if(s.codigo&&s.inicio){ vistos[String(s.codigo).toLowerCase()+'|'+String(s.inicio).slice(0,10)]=1; } });
  permAll.forEach(function(p){
    var clave=String(p.codigo||'').toLowerCase()+'|'+String(p.fecha||'').slice(0,10);
    if(vistos[clave]){ duplicados++; return; }
    vistos[clave]=1;
    todo.push({
      id:'perm_'+p.id, origen:'permisos',
      tipo:'COMPLETO', estado:'APROBADO',
      codigo:p.codigo, nombre:p.nombre,
      centro_costo:null, turno:null,
      tipo_permiso:_mapTipoPermisoTexto(p.tipo),
      inicio:p.fecha, termino:p.fecha, dias_habiles:null,
      tipo_regreso:null, hora_salida:null, hora_ingreso:null, horas_permiso:null,
      // Responsable: en la planilla de Google está en la columna AUTORIZA (E).
      // Antes se descartaba aquí, por eso el gráfico salía 100% "Sin responsable".
      autorizador:(p.autorizador||p.autoriza||null), autorizador_sub:(p.autorizador_sub||null),
      archivo:null, comentario:null,
      created_at:p.updated_at||p.fecha
    });
  });
  if(duplicados) console.log('[SOLIC] '+duplicados+' permisos ya estaban en solicitudes_permiso (omitidos)');

  // 3) Vacaciones: ya no se leen de la tabla `vacaciones` (formulario Google).
  //    Se trabaja de forma autónoma con las solicitudes propias de la app
  //    (incluye las migradas/importadas en `solicitudes_permiso`).

  // 4) Completar centro de costo y turno desde empleados (TODOS, incluidos inactivos)
  var empMap={};
  _EMP.forEach(function(e){ if(e.c) empMap[String(e.c).trim().toUpperCase()]={cc:e.cc, turno:e.turno, ing:e.ing||null, n:e.n||null}; });
  empAll.forEach(function(e){ if(e.codigo){ var k=String(e.codigo).trim().toUpperCase(); if(!empMap[k]) empMap[k]={cc:e.centro_costo, turno:e.turno, ing:e.fecha_ingreso||null, n:e.nombre||null}; else if(!empMap[k].n) empMap[k].n=e.nombre||null; } });
  todo.forEach(function(s){
    var k=String(s.codigo||'').trim().toUpperCase();
    if(k && empMap[k]){
      if(!s.centro_costo) s.centro_costo=empMap[k].cc||null;
      if(!s.turno) s.turno=empMap[k].turno||null;
      if(!s.fecha_ingreso) s.fecha_ingreso=empMap[k].ing||null;
      if(!s.nombre) s.nombre=empMap[k].n||null;
    }
    // Si una vacación no trae días, calcularlos por rango (L-V, sin feriados)
    if(s.tipo==='VACACIONES' && !parseInt(s.dias_habiles,10) && s.inicio && s.termino){
      var cd=contarHabiles(s.inicio, s.termino);
      if(cd!=null && cd>0) s.dias_habiles=cd;
    }
  });

  _SOLIC=todo;
  _solError=null;
}

  var total=0, personal=0;
  _SOLIC.forEach(function(s){
    if(!s || !s.inicio) return;
    var key=String(s.inicio).slice(0,10);
    if(key===fecha && s.tipo!=='VACACIONES' && (s.estado==='PENDIENTE'||s.estado==='APROBADO')){

function docDB(){
  if(_DOCDB_P) return _DOCDB_P;
  _DOCDB_P = new Promise(function(res,rej){
    try{
      if(typeof indexedDB==='undefined'){ rej(new Error('IndexedDB no disponible')); return; }
      var rq=indexedDB.open('permisos_docs',1);
      rq.onupgradeneeded=function(e){
        var db=e.target.result;
        if(!db.objectStoreNames.contains('docs'))   db.createObjectStore('docs',{keyPath:'id'});
        if(!db.objectStoreNames.contains('config')) db.createObjectStore('config',{keyPath:'k'});
      };
      rq.onsuccess=function(e){ res(e.target.result); };
      rq.onerror=function(e){ rej(e.target.error||new Error('IndexedDB')); };
    }catch(e){ rej(e); }
  });
  return _DOCDB_P;
}
function _idbReq(store, mode, fn){
  return docDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(store,mode), st=tx.objectStore(store);
      var rq=fn(st);
      tx.oncomplete=function(){ res(rq?rq.result:undefined); };
      tx.onerror=function(e){ rej(e.target.error||new Error('IndexedDB')); };
      tx.onabort=function(e){ rej(e.target.error||new Error('IndexedDB')); };
    });
  });
}
function docGuardar(id,blob,nombre,meta){ return _idbReq('docs','readwrite',function(st){ return st.put({id:id,blob:blob,nombre:nombre,meta:meta||{},ts:Date.now()}); }); }
function docObtener(id){ return _idbReq('docs','readonly',function(st){ return st.get(id); }); }
function docListarIds(){ return _idbReq('docs','readonly',function(st){ return st.getAllKeys(); }); }
function docEliminar(id){ return _idbReq('docs','readwrite',function(st){ return st.delete(id); }); }
function docConfigSet(k,v){ return _idbReq('config','readwrite',function(st){ return st.put({k:k,v:v}); }); }
function docConfigGet(k){ return _idbReq('config','readonly',function(st){ return st.get(k); }).then(function(r){ return r?r.v:null; }); }

function _docNombre(cod,nombre,orig){
  var base=(String(cod||'').trim()+' '+String(nombre||'').trim()).trim();
  var ext=''; var m=String(orig||'').match(/\.[A-Za-z0-9]{1,8}$/); if(m) ext=m[0];
  base=base.replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim();
  return (base||'documento')+ext;
}
function _uuid(){
  try{ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){ var r=Math.random()*16|0, v=c==='x'?r:((r&0x3)|0x8); return v.toString(16); });
}
async function _permDir(h){
  try{
    if(!h.queryPermission) return true;
    var p=await h.queryPermission({mode:'readwrite'});
    if(p==='granted') return true;
    p=await h.requestPermission({mode:'readwrite'});

  }catch(e){ return false; }
}
async function _queryPerm(h){

function togglePick(key){
  if(_pickerType===key){ closePick(); return; }

function closePick(){ _pickerType=null; document.querySelectorAll('.pick-pop').forEach(function(p){p.classList.add('hidden');}); }

// Unidad (4 dígitos) permitida para vacaciones desde unidades excluidas
var _UNID_VAC = ['1110','1111','1112','1113','1114'];
function _unidadVac(cc){
  var m=String(cc||'').match(/(\d{4})/);
  return !!m && _UNID_VAC.indexOf(m[1])>=0;
}
// Lista de empleados para el selector:
//  - Vacaciones (tab 2): contrato INDEFINIDO de empleados, MÁS los de
//    unidades excluidas (1110-1114) también INDEFINIDO.
function _empListaPicker(){
  if(_tab===2){
    var base=_EMP.filter(function(e){ return String(e.tipo||'').toUpperCase().indexOf('INDEFINID')>=0; });
    var vistos={}; base.forEach(function(e){ vistos[String(e.c).toUpperCase()]=true; });
    (_EMP_EXCL||[]).forEach(function(e){
      var k=String(e.c).toUpperCase();
      if(vistos[k]) return;
      if(String(e.tipo||'').toUpperCase().indexOf('INDEFINID')<0) return;
      if(!_unidadVac(e.cc)) return;
      vistos[k]=true; base.push(e);
    });
    return base;
  }
  return _EMP;
}
function pickerContent(key){
  var src = key==='emp' ? _empListaPicker().map(function(e){return {code:e.c,name:e.n,sub:e.cc+' · '+e.tipo,raw:e};})
    : key==='aut' ? _AUT.map(function(a){return {code:a.c,name:a.n,sub:a.sub,raw:a};})
    : _CC.map(function(c){return {code:c.c,name:c.n,sub:'Centro de costo',raw:c};});
  var ph=key==='emp'?'Buscar empleado...':key==='aut'?'Buscar autorizador...':'Buscar centro de costo...';
  var items=src.map(function(it,i){
    return '<button class="pick-it" onclick="pickChoose(\''+key+'\','+i+')">'+
      '<span class="code">'+esc(it.code)+'</span>'+
      '<span class="t"><span class="a">'+esc(it.name)+'</span><span class="b">'+esc(it.sub)+'</span></span></button>';
  }).join('');
  return '<div class="pick-search"><span style="color:var(--hint);font-size:13px">⌕</span>'+
    '<input placeholder="'+ph+'" oninput="filterPick(this.value)"></div>'+
    '<div class="pick-list" id="pickList">'+items+'</div>'+
    '<div class="pick-foot">'+src.length+' resultados</div>';
}
var _pickSrc=[];
function filterPick(q){
  var key=_pickerType; q=(q||'').toLowerCase();
  var src = key==='emp' ? _empListaPicker() : key==='aut' ? _AUT : _CC;
  var out=src.filter(function(it){ return (it.c+' '+it.n+' '+(it.cc||it.sub||'')).toLowerCase().indexOf(q)>=0; });
  _pickSrc=out;
  document.getElementById('pickList').innerHTML=out.map(function(it,i){
    return '<button class="pick-it" onclick="pickChooseKey('+i+')">'+
      '<span class="code">'+esc(it.c)+'</span>'+
      '<span class="t"><span class="a">'+esc(it.n)+'</span><span class="b">'+esc(it.cc||it.sub||'')+'</span></span></button>';
  }).join('');
}
function pickChoose(key,i){
  var src=key==='emp'?_empListaPicker():key==='aut'?_AUT:_CC;
  if(_pickerType!==key) return;
  pickChooseFrom(src,i);
}
function pickChooseKey(i){ var src=_pickSrc; pickChooseFrom(src,i); }
function pickChooseFrom(src,i){
  var it=src[i]; if(!it) return;
  if(_pickerType==='emp'){
    _form.emp={c:it.c,n:it.n,tipo:it.tipo||'INDEFINIDO',ing:it.ing||null,baseOverride:(it.baseOverride!=null?it.baseOverride:null),progOverride:(it.progOverride!=null?it.progOverride:null),sindOverride:(it.sindOverride!=null?it.sindOverride:null)};
    if(_tab===2){ _form.tipoDias='BASE'; _form.tomarBase=0; _form.tomarProg=0; _form.tomarSind=0; _form.dias=0; }
    // Centro de costo automático desde el empleado
    var cc=null;
    if(it.cc){
      cc=_CC.find(function(c){ return String(it.cc).indexOf(c.c)===0; }) || {c:String(it.cc).slice(0,4), n:String(it.cc)};
    }
    _form.cc=cc;
  } else if(_pickerType==='aut') _form.aut={c:it.c,n:it.n,sub:it.sub,id:it.id};
  else _form.cc={c:it.c,n:it.n};
  closePick(); render();
}

// ── CALENDARIO ──────────────────────────────────────────────
var _cal={y:new Date().getFullYear(),m:new Date().getMonth()};
function renderCalendar(){
  var t=_tab,f=_form;
  var first=new Date(_cal.y,_cal.m,1), start=(first.getDay()+6)%7, total=new Date(_cal.y,_cal.m+1,0).getDate();
  var cells=[];
  for(var i=0;i<start;i++) cells.push('<button class="d empty"></button>');
  var endIso = t===2 ? _finVacaciones(f) : null;
  // Mapa día -> bolsa (base/prog/sind) para colorear el rango de vacaciones
  var bucketMap={};
  var bBase=f.tomarBase||0, bProg=f.tomarProg||0, bSind=f.tomarSind||0, bTot=bBase+bProg+bSind;
  if(t===2 && f.start && bTot>0){
    var cur=new Date(f.start+'T12:00:00'), idx=0, guard=0;
    while(idx<bTot && guard<800){
      var ww=cur.getDay(), ds=iso(cur), fer=!!FERIADOS[ds];
      var esSind = idx >= (bBase+bProg);
      // sindicales cuentan sábados; legal/progresivo solo L-V. Feriados no cuentan.
      var cuenta = !fer && (esSind ? (ww!==0) : (ww!==0 && ww!==6));
      if(cuenta){ bucketMap[ds]= esSind?'sind':(idx<bBase?'base':'prog'); idx++; }
      cur.setDate(cur.getDate()+1); guard++;
    }
  }
  for(var d=1;d<=total;d++){
    var dt=new Date(_cal.y,_cal.m,d), s=iso(dt), w=dt.getDay();
    var hol=!!FERIADOS[s], sun=w===0, we=w===0||w===6;
    var sel = t===2 ? f.start===s : f.dates.indexOf(s)>=0;

  var monthHol=FER.filter(function(k){ return +k.slice(0,4)===_cal.y && +k.slice(5,7)===_cal.m+1; });
  var holBox='';

        return '<div style="display:flex;align-items:center;gap:10px;margin-top:8px"><span style="width:28px;height:28px;flex-shrink:0;border-radius:9px;background:var(--red-soft);color:#B84842;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">'+k.slice(8,10)+'</span>'+

      }).join('')+'</div>';
  }
  return '<div class="cal-head"><div><div class="card-h" style="margin:0">'+calLabel()+'</div>'+
    '<div class="t">'+MONTHS[_cal.m]+' '+_cal.y+'</div></div>'+

    '<div class="cal">'+cells.join('')+'</div>'+legend+holBox;
}

function calNav(dir){
