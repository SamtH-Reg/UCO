<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sistema de Permisos · Friosur</title>
<meta name="theme-color" content="#5B54D6">
<meta name="description" content="Sistema de Solicitudes de Permiso - Pesquera Friosur SpA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="./icon-192-gray.png">
<link rel="apple-touch-icon" href="./icon-512-gray.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ══ VARIABLES ══ */
:root, [data-theme="claro"]{
  --bg:#F6F6F4; --surface:#ffffff; --surface2:#FAFAF8; --surface3:#F1F1ED;
  --border:#E6E6E1; --border2:#DEDED8;
  --text:#17171A; --muted:#6B6B73; --hint:#9A9AA2; --faint:#C2C2C8;
  --accent:#5B54D6; --accent2:#4740C4; --accent-soft:rgba(91,84,214,.09);
  --green:#1C8A5B; --green-soft:rgba(28,138,91,.09);
  --oj:#B0711C; --oj-soft:rgba(176,113,28,.1);
  --red:#D8615E; --red-soft:rgba(216,97,94,.11);
  --shadow:0 8px 30px rgba(23,23,26,.08);
  --acc:var(--accent); --acc-soft:var(--accent-soft); --acc-bd:#C9C6F4;
}
/* Color activo según formulario (tab) */
[data-formtab="1"]{ --acc:#1C8A5B; --acc-soft:var(--green-soft); --acc-bd:#B4DEC9; }
[data-formtab="2"]{ --acc:#B0711C; --acc-soft:var(--oj-soft); --acc-bd:#EBD2AE; }
[data-theme="oscuro"]{
  --bg:#131316; --surface:#1e2228; --surface2:#252b33; --surface3:#2d3440;
  --border:#363d48; --border2:#444d5a; --text:#e2e8f0; --muted:#8896a8; --hint:#7a8898; --faint:#55606e;
  --shadow:0 8px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{
  font-family:'Calibri','Barlow',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;transition:background .3s,color .3s;
}
.hidden{display:none!important}

/* ══ LOGIN ══ */
#loginScreen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:40px 36px 32px;width:100%;max-width:380px;box-shadow:var(--shadow)}
.login-logo{text-align:center;margin-bottom:26px}
.login-logo .licon{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin:0 auto 12px}
.login-logo h2{font-size:20px;font-weight:800;letter-spacing:-.5px}
.login-logo p{font-size:12.5px;color:var(--muted);margin-top:4px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-bottom:6px}
.login-field input{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);font-size:14px;color:var(--text);outline:none;transition:border .15s}
.login-field input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;margin-top:4px}
.login-btn:hover{opacity:.9}
.login-btn:disabled{opacity:.5;cursor:default}
.login-error{color:var(--red);font-size:12px;margin-top:10px;text-align:center;min-height:18px}

/* ══ LAYOUT ══ */
.app{display:flex;min-height:100vh}
.sidebar{width:238px;flex-shrink:0;background:#17171A;color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 14px;overflow-y:auto}
.sb-brand{display:flex;align-items:center;gap:11px;padding:0 8px 20px}
.sb-brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;letter-spacing:-.4px}
.sb-brand .t{font-size:13.5px;font-weight:600;letter-spacing:-.2px}
.sb-brand .s{font-size:11px;color:#75757F;margin-top:1px}
.sb-lab{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#5B5B65;padding:16px 10px 7px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:none;border-radius:9px;background:transparent;color:#C6C6CE;font-size:13px;font-weight:500;text-align:left;cursor:pointer;transition:background .16s,color .16s;width:100%;font-family:inherit}
.sb-item:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-item.active{background:rgba(91,84,214,.2);color:#fff}
.sb-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-item .bar{width:14px;height:2px;border-radius:2px;flex-shrink:0}
.sb-foot{border-top:1px solid rgba(255,255,255,.08);padding-top:14px;margin-top:auto;display:flex;align-items:center;gap:10px}
.sb-avatar{width:30px;height:30px;border-radius:50%;background:#26262B;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:#B9B9C2}
.sb-user{flex:1;min-width:0}
.sb-user .n{font-size:12px;font-weight:500;color:#E4E4EA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .r{font-size:10.5px;color:#6C6C76}
.sb-logout{border:none;background:none;color:#6C6C76;cursor:pointer;font-size:15px;padding:4px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,246,244,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:22px 40px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;transition:background .3s}
[data-theme="oscuro"] .topbar{background:rgba(19,19,22,.86)}
.topbar .kicker{font-size:11px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--accent)}
.topbar h1{font-size:23px;font-weight:700;letter-spacing:-.6px;margin-top:3px}
.topbar-actions{display:flex;gap:10px;align-items:center}

.content{flex:1;padding:26px 40px 56px}
.content-box{max-width:1080px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ══ BOTONES ══ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s,opacity .15s}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-dark{background:#17171A;color:#fff}
.btn-dark:hover{background:#2C2C33}
.btn-ghost{background:var(--surface);border:1px solid var(--border2);color:var(--muted)}
.btn-ghost:hover{background:var(--surface3)}
.btn-ghost.btn-active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn-oj{background:var(--oj);color:#fff}
.btn-oj:hover{background:#966014}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}

/* ══ CARD ══ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;transition:background .3s}
.card + .card{margin-top:14px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--hint)}
.tag{font-size:9.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:20px}
.tag-ok{background:var(--acc-soft);color:var(--acc)}
.tag-warn{background:var(--oj-soft);color:#9A6516}
.tag-red{background:var(--red-soft);color:#B84842}

/* ══ KPIs ══ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;transition:background .3s}
.kpi .l{font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--hint)}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-1px;margin-top:10px;font-variant-numeric:tabular-nums}

/* ══ FORM / CABECERAS ══ */
.section-title{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--hint);margin:38px 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field-lbl{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--hint);margin-bottom:7px}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;background:var(--surface2);
  font-size:13.5px;color:var(--text);outline:none;font-family:inherit;transition:border-color .15s,background .15s;
}
:focus{border-color:var(--accent);background:var(--surface)}
select{cursor:pointer}
textarea{resize:vertical}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px 8px;border:1px solid var(--border2);border-radius:11px;background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit}
.seg button.on{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.seg button.on.verde{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.seg button.on.oj{background:var(--oj-soft);color:var(--oj);border-color:var(--oj)}
.seg button.on.rojo{background:var(--red-soft);color:var(--red);border-color:var(--red)}

/* ══ PICKER (input con dropdown) ══ */
.pick{position:relative}
.pick-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface2);cursor:pointer;transition:border-color .15s;font-family:inherit}
.pick-btn:focus{border-color:var(--accent)}
.pick-btn .tick{width:20px;height:20px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.pick-btn .tick.on{background:var(--acc);border-color:var(--acc)}
.pick-btn .t{flex:1;min-width:0}
.pick-btn .t .a{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-btn .t .b{display:block;font-size:11.5px;color:var(--hint);margin-top:2px}
.pick-btn .chev{color:var(--hint);font-size:11px}
.pick-pop{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.pick-search{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.pick-search input{flex:1;border:none;outline:none;background:none;font-size:14px;color:var(--text);padding:0}
.pick-list{max-height:300px;overflow-y:auto}
.pick-it{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 16px;border:none;border-bottom:1px solid var(--border);background:var(--surface);cursor:pointer;transition:background .12s;font-family:inherit}
.pick-it:hover{background:var(--surface2)}
.pick-it .code{width:34px;height:34px;flex-shrink:0;border-radius:10px;background:var(--surface3);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700}
.pick-it .t{flex:1;min-width:0}
.pick-it .t .a{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-it .t .b{display:block;font-size:11.5px;color:var(--hint);margin-top:2px}
.pick-foot{padding:11px 16px;background:var(--surface2);border-top:1px solid var(--border);font-size:11.5px;color:var(--hint)}
.okbak{background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;margin-top:14px;font-size:12.5px}
.okbak b{font-size:15px}
.notice{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:11px;background:var(--oj-soft);font-size:11.5px;color:#8A5A16;margin-top:10px}

/* ══ CALENDARIO ══ */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head .t{font-size:14.5px;font-weight:600;letter-spacing:-.2px}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:30px;height:30px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--muted);cursor:pointer;font-size:13px}
.cal-nav button:hover{background:var(--surface3)}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-dow div{text-align:center;font-size:10.5px;font-weight:600;color:var(--hint);letter-spacing:.5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{aspect-ratio:1;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:12.5px;font-weight:500;cursor:pointer;font-variant-numeric:tabular-nums;position:relative;display:flex;align-items:center;justify-content:center;transition:background .13s,border-color .13s;padding:0;font-family:inherit}
.cal .d.empty{border-color:transparent;background:transparent;cursor:default}
.cal .d .dotnum{position:absolute;bottom:4px;font-size:7.5px;font-weight:700}
.cal .d.sun{background:var(--red-soft);color:#C4544F;border-color:#F5E3E2}
.cal .d.hol{background:var(--red-soft);color:#B84842;border-color:#EFCFCD;font-weight:600}
.cal .d.full{background:var(--oj-soft);color:#9A6516;border-color:var(--border)}
.cal .d.range{background:var(--accent-soft);color:var(--accent);border-color:var(--border)}
.cal .d.sel{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.cal .d.sel.verde{background:var(--green);border-color:var(--green)}
.cal .d.sel.oj{background:var(--oj);border-color:var(--oj)}
.cal .d.today{box-shadow:0 0 0 2px #17171A}
.cal .d.blocked{cursor:not-allowed}
.cal-legend{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:11.5px;color:var(--hint)}
.cal-legend span{display:flex;align-items:center;gap:6px}
.cal-legend .sw{width:9px;height:9px;border-radius:3px;border:1px solid transparent}

/* ══ TABLA REGISTROS ══ */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-top:20px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{text-align:left;padding:13px 18px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:10.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--hint);white-space:nowrap}
.tbl tbody td{padding:14px 18px;border-bottom:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tbody tr:hover td{background:var(--surface2)}
.tbl tbody tr.fecha-head td{background:var(--surface2);font-weight:700;font-size:12.5px;color:var(--text);border-top:2px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;padding:6px 18px}
.tbl tbody tr.fecha-head:hover td{background:var(--surface3)}
.tbl tbody tr.mes-total td{background:var(--surface3);font-weight:700;font-size:10.5px;color:var(--muted);border-top:1px solid var(--border);cursor:pointer;padding:3px 18px;line-height:1.15}
.tbl tbody tr.mes-total:hover td{background:var(--surface3);color:var(--text)}
.tbl tbody tr.semana-total td{background:rgba(91,84,214,.06);font-weight:600;font-size:10.5px;color:var(--accent);border-top:1px solid var(--border);padding:3px 18px;line-height:1.15}
.tbl tbody tr.semana-total:hover td{background:rgba(91,84,214,.12)}
.tbl tbody tr.fecha-total td{background:rgba(150,150,160,.07);font-weight:700;font-size:10.5px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:3px 18px;line-height:1.15;color:var(--muted)}
.tbl tbody tr.fecha-total:hover td{background:rgba(150,150,160,.12)}
.tbl .badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:600}
.tbl .badge.gray{background:var(--surface3);color:var(--muted)}
.tbl .badge.purp{background:var(--accent-soft);color:var(--accent)}
.tbl .badge.green{background:var(--green-soft);color:var(--green)}
.tbl .badge.oj{background:var(--oj-soft);color:var(--oj)}
.tbl-foot{padding:14px 18px;background:var(--surface2);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--hint)}
.searchbar{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--border);border-radius:11px;background:var(--surface);min-width:260px}
.searchbar input{flex:1;border:none;outline:none;background:none;font-size:13px;color:var(--text);padding:0;width:auto}
.searchbar .i{color:var(--faint);font-size:12px}
.f-date{padding:8px 10px;border:1px solid var(--border);border-radius:11px;background:var(--surface2);font-size:12px;color:var(--text);width:auto!important}

/* ══ TOAST ══ */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);z-index:9999;background:#17171A;color:#fff;padding:13px 22px;border-radius:13px;font-size:13.5px;font-weight:500;box-shadow:0 14px 40px rgba(23,23,26,.3);transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{background:var(--green)}
#toast.error{background:var(--red)}

@media(max-width:820px){
  .sidebar{width:70px;padding:18px 8px}
  .sb-brand .t,.sb-brand .s,.sb-item span,.sb-lab,.sb-user,.sb-logout span{display:none}
  .sb-item{justify-content:center;padding:11px}
  .topbar,.content{padding-left:20px;padding-right:20px}
  .grid2{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr}
}
@media(max-width:500px){
  .kpi-grid{grid-template-columns:1fr}
}
</style>
</head>
<body data-theme="claro">

<!-- ══ LOGIN ══ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="licon">SP</div>
      <h2>Sistema de Permisos</h2>
      <p>Pesquera Friosur SpA · Gestión de personal</p>
    </div>
    <div class="login-field"><label>Email</label><input type="email" id="li-email" autocomplete="email"></div>
    <div class="login-field"><label>Contraseña</label><input type="password" id="li-pass" autocomplete="current-password"></div>
    <button class="login-btn" id="li-btn" onclick="loginIndex()">Ingresar</button>
    <div class="login-error" id="li-error"></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="logo">SP</div>
      <div>
        <div class="t">Sistema de Permisos</div>
        <div class="s">Gestión de personal</div>
      </div>
    </div>

    <div class="sb-lab">Panel</div>
    <button class="sb-item active" onclick="go('home')" id="sb-home"><span class="dot" style="background:currentColor;opacity:.7"></span><span>Panel</span></button>

    <div class="sb-lab">Solicitudes</div>
    <button class="sb-item" onclick="setTab(0)" id="sb-f0"><span class="dot" style="background:#8B85F0"></span><span>Día completo</span></button>
    <button class="sb-item" onclick="setTab(1)" id="sb-f1"><span class="dot" style="background:#3FB37D"></span><span>Media jornada</span></button>
    <button class="sb-item" onclick="setTab(2)" id="sb-f2"><span class="dot" style="background:#D69A45"></span><span>Vacaciones</span></button>

// Cálculo de término de vacaciones: cuenta días hábiles (L-V, sin feriados)
function vacEnd(startIso,dias){
  if(!startIso||dias<1) return null;
  var d=new Date(startIso+'T12:00:00'), count=0, last=null;
  while(count<dias){
    var w=d.getDay();
    if(w!==0&&w!==6&&FER.indexOf(iso(d))<0){ count++; last=iso(d); }
    if(count<dias) d.setDate(d.getDate()+1);
  }
  return last;
}

function rolSub(rol){ return {admin:'Administrador',supervisor:'Supervisor',operario:'Operario'}[rol]||rol; }

// Cuenta días hábiles (L-V, sin feriados chilenos) entre dos fechas YYYY-MM-DD
function contarHabiles(inicio, fin){
  if(!inicio||!fin) return null;
  var d=new Date(inicio+'T12:00:00'), f=new Date(fin+'T12:00:00');
  if(d>f) return 0;
  var n=0;
  while(d<=f){
    var w=d.getDay(), s=iso(d);
    if(w!==0&&w!==6&&FER.indexOf(s)<0) n++;
    d.setDate(d.getDate()+1);
  }
  return n;
}

// Mapea el texto "Permiso Médico" a MEDICO, "Permiso Personal" a PERSONAL, etc.
function _mapTipoPermisoTexto(t){
  var s=String(t||'').toLowerCase();
  if(s.indexOf('medico')>=0||s.indexOf('m\u00e9dico')>=0) return 'MEDICO';
  if(s.indexOf('judicial')>=0) return 'JUDICIAL';
  if(s.indexOf('personal')>=0) return 'PERSONAL';
  return 'PERSONAL';
}

async function cargarSolicitudes(){
  var d=await dbReady();
  var todo=[];
  // 1) Solicitudes de la app (tabla rica)
  var res=await d.from('solicitudes_permiso').select('*').order('created_at',{ascending:false}).limit(1000);
  if(res.error){ console.error('[SOLIC]',res.error.message||res.error); }
  else { res.data.forEach(function(s){ todo.push(s); }); }

  // 2) Permisos existentes (tabla simple) — se mapean a COMPLETO.
  //    Se deduplican por codigo+inicio respecto a solicitudes_permiso,
  //    porque la migración anterior ya volcó estos permisos.
  var vistos={}, duplicados=0;
  todo.forEach(function(s){ if(s.codigo&&s.inicio){ vistos[String(s.codigo).toLowerCase()+'|'+String(s.inicio).slice(0,10)]=1; } });
  var permAll=[], permPage=0, permHasMore=true;
  while(permHasMore){
    var ini=permPage*1000;
    var pr=await d.from('permisos').select('*').range(ini,ini+999);
    if(pr.error||!pr.data||pr.data.length===0){ permHasMore=false; break; }
    permAll=permAll.concat(pr.data);
    if(pr.data.length<1000) permHasMore=false; else permPage++;
  }
  permAll.forEach(function(p){
    var clave=String(p.codigo||'').toLowerCase()+'|'+String(p.fecha||'').slice(0,10);
    if(vistos[clave]){ duplicados++; return; }
    vistos[clave]=1;
    todo.push({
      id:'perm_'+p.id, origen:'permisos',
      tipo:'COMPLETO', estado:'APROBADO',
      codigo:p.codigo, nombre:p.nombre,
      centro_costo:null, turno:null,
      tipo_permiso:_mapTipoPermisoTexto(p.tipo),
      inicio:p.fecha, termino:p.fecha, dias_habiles:null,
      tipo_regreso:null, hora_salida:null, hora_ingreso:null, horas_permiso:null,
      autorizador:null, autorizador_sub:null,
      archivo:null, comentario:null,
      created_at:p.updated_at||p.fecha
    });
  });
  if(duplicados) console.log('[SOLIC] '+duplicados+' permisos ya estaban en solicitudes_permiso (omitidos)');

  // 3) Vacaciones (tabla simple) — se mapean a VACACIONES (deduplicadas por codigo+inicio)
  try{
    var vr=await d.from('vacaciones').select('*');
    if(!vr.error&&vr.data&&vr.data.length){
      vr.data.forEach(function(v){
        var clave=String(v.codigo||'').toLowerCase()+'|'+String(v.fecha_inicio||'').slice(0,10);
        if(vistos[clave]) return;
        vistos[clave]=1;
        var vIni=v.fecha_inicio||null, vFin=v.fecha_fin||null, vDias=null;
        // Calcular días hábiles si la tabla no los trae
        if(vIni&&vFin){ try{ vDias=contarHabiles(vIni,vFin); }catch(e){ vDias=null; } }
        todo.push({
          id:'vac_'+v.id, origen:'vacaciones',
          tipo:'VACACIONES', estado:'APROBADO',
          codigo:v.codigo, nombre:v.nombre||null,
          centro_costo:null, turno:null, tipo_permiso:null,
          inicio:vIni, termino:vFin,
          dias_habiles:vDias, tipo_regreso:null, hora_salida:null, hora_ingreso:null, horas_permiso:null,
          autorizador:null, autorizador_sub:null, archivo:null, comentario:null,
          created_at:null
        });
      });
    }
  }catch(e){ /* tabla no existe, ignorar */ }

  _SOLIC=todo;
  _solError=null;
}

// Picker de selección (empleado/autorizador/centro)
function fieldBtn(type,key,ph,obj,sub,prefix,ok){
  var a=obj?obj.n:ph, b=obj?sub:'';

    '<button class="pick-btn" onclick="togglePick(\''+key+'\')"><span class="tick '+(ok?'on':'')+'">'+(ok?'✓':'')+'</span>'+

function togglePick(key){
  if(_pickerType===key){ closePick(); return; }
  _pickerType=key;
  var pop=document.getElementById('pop_'+key); if(!pop) return;
  pop.innerHTML=pickerContent(key); pop.classList.remove('hidden');
}
function closePick(){ _pickerType=null; document.querySelectorAll('.pick-pop').forEach(function(p){p.classList.add('hidden');}); }

function pickerContent(key){
  var src = key==='emp' ? _EMP.map(function(e){return {code:e.c,name:e.n,sub:e.cc+' · '+e.tipo,raw:e};})
    : key==='aut' ? _AUT.map(function(a){return {code:a.c,name:a.n,sub:a.sub,raw:a};})
    : _CC.map(function(c){return {code:c.c,name:c.n,sub:'Centro de costo',raw:c};});
  var ph=key==='emp'?'Buscar empleado...':key==='aut'?'Buscar autorizador...':'Buscar centro de costo...';
  var items=src.map(function(it,i){
    return '<button class="pick-it" onclick="pickChoose(\''+key+'\','+i+')">'+
      '<span class="code">'+esc(it.code)+'</span>'+
      '<span class="t"><span class="a">'+esc(it.name)+'</span><span class="b">'+esc(it.sub)+'</span></span></button>';
  }).join('');
  return '<div class="pick-search"><span style="color:var(--hint);font-size:13px">⌕</span>'+
    '<input placeholder="'+ph+'" oninput="filterPick(this.value)"></div>'+
    '<div class="pick-list" id="pickList">'+items+'</div>'+
    '<div class="pick-foot">'+src.length+' resultados</div>';
}
var _pickSrc=[];
function filterPick(q){
  var key=_pickerType; q=(q||'').toLowerCase();
  var src = key==='emp' ? _EMP : key==='aut' ? _AUT : _CC;
  var out=src.filter(function(it){ return (it.c+' '+it.n+' '+(it.cc||it.sub||'')).toLowerCase().indexOf(q)>=0; });
  _pickSrc=out;
  document.getElementById('pickList').innerHTML=out.map(function(it,i){
    return '<button class="pick-it" onclick="pickChooseKey('+i+')">'+
      '<span class="code">'+esc(it.c)+'</span>'+
      '<span class="t"><span class="a">'+esc(it.n)+'</span><span class="b">'+esc(it.cc||it.sub||'')+'</span></span></button>';
  }).join('');
}
function pickChoose(key,i){
  var src=key==='emp'?_EMP:key==='aut'?_AUT:_CC;
  if(_pickerType!==key) return;
  pickChooseFrom(src,i);
}
function pickChooseKey(i){ var src=_pickSrc; pickChooseFrom(src,i); }
function pickChooseFrom(src,i){
  var it=src[i]; if(!it) return;
  if(_pickerType==='emp'){
    _form.emp={c:it.c,n:it.n,tipo:it.tipo||'INDEFINIDO'};
    var cc=_CC.find(function(c){ return it.cc&&String(it.cc).indexOf(c.c)===0; });
    _form.cc=cc||null;
  } else if(_pickerType==='aut') _form.aut={c:it.c,n:it.n,sub:it.sub,id:it.id};
  else _form.cc={c:it.c,n:it.n};

// ── CALENDARIO ──────────────────────────────────────────────
var _cal={y:new Date().getFullYear(),m:new Date().getMonth()};
function renderCalendar(){
  var t=_tab,f=_form;
  var first=new Date(_cal.y,_cal.m,1), start=(first.getDay()+6)%7, total=new Date(_cal.y,_cal.m+1,0).getDate();
  var cells=[];
  for(var i=0;i<start;i++) cells.push('<button class="d empty"></button>');
  var endIso = t===2 ? vacEnd(f.start,f.dias) : null;
  for(var d=1;d<=total;d++){
    var dt=new Date(_cal.y,_cal.m,d), s=iso(dt), w=dt.getDay();
    var hol=!!FERIADOS[s], sun=w===0, we=w===0||w===6;
    var sel = t===2 ? f.start===s : f.dates.indexOf(s)>=0;
    var inRange= t===2 && f.start && endIso && s>f.start && s<=endIso && !hol && !we;
    var blocked = t===2 ? (hol||we) : (hol||sun);
    var cup=cupos(s);
    var full = t===0 && !hol && !sun && cup.total>=CUPO_MAX;
    var cls='d', fg='var(--text)', bg='var(--surface)', bd='var(--border)', weight='500', dot='', dotc='', shadow='';
    if(hol){ cls+=' hol'; fg='#B84842'; bg='var(--red-soft)'; bd='#EFCFCD'; weight='600'; }
    else if(sun){ cls+=' sun'; fg='#C4544F'; bg='var(--red-soft)'; bd='#F5E3E2'; }
    if(full){ cls+=' full'; fg='#9A6516'; bg='var(--oj-soft)'; bd='#EBD2AE'; }
    if(inRange){ cls+=' range'; fg='var(--accent)'; bg='var(--accent-soft)'; bd='#C9C6F4'; }
    if(sel){ cls+=' sel'+(t===1?' verde':t===2?' oj':''); }
    if(sel){ fg='#fff'; bg='var(--accent)'; bd='var(--accent)'; if(t===1){bg='var(--green)';bd='var(--green)';} if(t===2){bg='var(--oj)';bd='var(--oj)';} weight='600'; }
    if(String(s)===hoy()) shadow='today';
    if(blocked&&!sel&&!hol&&!sun){ cls+=' blocked'; bg='transparent'; bd='transparent'; }
    if(t===0&&cup.total>0&&!hol&&!sun){ dot=''+(cup.total>CUPO_MAX?'⬤':'●'); dotc='#D6A045'; }
    var title='';
    if(hol) title=FERIADOS[s]+' · feriado (no seleccionable)';
    else if(sun) title=blocked?'Domingo (no seleccionable)':'Domingo';
    else title=t===0?(String(s)===hoy()?'Hoy · ':'')+cup.total+'/'+CUPO_MAX+' cupos · '+cup.personal+' personales':(String(s)===hoy()?'Hoy':'');
    cells.push('<button class="'+cls+'" title="'+esc(title)+'" onclick="calClick(\''+s+'\')" style="'+
      'background:'+bg+';color:'+fg+';border-color:'+bd+';font-weight:'+weight+';box-shadow:'+(shadow?'0 0 0 2px #17171A':'none')+'">'+d+
      (dot?'<span class="dotnum" style="color:'+dotc+'">'+dot+'</span>':'')+'</button>');
  }
  var legend='<div class="cal-legend">'+
    '<span><span class="sw" style="background:var(--red-soft);border-color:#EFCFCD"></span>Feriado</span>'+
    '<span><span class="sw" style="background:var(--red-soft);border-color:#F5E3E2"></span>Domingo</span>'+
    '<span><span class="sw" style="background:var(--surface);box-shadow:0 0 0 2px #17171A"></span>Hoy</span>'+
    '<span style="margin-left:auto;color:var(--muted);font-weight:500">'+calSelectedNote()+'</span></div>';
  var monthHol=FER.filter(function(k){ return +k.slice(0,4)===_cal.y && +k.slice(5,7)===_cal.m+1; });
  var holBox='';
  if(monthHol.length){
    holBox='<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px">'+
      '<div class="card-h">Feriados del mes</div>'+
      monthHol.map(function(k){ var wd=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][new Date(k+'T12:00:00').getDay()];
        return '<div style="display:flex;align-items:center;gap:10px;margin-top:8px"><span style="width:28px;height:28px;flex-shrink:0;border-radius:9px;background:var(--red-soft);color:#B84842;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">'+k.slice(8,10)+'</span>'+
        '<span style="flex:1;min-width:0"><span style="display:block;font-size:12.5px;font-weight:500">'+FERIADOS[k]+'</span><span style="display:block;font-size:11px;color:var(--hint)">'+wd+'</span></span></div>';
      }).join('')+'</div>';
  }
  return '<div class="cal-head"><div><div class="card-h" style="margin:0">'+calLabel()+'</div>'+
    '<div class="t">'+MONTHS[_cal.m]+' '+_cal.y+'</div></div>'+
    '<div class="cal-nav"><button onclick="calNav(-1)">‹</button>'+
    '<button onclick="calNav(1)">›</button></div></div>'+
    '<div class="cal-dow"><div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div></div>'+
    '<div class="cal">'+cells.join('')+'</div>'+legend+holBox;
}
function calLabel(){ return _tab===2?'Inicio de vacaciones':_tab===1?'Día del permiso':'Días de permiso'; }
function calSelectedNote(){
  var f=_form,t=_tab;
  if(t===2) return f.start?'Inicio '+fmt(f.start):'Selecciona el día 1';
  if(t===1) return f.dates.length?fmt(f.dates[0]):'Selecciona un solo día';
  var n=f.dates.length; return n?(n+(n===1?' día seleccionado':' días seleccionados')):'Selecciona uno o varios días';
}
function calNav(dir){
  if(_cal.m+dir>11){ _cal.y++; _cal.m=0; }
  else if(_cal.m+dir<0){ _cal.y--; _cal.m=11; }
  else _cal.m+=dir;
  render();
}
function calClick(s){
  var f=_form,t=_tab;
  if(t===2){ f.start=s; render(); return; }
  if(t===1){ f.dates=f.dates[0]===s?[]:[s]; render(); return; }
  var i=f.dates.indexOf(s);
  if(i>=0) f.dates.splice(i,1);
  else {
    var cup=cupos(s);
    if(f.tipo==='PERSONAL'&&cup.personal>=CUPO_PERSONAL_MAX&&cup.total<CUPO_MAX){
      if(!confirm('El '+fmt(s)+' ya registra '+cup.personal+' permisos personales (tope diario). ¿Deseas continuar?')) return;
    } else if(cup.total>=CUPO_MAX){
      if(!confirm('El '+fmt(s)+' ya tiene '+cup.total+'/'+CUPO_MAX+' cupos. Si continúas, quedará sobre el cupo máximo y requerirá autorización de jefatura.')) return;
    }
    f.dates.push(s); f.dates.sort();
  }
  render();
}

function calcularHoras(){
  var f=_form; if(!f.hs||!f.hi||f.reg==='SIN') return '—';
  var a=f.hs.split(':'), b=f.hi.split(':');
  var mins=(+b[0]*60 + +b[1])-(+a[0]*60 + +a[1]); if(mins<0) mins+=1440;
  return (mins/60).toFixed(1).replace('.',',')+' h';
}
// Calcula las HORAS DE PERMISO de un registro de media jornada según turno y regreso
// Día: empezar 08:00 terminar 17:00 · Tarde: 14:00-22:00 · Noche: 22:00-06:00
var _TURNOS_H={DIA:[8,17],TARDE:[14,22],NOCHE:[22,6]};
function _min(s){ var p=String(s).split(':'); return (+p[0]||0)*60+(+p[1]||0); }
function _hm(mins){ var h=Math.floor(mins/60), m=mins%60; return h+':'+String(m).padStart(2,'0'); }
function calcularHorasPermiso(s){
  if(s.horas_permiso!=null&&s.horas_permiso!=='') return s.horas_permiso;
  var reg=String(s.tipo_regreso||'').toUpperCase();
  var turno=String(s.turno||'DIA').toUpperCase(); var ho=_TURNOS_H[turno]||_TURNOS_H.DIA;
  if(reg==='CON'){ if(s.hora_salida&&s.hora_ingreso){ var d=_min(s.hora_ingreso)-_min(s.hora_salida); if(d<0)d+=1440; return d/60; } return 0; }
  if(reg==='SIN'){ if(s.hora_salida){ var fin=ho[1]*60; var d2=fin-_min(s.hora_salida); if(d2<0)d2+=1440; return d2/60; } return 0; }
  if(reg==='INGRESO'){ if(s.hora_ingreso){ var ini=ho[0]*60; var d3=_min(s.hora_ingreso)-ini; if(d3<0)d3+=1440; return d3/60; } return 0; }
  return 0;
}

async function submitForm(){
  var f=_form,t=_tab, miss=[];

  if(!f.emp)miss.push('empleado');

  if(t===2){ if(!f.start)miss.push('inicio de vacaciones'); if(!f.dias)miss.push('días hábiles'); }
  else if(!f.dates.length)miss.push(t===1?'día del permiso':'días de permiso');

    tipo_regreso:t===1?f.reg:null,
    hora_salida:t===1?f.hs:null,
    hora_ingreso:t===1?((f.reg==='SIN')?null:f.hi):null,

    archivo:f.file||null, comentario:f.com||null,
    creado_por:_sesion?_sesion.id:null, creado_por_email:_sesion?_sesion.email:null
  };
  var d=await dbReady();

// Número de semana ISO (YYYY-Www) de una fecha YYYY-MM-DD
function semNum(dk){
  var d=new Date(dk+'T12:00:00');
  var day=(d.getDay()+6)%7;               // lunes=0
  d.setDate(d.getDate()-day+3);           // jueves de esa semana
  var firstThu=new Date(d.getFullYear(),0,4);
  var fday=(firstThu.getDay()+6)%7;
  firstThu.setDate(firstThu.getDate()-fday+3);
  var week=1+Math.round((d-firstThu)/(7*86400000));
  return d.getFullYear()+'-W'+String(week).padStart(2,'0');
}

// Calcula la fecha de referencia (hoy si hay datos; si no, la próxima; si no, la última)
function _calcularDkRef(){
  var hoyS=hoy();
  var uso={};
  _SOLIC.forEach(function(s){ if(s.inicio){ var st=String(s.inicio).slice(0,10); uso[st]=1; } });
  if(uso[hoyS]) return hoyS;
  var lista=Object.keys(uso).sort();
  var fut=lista.filter(function(d){ return d>=hoyS; });
  return fut.length ? fut[0] : (lista.length ? lista[lista.length-1] : hoyS);
}

    var dt=totales(g.items);
    var isRef=g.k===dkRef;
    var gStyle=isRef?'background:rgba(0,152,212,.12)':'';
    var refTag = g.k===hoyS ? ' <span style="color:var(--accent)">· HOY</span>' : (isRef? ' <span style="color:var(--accent)">· PRÓXIMA</span>' : '');
    var diaExp = _diaExpand[g.k]===true;

    // Encabezado de la FECHA (botón colapsar) — la fecha se muestra UNA sola vez
    var diaFlecha = diaExp ? '▼' : '▶';
    body+='<tr class="fecha-head" id="fechaRef" style="cursor:pointer;'+gStyle+'" onclick="toggleDia(\''+g.k+'\')">'+
      '<td style="font-weight:700;color:var(--text)"><span style="display:inline-block;width:14px">'+diaFlecha+'</span> '+fechaLbl+refTag+'</td>'+
      '<td style="font-size:10px;color:var(--hint)">'+g.items.length+' registro'+(g.items.length!==1?'s':'')+'</td>'+
      '<td></td><td></td><td></td><td></td></tr>';

    // Filas del día (solo código-nombre, agrupadas) — la fecha NO se repite
    if(diaExp) g.items.slice().sort(function(a,b){
      var na=(a.raw&&a.raw.nombre)||'', nb=(b.raw&&b.raw.nombre)||'';
      return na.localeCompare(nb,'es');
    }).forEach(function(r){
      var s=r.raw;
      var codNom=esc((s.codigo||'')+' '+ (s.nombre||''));
      if(s.centro_costo) codNom+=' <span style="color:var(--hint)">'+esc(s.centro_costo)+'</span>';
      var acc='<td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="editarRegistroPermiso(\''+esc(s.id||'')+'\')" style="padding:3px 7px;font-size:11px">✏️</button> '+
        '<button class="btn btn-ghost btn-sm" onclick="eliminarRegistroPermiso(\''+esc(s.id||'')+'\')" style="padding:3px 7px;font-size:11px;color:var(--danger)">🗑</button></td>';
      body+='<tr style="'+(isRef?gStyle:'')+'">'+
        '<td style="color:var(--hint);font-size:11px"></td>'+
        '<td>'+codNom+'</td>'+
        celTipo(esTipo(s,'PERSONAL'))+
        celTipo(esTipo(s,'MEDICO'))+
        celTipo(esTipo(s,'JUDICIAL'))+
        acc+
        '</tr>';
    });

    // Subtotal del DÍA (Total dd-mm-aaaa) al final del grupo
    body+='<tr class="fecha-total" style="'+gStyle+'">'+
      '<td style="padding-left:26px"><b>Total '+fechaLbl+'</b></td>'+
      '<td style="font-size:10px;color:var(--hint)">'+g.items.length+' registro'+(g.items.length!==1?'s':'')+'</td>'+
      celTipo(dt.p)+celTipo(dt.m)+celTipo(dt.j)+'<td></td></tr>';
  });

  return body||'<tr><td colspan="6" style="text-align:center;color:var(--hint);padding:40px">Sin registros aún</td></tr>';
}

// Vista DÍA COMPLETO (formato original: código nombre + PERSONAL/MÉDICO/JUDICIAL, agrupado por día)

// Hacer scroll al día de referencia (hoy/próxima) al abrir la vista.
// Usa window.scrollTo (scrollea SIEMPRE la página) en lugar de scrollIntoView,
// que puede fallar sobre una fila en un contenedor con overflow. Reintenta
// hasta que el elemento exista (los datos son asíncronos).
var _scrollRefIntentos=0;
function scrollAReferencia(){
  _scrollRefIntentos=0;
  function centrar(){
    var el=document.getElementById('fechaRef');
    if(!el) return false;
    var rect=el.getBoundingClientRect();
    var actual=window.pageYOffset||document.documentElement.scrollTop||document.body.scrollTop||0;
    var altura=window.innerHeight||document.documentElement.clientHeight||800;
    var destino=actual + rect.top - (altura/2) + (rect.height/2||20);
    if(destino<0) destino=0;
    // Usar 'auto' (instantáneo) — más fiable que 'smooth' dentro de tablas con muchos re-renders
    try{ window.scrollTo({top:destino, behavior:'auto'}); }
    catch(e){ window.scrollTo(0,destino); }
    return true;
  }
  function enViewport(el){
    var r=el.getBoundingClientRect();
    var h=window.innerHeight||800;
    // Visible si su centro está dentro de la ventana
    return r.top>=-40 && r.bottom<=h+40;
  }
  function intentar(){
    var el=document.getElementById('fechaRef');
    if(el && enViewport(el)) return;   // ya está centrado, listo
    if(centrar()) return;
    _scrollRefIntentos++;
    if(_scrollRefIntentos<12){ setTimeout(intentar,300); }
  }
  setTimeout(intentar,200);
}
function renderRec(){
  var t=_recIdx;
  var TITLES=['Registros día completo','Registros media jornada','Registros vacaciones'];
  var q=(recQ||'').toLowerCase();
  var hit=function(s){ return (((s.nombre||'')+' '+(s.codigo||'')+' '+(s.centro_costo||'')+' '+(s.autorizador||'')).toLowerCase().indexOf(q)>=0); };
  // Filtro por año / meses (múltiple) / rango de fechas / tipo de permiso
  var fechaOk=function(s){
    var st=String(s.inicio||'').slice(0,10);
    if(!st) return false;
    var a=st.slice(0,4), m=parseInt(st.slice(5,7),10);
    if(_recAnio && a!==_recAnio) return false;
    if(_recMeses.length && _recMeses.indexOf(m)<0) return false;
    if(_recDesde && st<_recDesde) return false;
    if(_recHasta && st>_recHasta) return false;
    if(_recTipo && (s.tipo_permiso||'')!==_recTipo) return false;
    return true;
  };
  var ACC=['#5B54D6','#1C8A5B','#B0711C'];
  var PERIOD=periodoLabel();
  var acc=ACC[t];

  var rows=[]
  if(t===0){
    // ── DÍA COMPLETO: formato original (código nombre + PERSONAL/MÉDICO/JUDICIAL) ──
    return renderDiaCompletoVista();
  } else if(t===1){
    // ── MEDIA JORNADA ──
    return renderPorDia('MEDIA_JORNADA','Registros media jornada','#1C8A5B',1);
  } else {
    _SOLIC.filter(function(s){return s.tipo==='VACACIONES'&&hit(s)&&fechaOk(s);}).forEach(function(s){
      rows.push({fechaRaw:String(s.inicio||'').slice(0,10),cells:[s.estado, s.centro_costo||'—', s.nombre, s.inicio?fmt(String(s.inicio).slice(0,10)):'—',
        s.termino?fmt(String(s.termino).slice(0,10)):'—', s.dias_habiles||'—']});
    });
  }

  // Columnas según tipo (media jornada y vacaciones)
  var cols;
  if(t===1) cols=['Estado','Día permiso','Código · nombre','Tipo','Regreso','Salida','Ingreso','Horas'];
  else cols=['Estado','Centro de costo','Nombre','Inicio','Término','Días hábiles'];

  var header=cols.map(function(c){return '<th>'+c+'</th>';}).join('');
  var hoyS=hoy();
  // Agrupar por mes (clave YYYY-MM) conservando el orden de los datos
  var grupos=[]; var gk={};
  rows.forEach(function(r){
    var fechaRaw=r.fechaRaw||'';
    var k=fechaRaw?fechaRaw.slice(0,7):'__sin__';
    if(!gk[k]){ gk[k]={k:k, items:[]}; grupos.push(gk[k]); }
    gk[k].items.push(r);
  });
  var body=grupos.map(function(g){
    var mesLbl='—';
    if(g.k!=='__sin__'){ var p=g.k.split('-'); mesLbl=MONTHS[+p[1]-1]+' '+p[0]; }
    var rowsHtml=g.items.map(function(r){
      var est=r.cells[0];
      var badgeCol=estBadge(est);
      var esHoy = r.fechaRaw && String(r.fechaRaw).slice(0,10)===hoyS;
      var hoyStyle = esHoy ? 'background:rgba(0,152,212,.12);font-weight:700' : '';
      var hoyBoldCells = esHoy ? r.cells.map(function(c,i){ return i===1 ? '<td style="color:var(--accent);font-weight:800">'+esc(c)+'</td>' : '<td>'+esc(c)+'</td>'; }).join('') : r.cells.slice(1).map(function(c){return '<td>'+esc(c)+'</td>';}).join('');
      return '<tr style="'+hoyStyle+'">'+
        '<td><span class="badge '+badgeCol+'">'+est+'</span></td>'+
        hoyBoldCells+
        '</tr>';
    }).join('');
    return '<tr class="mes-total"><td colspan="'+cols.length+'">▾ <b>'+mesLbl+'</b> · '+g.items.length+' permiso'+(g.items.length!==1?'s':'')+'</td></tr>'+rowsHtml;
  }).join('');

  return '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
    '<h1 style="font-size:23px;font-weight:700;letter-spacing:-.6px">'+TITLES[t]+'</h1>'+
    '<span style="font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;background:var(--accent-soft);color:'+acc+'">'+rows.length+'</span>'+
    '<span style="font-size:12.5px;color:var(--hint)">'+PERIOD+'</span>'+
    '<div style="margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+recFilterBar(t)+
    '</div></div>'+
    '<div class="table-card"><div style="overflow-x:auto"><table class="tbl"><thead><tr>'+header+'</tr></thead>'+
    '<tbody>'+(body||'<tr><td colspan="'+cols.length+'" style="text-align:center;color:var(--hint);padding:40px">Sin registros aún</td></tr>')+'</tbody></table></div>'+
    '<div class="tbl-foot"><span>Mostrando '+rows.length+' registros</span><span>'+recTotal(t)+'</span></div></div>';
}
function regTxt(r){ return {CON:'Con regreso',SIN:'Sin regreso',ING:'Ingreso a planta'}[r]||'—'; }
function estBadge(est){
  return est==='APROBADO'?'green':est==='RECHAZADO'?'oj':est==='ANULADO'?'gray':'purp';
}
function recTotal(t){
  if(t===0) return 'Total: '+_SOLIC.filter(function(s){return s.tipo==='COMPLETO';}).length+' permisos';
  if(t===1){ var h=0; _SOLIC.forEach(function(s){if(s.tipo==='MEDIA_JORNADA')h+=parseFloat(s.horas_permiso||0);}); return 'Total horas: '+(h.toFixed(1).replace('.',','))+' h'; }
  var d=0; _SOLIC.forEach(function(s){if(s.tipo==='VACACIONES')d+=+(s.dias_habiles||0);}); return 'Total días hábiles: '+d;
}
var recQ='';
// Filtros de fecha en registros
var _recAnio = '';      // '' = todos
var _recMeses = [];     // [] = todos, ej [8,9] (agosto, septiembre)
var _recDesde = '';     // YYYY-MM-DD
var _recHasta = '';     // YYYY-MM-DD
function recToggleMes(m){
  var i=_recMeses.indexOf(m);
  if(i>=0) _recMeses.splice(i,1); else _recMeses.push(m);
  _recMeses.sort(function(a,b){return a-b;});
  _recFechaAuto=true;   // autocompletar Desde/Hasta a partir de los meses
  aplicarRangoMeses();
  render();
}
// Autocompletar Desde/Hasta con el rango de los meses seleccionados (si el usuario no eligió manualmente)
var _recFechaAuto=false;
function aplicarRangoMeses(){
  if(!_recFechaAuto) return;
  if(!_recMeses.length){ _recDesde=''; _recHasta=''; return; }
  var anio=parseInt(_recAnio,10)||new Date().getFullYear();
  var primer=_recMeses[0], ultimo=_recMeses[_recMeses.length-1];
  _recDesde=anio+'-'+String(primer).padStart(2,'0')+'-01';
  // último día del mes ultimo
  var dim=new Date(anio,ultimo,0).getDate();
  _recHasta=anio+'-'+String(ultimo).padStart(2,'0')+'-'+String(dim).padStart(2,'0');
}
function recMesesLbl(){
  if(!_recMeses.length) return 'Mes';
  var l=_recMeses.map(function(m){return (MONTHS[m-1]||'').slice(0,3);}).join(', ');
  return l.length>18 ? l.slice(0,16)+'…' : l;
}
function _recFilterAnios(){ // años disponibles para el filtro (2024..3120 desde datos reales)
  var anios={}, hoyA=new Date().getFullYear();
  _SOLIC.forEach(function(s){ if(s.inicio){ var y=String(s.inicio).slice(0,4); if(y) anios[y]=1; } });
  anios[hoyA]=1;
  return Object.keys(anios).sort().reverse();
}
function exportRec(t){
  // Exporta tuplas crudas con XLSX (si está cargado), aplicando los filtros activos
  if(typeof XLSX==='undefined'){ toast('Módulo de exportación no disponible','error'); return; }
  var q=(recQ||'').toLowerCase();
  var hit=function(s){ return (((s.nombre||'')+' '+(s.codigo||'')+' '+(s.centro_costo||'')+' '+(s.autorizador||'')).toLowerCase().indexOf(q)>=0); };
  var fechaOk=function(s){
    var st=String(s.inicio||'').slice(0,10); if(!st) return false;
    var a=st.slice(0,4), m=parseInt(st.slice(5,7),10);
    if(_recAnio && a!==_recAnio) return false;
    if(_recMeses.length && _recMeses.indexOf(m)<0) return false;
    if(_recDesde && st<_recDesde) return false;
    if(_recHasta && st>_recHasta) return false;
    if(_recTipo && (s.tipo_permiso||'')!==_recTipo) return false;
    if(_recTurno && String(s.turno||'').toUpperCase()!==_recTurno) return false;
    return true;
  };
  var fil=function(tipo){ return _SOLIC.filter(function(s){return s.tipo===tipo&&hit(s)&&fechaOk(s);}); };
  var rows=t===0?fil('COMPLETO').map(function(s){return {Estado:s.estado,Fecha:s.inicio,Nombre:s.nombre,Centro:s.centro_costo,Turno:s.turno,Tipo:s.tipo_permiso,Autorizador:s.autorizador};})
    :t===1?fil('MEDIA_JORNADA').map(function(s){return {Estado:s.estado,Dia:s.inicio,Nombre:s.nombre,Tipo:s.tipo_permiso,Regreso:regTxt(s.tipo_regreso),Salida:s.hora_salida,Ingreso:s.hora_ingreso,Horas:s.horas_permiso};})
    :fil('VACACIONES').map(function(s){return {Estado:s.estado,Centro:s.centro_costo,Nombre:s.nombre,Inicio:s.inicio,Termino:s.termino,Dias:s.dias_habiles};});
  if(!rows.length){ toast('⚠️ Sin datos para exportar con los filtros actuales','error'); return; }
  var ws=XLSX.utils.json_to_sheet(rows), wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Permisos');
  XLSX.writeFile(wb,'permisos_'+['completo','media','vacaciones'][t]+'.xlsx');
  toast('✅ '+'Exportado '+rows.length+' registros','success');
}

// ═══════════════════════════════════════════════════════════════
//  EDITAR / ELIMINAR registros (soporta orígenes: solicitudes_permiso, permisos, vacaciones)
// ═══════════════════════════════════════════════════════════════
function _buscarRegistro(id){
  return _SOLIC.find(function(s){ return s.id===id; });
}

function eliminarRegistroPermiso(id){
  var s=_buscarRegistro(id); if(!s){ toast('Registro no encontrado','error'); return; }
  var nombre=(s.codigo||'')+' '+(s.nombre||'');
  if(!confirm('Eliminar el permiso de '+nombre+'?')) return;
  (async function(){
    var d=await dbReady();
    var tabla='solicitudes_permiso', pk_id=id;
    if(String(id).indexOf('perm_')===0){ tabla='permisos'; pk_id=String(id).replace('perm_',''); }
    else if(String(id).indexOf('vac_')===0){ tabla='vacaciones'; pk_id=String(id).replace('vac_',''); }
    var res=await d.from(tabla).delete().eq('id',pk_id);
    if(res.error){ toast('Error al eliminar: '+(res.error.message||res.error),'error'); return; }
    toast('Permiso eliminado correctamente','success');
    _diaExpand={}; await cargarSolicitudes(); render();
  })();
}

function editarRegistroPermiso(id){
  var s=_buscarRegistro(id); if(!s){ toast('Registro no encontrado','error'); return; }
  var nombre=prompt('Nombre:', s.nombre||'');
  if(nombre===null) return;
  var fecha=prompt('Fecha (YYYY-MM-DD):', (s.inicio||'').slice(0,10));
  if(fecha===null) return;
  var tipo=prompt('Tipo (PERSONAL/MEDICO/JUDICIAL):', s.tipo_permiso||'PERSONAL');
  if(tipo===null) return;
  tipo=tipo.toUpperCase();
  (async function(){
    var d=await dbReady();
    var tabla='solicitudes_permiso', pk_id=id;
    if(String(id).indexOf('perm_')===0){ tabla='permisos'; pk_id=String(id).replace('perm_',''); }
    else if(String(id).indexOf('vac_')===0){ tabla='vacaciones'; pk_id=String(id).replace('vac_',''); }
    var upd={nombre:nombre};
    if(tabla==='solicitudes_permiso'){ upd.inicio=fecha; upd.tipo_permiso=tipo; }
    else if(tabla==='permisos'){ upd.fecha=fecha; upd.tipo=_tipoTexto(tipo); }
    else { upd.fecha_inicio=fecha; }
    var res=await d.from(tabla).update(upd).eq('id',pk_id);
    if(res.error){ toast('Error al actualizar: '+(res.error.message||res.error),'error'); return; }
    toast('Registro actualizado correctamente','success');
    _diaExpand={}; await cargarSolicitudes(); render();
  })();
}
function _tipoTexto(t){ return {PERSONAL:'Permiso Personal',MEDICO:'Permiso Medico',JUDICIAL:'Permiso Judicial'}[t]||'Permiso Personal'; }
