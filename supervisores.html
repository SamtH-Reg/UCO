<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permisos por dia · disponibilidad futura</title>
<link rel="preconnect" href="https://qvtztwqbbbzortkodtla.supabase.co">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<style>
  :root{
    --bg:#eceff5; --card:#ffffff; --ink:#0f1e33; --muted:#5d6d84; --line:#e4eaf3; --soft:#f6f9fd;
    --acc:#2f6bd8; --acc2:#1b4bab; --ok:#0f9d63; --okbg:#e6f7ef; --warn:#c27803; --warnbg:#fff5e2; --bad:#d92d20; --badbg:#fdecea;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 420px at 88% -8%, #d9e6fb 0%, rgba(217,230,251,0) 62%),
      radial-gradient(700px 380px at 4% 0%, #e8eefb 0%, rgba(232,238,251,0) 60%),
      var(--bg);
    color:var(--ink);
    font:15px/1.5 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:30px 20px 80px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  h1{margin:0;font-size:clamp(23px,3vw,33px);font-weight:800;letter-spacing:-.03em}
  .sub{margin:8px 0 0;color:var(--muted);font-size:13.5px;max-width:610px}
  .stamp{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:0 1px 3px rgba(15,30,51,.06);white-space:nowrap}
  .stamp b{color:var(--ink)}
  .turno{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:18px;box-shadow:0 14px 34px -26px rgba(15,30,51,.55)}
  .turno>h2{margin:0;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:linear-gradient(90deg,#f8fbff,#eff5ff);border-bottom:1px solid var(--line);font-size:14.5px;font-weight:800}
  .turno>h2 .t{display:flex;align-items:center;gap:10px}
  .dot{width:10px;height:10px;border-radius:999px;background:var(--acc);box-shadow:0 0 0 4px rgba(47,107,216,.14)}
  .turno>h2 .tot{font-size:12.5px;font-weight:800;color:var(--acc2);background:#e8f0ff;border-radius:999px;padding:5px 12px}
  .dia{display:flex;align-items:flex-start;gap:16px;padding:14px 20px;border-top:1px solid var(--soft);flex-wrap:wrap}
  .dia:first-of-type{border-top:0}
  .dia:hover{background:#fbfdff}
  .dia.hoy{background:linear-gradient(90deg,#f2f8ff,#fdfeff)}
  .col1{min-width:205px;flex:0 0 auto}
  .f{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .dow{font-size:12.5px;color:var(--muted);text-transform:capitalize}
  .hoychip{display:inline-block;margin-left:8px;font-size:10px;font-weight:900;letter-spacing:.1em;color:#fff;background:var(--acc);border-radius:999px;padding:3px 8px;vertical-align:2px}
  .col3{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;gap:9px}
  .est{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:13.5px;border-radius:999px;padding:9px 16px;white-space:nowrap}
  .est .d{width:9px;height:9px;border-radius:999px;background:currentColor;box-shadow:0 0 0 4px rgba(0,0,0,.05)}
  .est.ok{background:var(--okbg);color:var(--ok)}
  .est.mid{background:var(--warnbg);color:var(--warn)}
  .est.no{background:var(--badbg);color:var(--bad)}
  .numb{min-width:34px;text-align:center;font-weight:900;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:6px 9px}
  .vacio{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:34px 24px;text-align:center;color:var(--muted)}
  .vacio b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px}
  .err{margin-bottom:16px;padding:14px 16px;background:var(--badbg);border:1px solid #f6cdc8;border-radius:14px;color:#8f1d14;font-weight:600;font-size:13.5px}
  .pie{margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:linear-gradient(120deg,#16305c,#21508f);color:#fff;border-radius:18px;padding:17px 22px;box-shadow:0 16px 34px -24px #16305c}
  .pie .l{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.88;font-weight:800}
  .pie .n{font-size:31px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .leyenda{margin-top:14px;font-size:11.5px;color:var(--muted);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .leyenda span.l{display:inline-flex;align-items:center;gap:6px}
  .leyenda i{width:10px;height:10px;border-radius:999px;display:inline-block}
  .leyenda i.a{background:var(--ok)} .leyenda i.b{background:var(--warn)} .leyenda i.c{background:var(--bad)}
  /* ── Teléfono: es el uso principal (los supervisores lo abren desde el celular) ── */
  @media (max-width:640px){
    .wrap{padding:16px 12px 56px}
    header{margin-bottom:14px;gap:8px}
    h1{font-size:23px}
    .stamp{font-size:11.5px;padding:6px 11px}
    .turno{border-radius:15px;margin-bottom:14px}
    .turno>h2{padding:12px 15px;font-size:14px}
    .turno>h2 .tot{font-size:12px;padding:4px 10px}
    .dia{padding:13px 15px;gap:10px;align-items:center;flex-wrap:nowrap}
    .col1{flex:1 1 auto;min-width:0}               /* fecha + estado en el mismo renglón */
    .f{font-size:16.5px}
    .dow{font-size:12.5px}
    .col3{flex:0 0 auto;margin-left:auto;width:auto}
    .est{font-size:13.5px;padding:9px 14px}
    .numb{min-width:44px;font-size:18px;padding:7px 10px}
    .pie{padding:15px 17px;border-radius:15px}
    .pie .n{font-size:27px}
    .leyenda{font-size:11px;gap:9px}
    .leyenda span.l{gap:5px}
    .vacio{padding:26px 18px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Permisos por día</h1>
    </div>
    <div class="stamp" id="stamp">Cargando…</div>
  </header>
  <div id="aviso"></div>
  <div id="lista"></div>
  <div class="pie" id="pie" style="display:none">
    <div><div class="l">Suma total</div><div class="n" id="kSuma">0</div></div>
    <div class="l" id="pieSub"></div>
  </div>
  <div class="leyenda">
    <span class="l">2 cupos por día:</span>
    <span class="l"><i class="a"></i> Quedan 2 / Queda 1</span>
    <span class="l"><i class="b"></i> Sin cupo (2 permisos)</span>
    <span class="l"><i class="c"></i> Sobre cupo (3 o más)</span>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL      = 'https://qvtztwqbbbzortkodtla.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2dHp0d3FiYmJ6b3J0a29kdGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0NDA4NTMsImV4cCI6MjA4OTAxNjg1M30.zMcRweclE46qwOCTduo7sLfduZxXjKvFLmim7nZyiok';
let SB=null;
function db(){ if(!SB) SB=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); return SB; }
const DIAS=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function hoyISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function set(id,v){ var e=document.getElementById(id); if(e) e.textContent=v; }
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function turnoLbl(t){
  const s=String(t||'').trim().toUpperCase();
  if(!s) return 'Día';            // sin turno informado = jornada diurna (día completo)
  return s.charAt(0)+s.slice(1).toLowerCase();
}
function partes(iso){
  const d=new Date(String(iso).slice(0,10)+'T12:00:00');
  if(isNaN(d)) return {f:iso,dow:''};
  return { f:d.getDate()+' de '+MESES[d.getMonth()], dow:DIAS[d.getDay()] };
}
// CUPO POR DÍA: la regla es de 2 cupos por día. Con 2 el día queda completo y desde 3 es SOBRE CUPO.
const CUPO_POR_DIA = 2;
// El aviso del día dice cuántos cupos QUEDAN. Con 2 permisos no quedan cupos y desde 3 es sobre cupo.
function estadoDia(n){
  const libre = CUPO_POR_DIA - n;
  if(libre < 0) return {t:'Sobre cupo +'+Math.abs(libre), c:'no'};        // 3 o más
  if(libre === 0) return {t:'Sin cupo', c:'mid'};                        // los 2 ya usados
  if(libre === 1) return {t:'Queda 1', c:'ok'};                          // 1 usado
  return {t:'Quedan '+libre, c:'ok'};                                    // sin permisos
}

async function traer(){
  // Primero intenta la vista de solo lectura (permisos_supervisores). Si aún no existe, usa la tabla.
  let r = await db().from('permisos_supervisores').select('codigo,nombre,turno,inicio,tipo_permiso,estado').limit(4000);
  if(r.error) r = await db().from('solicitudes_permiso').select('id,codigo,nombre,turno,inicio,tipo,tipo_permiso,estado').limit(4000);
  if(r.error) throw r.error;
  const data=r.data||[];
  window._leidas=data.length;
  const hoy=hoyISO();
  return data.filter(function(r){
    if(r.tipo && String(r.tipo).toUpperCase()!=='COMPLETO') return false;      // la vista ya viene filtrada
    if(String(r.tipo_permiso||'').toUpperCase()!=='PERSONAL') return false;
    const e=String(r.estado||'').toUpperCase();
    if(e && e!=='APROBADO' && e!=='PENDIENTE') return false;
    const f=String(r.inicio||'').slice(0,10);
    return !!f && f>=hoy;
  });
}
function agrupar(rows){
  const out={};
  rows.forEach(function(r){
    const t=turnoLbl(r.turno), f=String(r.inicio).slice(0,10);
    (out[t]=out[t]||{})[f]=(out[t][f]||[]).concat([r]);
  });
  Object.keys(out).forEach(function(t){ Object.keys(out[t]).forEach(function(f){
    out[t][f].sort(function(a,b){ return String(a.nombre||'').localeCompare(String(b.nombre||''),'es'); });
  }); });
  return out;
}
function pintar(rows){
  const lista=document.getElementById('lista'), pie=document.getElementById('pie');
  const porDia={};
  rows.forEach(function(r){ const f=String(r.inicio).slice(0,10); porDia[f]=(porDia[f]||0)+1; });
  const dias=Object.keys(porDia);
  let top='', topN=0;
  dias.forEach(function(f){ if(porDia[f]>topN){ topN=porDia[f]; top=f; } });
  if(!rows.length){
    const nada=(window._leidas||0)===0;
    lista.innerHTML='<div class="vacio"><b>'+(nada?'La pagina no puede leer los permisos todavia':'No hay permisos personales pedidos desde hoy')+'</b>'+
      (nada? 'Falta autorizar la lectura de la base para esta pagina (politica de solo lectura). Mientras tanto, usa el sistema con tu usuario.'
           : 'Cuando alguien pida un permiso personal de dia completo, aparecera aqui con el cupo de su dia.')+'</div>';
    pie.style.display='none';
    return;
  }
  const g=agrupar(rows), hoy=hoyISO();
  // Total de permisos por FECHA (todos los turnos): la regla de 2 cupos es por día
  const cntDia={};
  rows.forEach(function(r){ const f=String(r.inicio).slice(0,10); cntDia[f]=(cntDia[f]||0)+1; });
  let html='', suma=0;
  Object.keys(g).sort().forEach(function(t){
    const fs=Object.keys(g[t]).sort();
    const tot=fs.reduce(function(a,f){ return a+g[t][f].length; },0);
    suma+=tot;
    html+='<section class="turno"><h2><span class="t"><span class="dot"></span>'+esc(t)+'</span>'+
          '<span class="tot">'+tot+' permiso'+(tot===1?'':'s')+'</span></h2>';
    fs.forEach(function(f){
      const pers=g[t][f], p=partes(f);
      const n=cntDia[f]||pers.length;              // el día completo (todos los turnos)
      const est=estadoDia(n);
      html+='<div class="dia'+(f===hoy?' hoy':'')+'">'+
        '<div class="col1"><div class="f">'+esc(p.f)+(f===hoy?'<span class="hoychip">HOY</span>':'')+'</div>'+
          '<div class="dow">'+esc(p.dow)+'</div></div>'+
        '<div class="col3">'+
          '<span class="est '+est.c+'"><span class="d"></span>'+est.t+'</span>'+
          '<span class="numb">'+n+'</span></div>'+
      '</div>';
    });
    html+='</section>';
  });
  lista.innerHTML=html;
  document.getElementById('kSuma').textContent=suma;
  document.getElementById('pieSub').textContent='en '+dias.length+' dia'+(dias.length===1?'':'s');
  pie.style.display='flex';
}
async function cargar(){
  const lista=document.getElementById('lista');
  lista.innerHTML='<div class="vacio">Leyendo los permisos…</div>';
  document.getElementById('aviso').innerHTML='';
  document.getElementById('stamp').textContent='Cargando…';
  try{
    const rows=await traer();
    document.getElementById('stamp').innerHTML='Actualizado <b>'+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})+'</b>';
    pintar(rows);
  }catch(e){
    lista.innerHTML='';
    document.getElementById('stamp').textContent='—';
    document.getElementById('aviso').innerHTML='<div class="err">No se pudo consultar la informacion: '+esc(e&&e.message?e.message:e)+'</div>';
  }
}
cargar();
</script>
</body>
</html>
